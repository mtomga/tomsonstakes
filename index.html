<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TomsonStakes Global Football</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #111;
            color: white;
        }

        .container {
            max-width: 700px;
            margin: auto;
            padding: 30px 20px;
            text-align: center;
        }

        h1 {
            margin-top: 30px;
            font-size: 32px;
        }

        .subtitle {
            color: #ccc;
            margin-bottom: 30px;
        }

        input {
            width: 90%;
            max-width: 450px;
            padding: 15px;
            font-size: 17px;
            border-radius: 8px;
            border: none;
            margin-bottom: 15px;
        }

        button {
            padding: 15px 30px;
            font-size: 17px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        #results {
            margin-top: 30px;
            text-align: left;
        }

        .notice {
            background: #222;
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🔥 TOMSONSTAKES</h1>

    <div class="subtitle">
        GLOBAL FOOTBALL PREDICTION ENGINE
    </div>

    <p>Enter a date to analyze available football matches.</p>

    <input type="date" id="matchDate">

    <br>

    <button onclick="analyzeMatches()">
        ANALYZE MATCHES
    </button>

    <div id="results"></div>

</div>

<script>

async function analyzeMatches() {

    const date = document.getElementById("matchDate").value;
    const results = document.getElementById("results");

    if (!date) {
        results.innerHTML = `
            <div class="notice">
                ⚠️ Please select a match date.
            </div>
        `;
        return;
    }

    results.innerHTML = `
        <div class="notice">
            <h2>🔥 TOMSONSTAKES</h2>
            <p>🔎 Scanning global football fixtures for
            <strong>${date}</strong>...</p>
            <p>⏳ Connecting to live football data...</p>
        </div>
    `;

    try {

        const response = await fetch(
            `/api/fixtures?date=${encodeURIComponent(date)}`
        );

        const data = await response.json();

        if (!response.ok) {
            throw new Error(
                data.message ||
                data.error ||
                "Unable to retrieve football fixtures."
            );
        }

        if (!data.response || data.response.length === 0) {

            results.innerHTML = `
                <div class="notice">
                    <h2>🔥 TOMSONSTAKES</h2>
                    <p>📅 Date: <strong>${date}</strong></p>
                    <p>⚠️ No fixtures were returned for this date.</p>
                </div>
            `;

            return;
        }

        let html = `
            <div class="notice">
                <h2>🔥 TOMSONSTAKES GLOBAL FIXTURES</h2>

                <p>
                    📅 Date:
                    <strong>${date}</strong>
                </p>

                <p>
                    🌍 Fixtures found:
                    <strong>${data.response.length}</strong>
                </p>

                <hr>
            </div>
        `;

        data.response.forEach(match => {

            const league =
                match.league?.name || "Unknown Competition";

            const country =
                match.league?.country || "";

            const home =
                match.teams?.home?.name || "Home Team";

            const away =
                match.teams?.away?.name || "Away Team";

            const kickoffUTC =
                match.fixture?.date;

            let kickoffWAT = "Time unavailable";

            if (kickoffUTC) {

                const dateObject =
                    new Date(kickoffUTC);

                kickoffWAT =
                    dateObject.toLocaleTimeString(
                        "en-NG",
                        {
                            timeZone: "Africa/Lagos",
                            hour: "2-digit",
                            minute: "2-digit",
                            hour12: false
                        }
                    ) + " WAT";
            }

            html += `
                <div class="notice" style="margin-top:15px;">

                    <h3>⚽ ${home} vs ${away}</h3>

                    <p>
                        🏆 <strong>${league}</strong>
                        ${country ? ` — ${country}` : ""}
                    </p>

                    <p>
                        🕐 Kickoff:
                        <strong>${kickoffWAT}</strong>
                    </p>

                    <p>
                        📊 Prediction analysis:
                        <strong>Coming next</strong>
                    </p>

                </div>
            `;
        });

        results.innerHTML = html;

    } catch (error) {

        console.error(error);

        results.innerHTML = `
            <div class="notice">

                <h2>🔥 TOMSONSTAKES</h2>

                <p>❌ Unable to load football fixtures.</p>

                <p>
                    <strong>Error:</strong>
                    ${error.message}
                </p>

                <p>
                    Please try again shortly.
                </p>

            </div>
        `;
    }
}

</script>

</body>
</html>
