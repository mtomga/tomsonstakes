<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TomsonStakes Global Football</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #111;
            color: white;
        }

        .container {
            max-width: 700px;
            margin: auto;
            padding: 30px 20px;
            text-align: center;
        }

        h1 {
            margin-top: 30px;
            font-size: 32px;
        }

        .subtitle {
            color: #ccc;
            margin-bottom: 30px;
        }

        input {
            width: 90%;
            max-width: 450px;
            padding: 15px;
            font-size: 17px;
            border-radius: 8px;
            border: none;
            margin-bottom: 15px;
        }

        button {
            padding: 15px 30px;
            font-size: 17px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        #results {
            margin-top: 30px;
            text-align: left;
        }

        .notice {
            background: #222;
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🔥 TOMSONSTAKES</h1>

    <div class="subtitle">
        GLOBAL FOOTBALL PREDICTION ENGINE
    </div>

    <p>Enter a date to analyze available football matches.</p>

    <input type="date" id="matchDate">

    <br>

    <button onclick="analyzeMatches()">
        ANALYZE MATCHES
    </button>

    <div id="results"></div>

</div>

<script>

function analyzeMatches() {

    const date = document.getElementById("matchDate").value;
    const results = document.getElementById("results");

    if (!date) {
        results.innerHTML = `
            <div class="notice">
                ⚠️ Please select a match date.
            </div>
        `;
        return;
    }

    results.innerHTML = `
        <div class="notice">
            <h2>🔥 TOMSONSTAKES</h2>

            <p>
                Searching football fixtures for:
                <strong>${date}</strong>
            </p>

            <p>
                🌍 Global fixture scanning will be connected here.
            </p>

            <p>
                🇳🇬 Kickoff times will be converted to Nigeria WAT.
            </p>

            <p>
                📊 Form, goals, xG/xGA, BTTS, O/U,
                injuries, lineups, odds and value analysis
                will be added in the next stage.
            </p>

            <p>
                <strong>⚙️ Prediction engine currently being configured.</strong>
            </p>
        </div>
    `;
}

</script>

</body>
</html>
