<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TomsonStakes</title>
</head>

<body>

    <h1>🔥 TOMSONSTAKES</h1>

    <p>Global Football Prediction Engine</p>

    <button onclick="testAPI()">
        TEST FOOTBALL API
    </button>

    <div id="result"></div>

    <script>
        async function testAPI() {

            const result = document.getElementById("result");

            result.innerHTML = "⏳ Testing API...";

            try {

                const response = await fetch(
                    "/api/fixtures?date=2026-09-30"
                );

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(
                        data.error || "API request failed"
                    );
                }

                result.innerHTML = `
                    <h2>✅ API WORKING</h2>
                    <p>Fixtures returned:</p>
                    <strong>
                        ${data.response?.length || 0}
                    </strong>
                `;

            } catch (error) {

                result.innerHTML = `
                    <h2>❌ ERROR</h2>
                    <p>${error.message}</p>
                `;

            }
        }
    </script>

</body>
</html>
