<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TomsonStakes Global Football</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0b0f14;
    color: #ffffff;
}

.container {
    width: 100%;
    max-width: 900px;
    margin: auto;
    padding: 20px;
}

.header {
    text-align: center;
    padding: 25px 10px;
}

.logo {
    font-size: 32px;
    font-weight: bold;
}

.subtitle {
    color: #aeb7c2;
    margin-top: 8px;
}

.card {
    background: #151b23;
    border-radius: 14px;
    padding: 20px;
    margin-top: 18px;
    border: 1px solid #252d38;
}

label {
    display: block;
    margin-bottom: 8px;
    color: #cbd5e1;
    font-weight: bold;
}

input {
    width: 100%;
    padding: 14px;
    border-radius: 9px;
    border: 1px solid #374151;
    background: #0f141b;
    color: white;
    font-size: 16px;
}

button {
    width: 100%;
    padding: 15px;
    margin-top: 15px;
    border: none;
    border-radius: 9px;
    background: #16a34a;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    opacity: 0.9;
}

button:disabled {
    opacity: 0.6;
    cursor: wait;
}

.status {
    margin-top: 18px;
    padding: 14px;
    border-radius: 9px;
    background: #18202a;
    color: #cbd5e1;
}

.success {
    border: 1px solid #166534;
}

.error {
    border: 1px solid #991b1b;
    color: #fecaca;
}

.fixture {
    background: #111820;
    border: 1px solid #293340;
    border-radius: 12px;
    padding: 18px;
    margin-top: 15px;
}

.fixture h3 {
    margin: 0 0 10px;
    font-size: 18px;
}

.league {
    color: #9ca3af;
    font-size: 14px;
    margin-bottom: 12px;
}

.time {
    color: #22c55e;
    font-weight: bold;
}

.analyze-btn {
    background: #2563eb;
    margin-top: 14px;
}

.empty {
    text-align: center;
    padding: 30px 10px;
    color: #9ca3af;
}

.count {
    color: #22c55e;
    font-weight: bold;
}

.hidden {
    display: none;
}

.footer {
    text-align: center;
    color: #6b7280;
    font-size: 12px;
    margin: 30px 0 10px;
}

@media (max-width: 600px) {

    .container {
        padding: 15px;
    }

    .logo {
        font-size: 27px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <div class="logo">🔥 TOMSONSTAKES</div>

        <div class="subtitle">
            GLOBAL FOOTBALL PREDICTION ENGINE
        </div>
    </div>


    <div class="card">

        <label for="matchDate">
            Select Match Date
        </label>

        <input
            type="date"
            id="matchDate"
        >

        <button
            id="analyzeButton"
            onclick="loadFixtures()"
        >
            ANALYZE MATCHES
        </button>

    </div>


    <div
        id="status"
        class="status hidden"
    ></div>


    <div
        id="results"
        class="card hidden"
    ></div>


    <div class="footer">
        TomsonStakes Football Analysis
    </div>

</div>


<script>

async function loadFixtures() {

    const dateInput =
        document.getElementById("matchDate");

    const button =
        document.getElementById("analyzeButton");

    const status =
        document.getElementById("status");

    const results =
        document.getElementById("results");


    const date =
        dateInput.value;


    if (!date) {

        showStatus(
            "Please select a match date.",
            true
        );

        return;
    }


    button.disabled = true;

    button.textContent =
        "LOADING FIXTURES...";


    results.classList.add("hidden");

    showStatus(
        "🔎 Connecting to football data...",
        false
    );


    try {

        const response =
            await fetch(
                "/api/fixtures?date=" +
                encodeURIComponent(date)
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.error ||
                data.message ||
                "Football API request failed."
            );

        }


        /*
         * API-Football normally returns
         * the fixtures inside "response".
         */

        const fixtures =
            Array.isArray(data.response)
                ? data.response
                : [];


        if (fixtures.length === 0) {

            results.innerHTML = `
                <div class="empty">

                    <h2>No Fixtures Found</h2>

                    <p>
                        No football fixtures were
                        returned for
                        <strong>${escapeHtml(date)}</strong>.
                    </p>

                </div>
            `;

            results.classList.remove("hidden");

            showStatus(
                "Search completed.",
                false
            );

            return;
        }


        let html = `

            <h2>
                ⚽ Football Fixtures
            </h2>

            <p>
                Date:
                <strong>${escapeHtml(date)}</strong>
            </p>

            <p>
                Fixtures found:
                <span class="count">
                    ${fixtures.length}
                </span>
            </p>
        `;


        fixtures.forEach(
            (match, index) => {

                const home =
                    match.teams &&
                    match.teams.home &&
                    match.teams.home.name
                        ? match.teams.home.name
                        : "Home Team";


                const away =
                    match.teams &&
                    match.teams.away &&
                    match.teams.away.name
                        ? match.teams.away.name
                        : "Away Team";


                const league =
                    match.league &&
                    match.league.name
                        ? match.league.name
                        : "Unknown Competition";


                const country =
                    match.league &&
                    match.league.country
                        ? match.league.country
                        : "";


                const kickoff =
                    match.fixture &&
                    match.fixture.date
                        ? formatNigeriaTime(
                            match.fixture.date
                        )
                        : "Time unavailable";


                html += `

                    <div class="fixture">

                        <h3>
                            ⚽
                            ${escapeHtml(home)}
                            vs
                            ${escapeHtml(away)}
                        </h3>

                        <div class="league">

                            🏆
                            ${escapeHtml(league)}

                            ${
                                country
                                    ? " — " +
                                      escapeHtml(country)
                                    : ""
                            }

                        </div>

                        <div class="time">

                            🕐
                            ${escapeHtml(kickoff)}

                        </div>


                        <button
                            class="analyze-btn"
                            onclick="openMatchAnalysis(
                                ${index}
                            )"
                        >

                            ANALYZE THIS MATCH

                        </button>

                    </div>
                `;
            }
        );


        results.innerHTML = html;

        results.classList.remove(
            "hidden"
        );


        /*
         * Store fixtures so that
         * the selected match can
         * be used later by the
         * prediction engine.
         */

        window.tomsonFixtures =
            fixtures;


        showStatus(
            "✅ Fixtures loaded successfully.",
            false
        );


    } catch (error) {

        console.error(error);


        showStatus(
            "❌ " + error.message,
            true
        );


        results.classList.add(
            "hidden"
        );

    } finally {

        button.disabled = false;

        button.textContent =
            "ANALYZE MATCHES";

    }

}


/* ============================
   MATCH ANALYSIS
============================ */

function openMatchAnalysis(index) {

    const fixtures =
        window.tomsonFixtures || [];


    const match =
        fixtures[index];


    if (!match) {

        showStatus(
            "Unable to find selected match.",
            true
        );

        return;
    }


    const home =
        match.teams?.home?.name ||
        "Home Team";


    const away =
        match.teams?.away?.name ||
        "Away Team";


    const date =
        match.fixture?.date ||
        "";


    /*
     * For now we display the
     * selected match.

     * Next stage:
     * connect this button to
     * /api/web-data
     * /api/normalize-web
     * /api/predict
     */

    const results =
        document.getElementById(
            "results"
        );


    results.innerHTML = `

        <h2>
            🔥 Match Selected
        </h2>

        <div class="fixture">

            <h3>
                ⚽
                ${escapeHtml(home)}
                vs
                ${escapeHtml(away)}
            </h3>

            <div class="time">

                🕐
                ${escapeHtml(
                    formatNigeriaTime(date)
                )}

            </div>

            <div class="status success">

                Match successfully selected.

                <br><br>

                Prediction analysis engine
                will use this match.

            </div>

            <button
                class="analyze-btn"
                onclick="loadFixtures()"
            >

                ← BACK TO FIXTURES

            </button>

        </div>
    `;


    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}


/* ============================
   STATUS
============================ */

function showStatus(
    message,
    isError
) {

    const status =
        document.getElementById(
            "status"
        );


    status.textContent =
        message;


    status.classList.remove(
        "hidden",
        "error",
        "success"
    );


    if (isError) {

        status.classList.add(
            "error"
        );

    } else {

        status.classList.add(
            "success"
        );

    }

}


/* ============================
   NIGERIA TIME
============================ */

function formatNigeriaTime(
    utcDate
) {

    try {

        const date =
            new Date(utcDate);


        return date.toLocaleString(
            "en-NG",
            {
                timeZone: "Africa/Lagos",
                day: "2-digit",
                month: "short",
                year: "numeric",
                hour: "2-digit",
                minute: "2-digit",
                hour12: false
            }
        ) + " WAT";


    } catch (error) {

        return "Time unavailable";

    }

}


/* ============================
   SECURITY
============================ */

function escapeHtml(
    value
) {

    return String(value)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}

</script>

</body>
</html>
