<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Football Web Data Pipeline Test</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: #f5f5f5;
        }

        h1 {
            font-size: 22px;
        }

        button {
            padding: 14px 20px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            background: #111;
            color: white;
        }

        pre {
            margin-top: 20px;
            padding: 15px;
            background: white;
            border-radius: 8px;
            overflow-x: auto;
            white-space: pre-wrap;
        }
    </style>
</head>

<body>

<h1>Football Web Data Pipeline Test</h1>

<p>
    This test will:
</p>

<ol>
    <li>Call <strong>/api/web-data</strong></li>
    <li>Get real Serper results</li>
    <li>Send those results to <strong>/api/normalize-web</strong></li>
    <li>Display the normalized result</li>
</ol>

<button onclick="runTest()">
    Run Real Pipeline Test
</button>

<pre id="result">Waiting for test...</pre>

<script>

async function runTest() {

    const resultBox =
        document.getElementById("result");

    resultBox.textContent =
        "Step 1: Getting real web data...\n\n";

    try {

        // ------------------------------------------------
        // STEP 1
        // Get REAL Serper data
        // ------------------------------------------------

        const webResponse =
            await fetch(
                "/api/web-data" +
                "?home=" +
                encodeURIComponent("Concepcion") +
                "&away=" +
                encodeURIComponent("O'Higgins") +
                "&date=2026-09-30"
            );

        const webData =
            await webResponse.json();

        if (!webResponse.ok) {

            resultBox.textContent =
                "WEB DATA ERROR:\n\n" +
                JSON.stringify(
                    webData,
                    null,
                    2
                );

            return;
        }

        resultBox.textContent =
            "Step 1 complete.\n\n" +
            "Real web data received.\n\n" +
            "Step 2: Normalizing...\n\n";


        // ------------------------------------------------
        // STEP 2
        // Send REAL web data to normalizer
        // ------------------------------------------------

        const normalizeResponse =
            await fetch(
                "/api/normalize-web",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({

                        home: "Concepcion",

                        away: "O'Higgins",

                        date: "2026-09-30",

                        webData: webData

                    })
                }
            );


        const normalized =
            await normalizeResponse.json();


        // ------------------------------------------------
        // STEP 3
        // Display final result
        // ------------------------------------------------

        resultBox.textContent =
            JSON.stringify(
                normalized,
                null,
                2
            );


    } catch (error) {

        resultBox.textContent =
            "PIPELINE ERROR:\n\n" +
            error.message;

    }

}

</script>

</body>
</html>
