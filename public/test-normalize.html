<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TomsonStakes Form Diagnostic</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            padding: 20px;
        }

        .container {
            max-width: 1100px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #111827;
            color: white;
            border: 0;
            border-radius: 7px;
            font-size: 16px;
            cursor: pointer;
        }

        pre {
            background: #111827;
            color: #e5e7eb;
            padding: 15px;
            border-radius: 8px;
            overflow-x: auto;
            white-space: pre-wrap;
            word-break: break-word;
            font-size: 13px;
        }

        .status {
            padding: 12px;
            margin: 15px 0;
            background: #eef2ff;
            border-radius: 7px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>TomsonStakes Form Diagnostic</h1>

    <p>
        <strong>Match:</strong>
        Deportes Concepcion vs O'Higgins
    </p>

    <p>
        This test inspects the raw V3.14 form-search results
        before normalization.
    </p>

    <button id="runButton" onclick="runDiagnostic()">
        Inspect Raw Form Data
    </button>

    <div id="status" class="status">
        Ready.
    </div>

    <pre id="output"></pre>

</div>

<script>

async function runDiagnostic() {

    const button =
        document.getElementById("runButton");

    const status =
        document.getElementById("status");

    const output =
        document.getElementById("output");

    button.disabled = true;

    status.textContent =
        "Searching raw form data...";

    output.textContent = "";

    try {

        const url =
            `/api/web-data` +
            `?home=${encodeURIComponent("Deportes Concepcion")}` +
            `&homeIdentity=${encodeURIComponent("DEPORTES_CONCEPCION")}` +
            `&away=${encodeURIComponent("O'Higgins")}` +
            `&awayIdentity=${encodeURIComponent("OHIGGINS")}` +
            `&date=${encodeURIComponent("2026-09-30")}`;

        const response =
            await fetch(url);

        const text =
            await response.text();

        let data;

        try {

            data = JSON.parse(text);

        } catch (error) {

            throw new Error(
                "Web Data returned invalid JSON:\n\n" +
                text
            );
        }

        if (!response.ok) {

            throw new Error(
                JSON.stringify(
                    data,
                    null,
                    2
                )
            );
        }

        // =====================================================
        // KEEP ONLY FORM SEARCHES
        // =====================================================

        const formSearches =
            (data.searches || [])
                .filter(search =>
                    String(search.type || "")
                        .startsWith("form_")
                );

        // =====================================================
        // CREATE COMPACT DIAGNOSTIC
        // =====================================================

        const diagnostic = {

            version:
                data.version || null,

            match:
                data.match || null,

            formSearchSummary:
                data.formSearchSummary || null,

            totalFormSearches:
                formSearches.length,

            searches:
                formSearches.map(search => ({

                    type:
                        search.type,

                    team:
                        search.team,

                    teamIdentity:
                        search.teamIdentity,

                    query:
                        search.query,

                    status:
                        search.status,

                    success:
                        search.success,

                    resultCount:
                        Array.isArray(search.results)
                            ? search.results.length
                            : 0,

                    results:
                        (search.results || [])
                            .map(item => ({

                                title:
                                    item.title,

                                link:
                                    item.link,

                                snippet:
                                    item.snippet,

                                date:
                                    item.date
                            }))
                }))
        };

        status.textContent =
            "Diagnostic completed.";

        output.textContent =
            JSON.stringify(
                diagnostic,
                null,
                2
            );

    } catch (error) {

        status.textContent =
            "Diagnostic failed.";

        output.textContent =
            error.message;

    } finally {

        button.disabled = false;
    }
}

</script>

</body>
</html>
