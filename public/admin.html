<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TomsonStakes Admin</title>

<style>
* {
    box-sizing: border-box;
}

:root {
    --bg: #07111f;
    --panel: #0d1b2e;
    --panel2: #10243b;
    --border: #1e3a56;
    --green: #22c55e;
    --green2: #16a34a;
    --blue: #3b82f6;
    --orange: #f97316;
    --red: #ef4444;
    --text: #f8fafc;
    --muted: #94a3b8;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background:
        radial-gradient(circle at top right, #123052 0, transparent 35%),
        linear-gradient(135deg, #06101d, #0b1728 55%, #07111f);
    color: var(--text);
    min-height: 100vh;
}

.container {
    width: 100%;
    max-width: 1400px;
    margin: auto;
    padding: 18px;
}

/* HEADER */

.header {
    background: linear-gradient(
        135deg,
        rgba(17, 35, 58, .96),
        rgba(8, 24, 42, .96)
    );
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 25px;
    margin-bottom: 18px;
    box-shadow: 0 18px 50px rgba(0,0,0,.25);
}

.brand {
    display: flex;
    align-items: center;
    gap: 14px;
}

.brand-icon {
    width: 52px;
    height: 52px;
    display: grid;
    place-items: center;
    border-radius: 15px;
    background: linear-gradient(135deg, #22c55e, #15803d);
    font-size: 25px;
}

.header h1 {
    margin: 0;
    font-size: 27px;
    font-weight: 900;
}

.header p {
    margin: 7px 0 0;
    color: var(--muted);
    font-size: 13px;
}

/* PANELS */

.panel {
    background: rgba(13, 27, 46, .92);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 18px;
    margin-bottom: 18px;
    box-shadow: 0 12px 35px rgba(0,0,0,.18);
}

.panel-title {
    font-size: 17px;
    font-weight: 900;
    margin-bottom: 15px;
}

/* FORM */

.form-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 13px;
}

.form-group {
    display: flex;
    flex-direction: column;
    gap: 7px;
}

label {
    color: #cbd5e1;
    font-size: 10px;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: .5px;
}

input,
select,
textarea {
    width: 100%;
    border: 1px solid #29445f;
    background: #071525;
    color: #fff;
    border-radius: 10px;
    padding: 12px;
    font-size: 14px;
    outline: none;
}

input:focus,
select:focus,
textarea:focus {
    border-color: var(--green);
    box-shadow: 0 0 0 3px rgba(34,197,94,.1);
}

textarea {
    min-height: 100px;
    resize: vertical;
}

/* BUTTONS */

.button-row {
    display: flex;
    flex-wrap: wrap;
    gap: 9px;
    margin-top: 14px;
}

button {
    border: none;
    border-radius: 10px;
    padding: 11px 15px;
    font-size: 12px;
    font-weight: 900;
    cursor: pointer;
    transition: .18s ease;
}

button:hover {
    transform: translateY(-1px);
    filter: brightness(1.08);
}

button:disabled {
    opacity: .55;
    cursor: wait;
    transform: none;
}

.btn-green {
    background: var(--green2);
    color: #fff;
}

.btn-blue {
    background: var(--blue);
    color: #fff;
}

.btn-orange {
    background: var(--orange);
    color: #fff;
}

.btn-red {
    background: var(--red);
    color: #fff;
}

.btn-gray {
    background: #475569;
    color: #fff;
}

/* STATUS */

.status {
    padding: 11px 13px;
    border-radius: 10px;
    margin-top: 12px;
    font-size: 12px;
    font-weight: 800;
}

.status-info {
    background: #dbeafe;
    color: #1e40af;
}

.status-success {
    background: #dcfce7;
    color: #166534;
}

.status-warning {
    background: #fef3c7;
    color: #92400e;
}

.status-error {
    background: #fee2e2;
    color: #991b1b;
}

/* MAIN */

.main-layout {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 350px;
    gap: 18px;
    align-items: start;
}

/* TOOLBAR */

.fixture-toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    margin-bottom: 12px;
}

.fixture-count {
    color: var(--muted);
    font-size: 11px;
}

/* LEAGUES */

.league-section {
    margin-bottom: 18px;
    background: #081522;
    border: 1px solid #213b54;
    border-radius: 14px;
    overflow: hidden;
}

.league-header {
    padding: 14px;
    background: linear-gradient(
        90deg,
        #102a42,
        #0d1c2e
    );
    border-left: 5px solid var(--green);
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.league-name {
    font-size: 16px;
    font-weight: 900;
}

.league-country {
    color: var(--muted);
    font-size: 10px;
    margin-top: 4px;
}

.league-badge {
    background: rgba(34,197,94,.15);
    color: #4ade80;
    border: 1px solid rgba(34,197,94,.35);
    padding: 5px 9px;
    border-radius: 20px;
    font-size: 8px;
    font-weight: 900;
}

/* FIXTURE */

.fixture {
    background: linear-gradient(
        135deg,
        #ffffff,
        #f8fafc
    );
    color: #111827;
    margin: 9px;
    padding: 14px;
    border-radius: 11px;
    border: 2px solid transparent;
    box-shadow: 0 4px 14px rgba(0,0,0,.12);
}

.fixture.selected {
    border-color: var(--green);
    box-shadow:
        0 0 0 3px rgba(34,197,94,.12),
        0 5px 18px rgba(0,0,0,.14);
}

.fixture.has-draft {
    border-left: 5px solid #f59e0b;
}

.fixture.published {
    border-left: 5px solid #22c55e;
}

.fixture-top {
    display: flex;
    justify-content: space-between;
    color: #64748b;
    font-size: 9px;
    font-weight: 800;
}

.fixture-teams {
    display: grid;
    grid-template-columns: 1fr 42px 1fr;
    gap: 8px;
    align-items: center;
    margin-top: 11px;
}

.team {
    font-weight: 900;
    font-size: 14px;
}

.away {
    text-align: right;
}

.vs {
    text-align: center;
    color: #64748b;
    font-weight: 900;
}

.kickoff {
    text-align: center;
    margin-top: 8px;
    color: #475569;
    font-size: 10px;
    font-weight: 800;
}

.fixture-status {
    margin-top: 8px;
    text-align: center;
    font-size: 9px;
    font-weight: 900;
}

.draft-label {
    color: #d97706;
}

.published-label {
    color: #16a34a;
}

.fixture-actions {
    display: flex;
    justify-content: flex-end;
    margin-top: 10px;
    gap: 7px;
}

.select-button {
    background: #2563eb;
    color: #fff;
}

.selected-button {
    background: #16a34a;
    color: #fff;
}

.edit-button {
    background: #7c3aed;
    color: #fff;
}

/* PICKS */

.pick-card {
    background: #081525;
    border: 1px solid #25415d;
    border-radius: 11px;
    padding: 12px;
    margin-bottom: 9px;
}

.pick-number {
    color: #4ade80;
    font-size: 9px;
    font-weight: 900;
}

.pick-teams {
    margin-top: 5px;
    font-size: 13px;
    font-weight: 900;
}

.pick-info {
    margin-top: 7px;
    color: #cbd5e1;
    font-size: 10px;
    line-height: 1.8;
}

.pick-remove {
    margin-top: 8px;
    padding: 7px 10px;
    background: #7f1d1d;
    color: #fff;
    font-size: 9px;
}

.draft-badge {
    display: inline-block;
    background: #78350f;
    color: #fde68a;
    padding: 3px 6px;
    border-radius: 5px;
    font-size: 8px;
}

.published-badge {
    display: inline-block;
    background: #14532d;
    color: #bbf7d0;
    padding: 3px 6px;
    border-radius: 5px;
    font-size: 8px;
}

.empty {
    text-align: center;
    padding: 30px 15px;
    color: #94a3b8;
    font-size: 12px;
}

.saved-title {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
}

@media (max-width: 900px) {
    .main-layout {
        grid-template-columns: 1fr;
    }
}

@media (max-width: 650px) {
    .form-grid {
        grid-template-columns: 1fr;
    }

    .header h1 {
        font-size: 23px;
    }

    .fixture-teams {
        grid-template-columns: 1fr 35px 1fr;
    }

    .team {
        font-size: 12px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="header">

        <div class="brand">

            <div class="brand-icon">
                ⚽
            </div>

            <div>

                <h1>TOMSONSTAKES ADMIN</h1>

                <p>
                    Prediction control center •
                    Draft → Edit → Publish → Daily Slip
                </p>

            </div>

        </div>

    </div>


    <!-- DAILY SLIP -->

    <div class="panel">

        <div class="panel-title">
            🎟️ DAILY SLIP
        </div>

        <div class="form-grid">

            <div class="form-group">

                <label>Prediction Date</label>

                <input
                    type="date"
                    id="predictionDate"
                >

            </div>

            <div class="form-group">

                <label>Booking Code</label>

                <input
                    type="text"
                    id="bookingCode"
                    placeholder="e.g. TS8K4P92"
                >

            </div>

            <div class="form-group">

                <label>Bookmaker</label>

                <input
                    type="text"
                    id="bookmaker"
                    placeholder="e.g. Bet9ja"
                >

            </div>

        </div>

        <div class="button-row">

            <button
                class="btn-blue"
                id="loadButton"
                onclick="loadFixtures()"
            >
                ⚽ LOAD MATCHES
            </button>

            <button
                class="btn-gray"
                onclick="loadSavedPredictions()"
            >
                📂 LOAD SAVED
            </button>

            <button
                class="btn-green"
                onclick="saveDailySlip(false)"
            >
                💾 SAVE SLIP
            </button>

            <button
                class="btn-orange"
                onclick="publishDailySlip()"
            >
                🚀 PUBLISH DAILY SLIP
            </button>

        </div>

        <div id="slipStatus"></div>

    </div>


    <div class="main-layout">

        <!-- FIXTURES -->

        <div>

            <div class="panel">

                <div class="fixture-toolbar">

                    <div class="panel-title" style="margin:0">
                        ⚽ AVAILABLE MATCHES
                    </div>

                    <div
                        class="fixture-count"
                        id="fixtureCount"
                    >
                        No matches loaded
                    </div>

                </div>

                <div id="fixtureStatus"></div>

                <div id="fixtures">

                    <div class="empty">
                        Select a date and click
                        <strong>LOAD MATCHES</strong>.
                    </div>

                </div>

            </div>

        </div>


        <!-- SIDEBAR -->

        <div>

            <div class="panel">

                <div class="panel-title">
                    🎯 PREDICTION EDITOR
                </div>

                <div id="selectedMatchForm">

                    <div class="empty">
                        Select a match.
                    </div>

                </div>

            </div>


            <div class="panel">

                <div class="saved-title">

                    <div class="panel-title">
                        🔥 MY PICKS
                        <span
                            id="pickCount"
                            style="color:#22c55e"
                        >
                            0
                        </span>
                    </div>

                </div>

                <div id="myPicks">

                    <div class="empty">
                        No predictions selected.
                    </div>

                </div>

            </div>

        </div>

    </div>

</div>


<script>

/* =====================================================
   TOP LEAGUES
===================================================== */

const TOP_LEAGUES = [

    "Premier League",
    "La Liga",
    "Bundesliga",
    "Serie A",
    "Ligue 1",

    "UEFA Champions League",
    "UEFA Europa League",
    "UEFA Conference League",

    "Eredivisie",
    "Primeira Liga",
    "Saudi Pro League",
    "Belgian Pro League",
    "Süper Lig",
    "Scottish Premiership",

    "Brasileirão Série A",
    "Liga Profesional Argentina",
    "Liga MX",
    "MLS",
    "J1 League",

    "Championship",
    "2. Bundesliga",
    "Serie B",
    "Ligue 2",
    "LaLiga 2",

    "Copa Libertadores",
    "Copa Sudamericana",

    "CAF Champions League",
    "CAF Confederation Cup"
];


/* =====================================================
   STATE
===================================================== */

let allFixtures = [];

let selectedFixtures = {};

let savedPredictions = {};

let activeFixtureId = null;


/* =====================================================
   INITIAL DATE
===================================================== */

document.addEventListener(
    "DOMContentLoaded",
    function() {

        const input =
            document.getElementById(
                "predictionDate"
            );

        const now =
            new Date();

        input.value =
            now.getFullYear() +
            "-" +
            String(
                now.getMonth() + 1
            ).padStart(2, "0") +
            "-" +
            String(
                now.getDate()
            ).padStart(2, "0");

    }
);


/* =====================================================
   LOAD FIXTURES
===================================================== */

async function loadFixtures() {

    const date =
        document.getElementById(
            "predictionDate"
        ).value;

    const button =
        document.getElementById(
            "loadButton"
        );

    const box =
        document.getElementById(
            "fixtures"
        );

    const status =
        document.getElementById(
            "fixtureStatus"
        );


    if (!date) {

        showStatus(
            status,
            "Select a date first.",
            "warning"
        );

        return;
    }


    button.disabled = true;

    box.innerHTML = `
        <div class="empty">
            🔎 Loading matches...
        </div>
    `;


    try {

        const response =
            await fetch(
                "/api/fixtures?date=" +
                encodeURIComponent(date)
            );


        const data =
            await readJsonResponse(
                response
            );


        if (!response.ok) {

            throw new Error(
                data.error ||
                data.message ||
                "Unable to load fixtures."
            );
        }


        let fixtures = [];


        if (
            Array.isArray(
                data.response
            )
        ) {

            fixtures =
                data.response;

        } else if (
            Array.isArray(
                data.fixtures
            )
        ) {

            fixtures =
                data.fixtures;

        } else if (
            Array.isArray(
                data.data
            )
        ) {

            fixtures =
                data.data;

        }


        allFixtures =
            normalizeFixtures(
                fixtures
            );


        await loadSavedPredictions();


        renderFixtures();


        if (!allFixtures.length) {

            box.innerHTML = `
                <div class="empty">
                    ⚠️ No matches found for
                    ${escapeHtml(date)}.
                </div>
            `;

        }

    }

    catch (error) {

        console.error(error);

        box.innerHTML = `
            <div class="status status-error">
                ❌ ${escapeHtml(
                    error.message
                )}
            </div>
        `;

    }

    finally {

        button.disabled = false;

    }
}


/* =====================================================
   LOAD SAVED PREDICTIONS
===================================================== */

async function loadSavedPredictions() {

    const date =
        document.getElementById(
            "predictionDate"
        ).value;


    if (!date) {

        return;
    }


    try {

        const response =
            await fetch(
                "/api/predictions?date=" +
                encodeURIComponent(date)
            );


        const data =
            await readJsonResponse(
                response
            );


        if (!response.ok) {

            throw new Error(
                data.error ||
                data.message ||
                "Unable to load saved predictions."
            );
        }


        const predictions =
            Array.isArray(
                data.predictions
            )
            ?
            data.predictions
            :
            [];


        savedPredictions = {};


        predictions.forEach(
            function(prediction) {

                if (
                    prediction.fixture_id
                ) {

                    savedPredictions[
                        String(
                            prediction.fixture_id
                        )
                    ] =
                        prediction;

                }

            }
        );


        /*
         * Merge saved records into selectedFixtures.
         */

        predictions.forEach(
            function(prediction) {

                if (
                    !prediction.fixture_id
                ) {

                    return;
                }


                const id =
                    String(
                        prediction.fixture_id
                    );


                const fixture =
                    allFixtures.find(
                        function(item) {

                            return String(
                                item.fixture.id
                            ) === id;

                        }
                    );


                if (!fixture) {

                    return;
                }


                selectedFixtures[id] = {

                    match:
                        fixture,

                    dbId:
                        prediction.id,

                    market:
                        prediction.market ||
                        "Match Winner",

                    selection:
                        prediction.selection ||
                        "",

                    confidence:
                        Number(
                            prediction.confidence
                        ) || 5,

                    analysis:
                        prediction.analysis ||
                        "",

                    status:
                        normalizeStatus(
                            prediction.status
                        ),

                    result:
                        normalizeResult(
                            prediction.result
                        )

                };

            }
        );


        renderMyPicks();

    }

    catch (error) {

        console.error(
            "Saved prediction loading error:",
            error
        );

    }
}


/* =====================================================
   NORMALIZE FIXTURES
===================================================== */

function normalizeFixtures(
    fixtures
) {

    return fixtures
        .map(function(item) {

            if (
                item.fixture &&
                item.teams
            ) {

                return item;
            }


            return {

                fixture: {

                    id:
                        item.fixture_id ||
                        item.id,

                    date:
                        item.kickoff ||
                        item.fixture_date,

                    timestamp:
                        item.timestamp ||
                        null

                },

                league: {

                    id:
                        item.league_id ||
                        item.league,

                    name:
                        item.league ||
                        "Unknown League",

                    country:
                        item.country ||
                        "Other",

                    round:
                        item.round ||
                        ""

                },

                teams: {

                    home: {

                        id:
                            item.home_team_id ||
                            null,

                        name:
                            item.home_team ||
                            "Home Team"

                    },

                    away: {

                        id:
                            item.away_team_id ||
                            null,

                        name:
                            item.away_team ||
                            "Away Team"

                    }

                }

            };

        })
        .filter(function(item) {

            return (
                item.fixture &&
                item.fixture.id
            );

        });
}


/* =====================================================
   GROUP BY LEAGUE
===================================================== */

function groupByLeague(
    fixtures
) {

    const groups = {};


    fixtures.forEach(
        function(match) {

            const league =
                match.league || {};


            const key =
                String(
                    league.id ||
                    league.name ||
                    "unknown"
                );


            if (!groups[key]) {

                groups[key] = {

                    id:
                        key,

                    name:
                        league.name ||
                        "Unknown League",

                    country:
                        league.country ||
                        "Other",

                    round:
                        league.round ||
                        "",

                    fixtures: []

                };

            }


            groups[key]
                .fixtures
                .push(match);

        }
    );


    return groups;
}


/* =====================================================
   RENDER FIXTURES
===================================================== */

function renderFixtures() {

    const box =
        document.getElementById(
            "fixtures"
        );


    const groups =
        groupByLeague(
            allFixtures
        );


    const leagues =
        Object.values(
            groups
        )
        .sort(
            function(a, b) {

                const pa =
                    getLeaguePriority(
                        a.name
                    );

                const pb =
                    getLeaguePriority(
                        b.name
                    );


                if (pa !== pb) {

                    return pa - pb;

                }


                return a.name.localeCompare(
                    b.name
                );

            }
        );


    let html = "";


    leagues.forEach(
        function(league) {

            html +=
                buildLeagueHTML(
                    league
                );

        }
    );


    box.innerHTML =
        html;


    document.getElementById(
        "fixtureCount"
    ).textContent =
        allFixtures.length +
        " matches";
}


/* =====================================================
   BUILD LEAGUE
===================================================== */

function buildLeagueHTML(
    league
) {

    const priority =
        getLeaguePriority(
            league.name
        );


    const fixtures =
        [...league.fixtures]
        .sort(
            function(a, b) {

                return (
                    Number(
                        a.fixture?.timestamp ||
                        0
                    ) -
                    Number(
                        b.fixture?.timestamp ||
                        0
                    )
                );

            }
        );


    let html = `

        <section class="league-section">

            <div class="league-header">

                <div>

                    <div class="league-name">
                        🏆
                        ${escapeHtml(
                            league.name
                        )}
                    </div>

                    <div class="league-country">
                        ${escapeHtml(
                            league.country
                        )}

                        ${
                            league.round
                            ?
                            " • " +
                            escapeHtml(
                                league.round
                            )
                            :
                            ""
                        }

                    </div>

                </div>

                ${
                    priority < 1000
                    ?
                    `<div class="league-badge">
                        TOP LEAGUE
                    </div>`
                    :
                    ""
                }

            </div>
    `;


    fixtures.forEach(
        function(match) {

            html +=
                buildFixtureHTML(
                    match
                );

        }
    );


    html += `</section>`;


    return html;
}


/* =====================================================
   BUILD FIXTURE
===================================================== */

function buildFixtureHTML(
    match
) {

    const id =
        String(
            match.fixture.id
        );


    const selected =
        Boolean(
            selectedFixtures[id]
        );


    const saved =
        savedPredictions[id];


    const status =
        saved
        ?
        normalizeStatus(
            saved.status
        )
        :
        "";


    const home =
        match.teams?.home?.name ||
        "Home Team";


    const away =
        match.teams?.away?.name ||
        "Away Team";


    const kickoff =
        formatKickoff(
            match.fixture.date,
            match.fixture.timestamp
        );


    let stateClass = "";

/* =====================================================
   SELECT FIXTURE
===================================================== */

function selectFixture(
    id
) {

    id =
        String(id);


    const match =
        allFixtures.find(
            function(item) {

                return String(
                    item.fixture.id
                ) === id;

            }
        );


    if (!match) {

        return;
    }


    if (!selectedFixtures[id]) {

        const saved =
            savedPredictions[id];


        selectedFixtures[id] = {

            match:
                match,

            dbId:
                saved?.id ||
                null,

            market:
                saved?.market ||
                "Match Winner",

            selection:
                saved?.selection ||
                match.teams?.home?.name ||
                "",

            confidence:
                Number(
                    saved?.confidence
                ) || 5,

            analysis:
                saved?.analysis ||
                "",

            status:
                normalizeStatus(
                    saved?.status ||
                    "DRAFT"
                ),

            result:
                normalizeResult(
                    saved?.result ||
                    "PENDING"
                )

        };

    }


    activeFixtureId =
        id;


    renderFixtures();

    renderSelectedForm();

    renderMyPicks();
}


/* =====================================================
   EDIT SAVED PREDICTION
===================================================== */

function editSavedPrediction(
    id
) {

    id =
        String(id);


    const item =
        selectedFixtures[id];


    if (!item) {

        selectFixture(id);

        return;
    }


    activeFixtureId =
        id;


    renderSelectedForm();

    renderMyPicks();


    const editor =
        document.getElementById(
            "selectedMatchForm"
        );


    if (editor) {

        editor.scrollIntoView({
            behavior: "smooth",
            block: "start"
        });

    }
}

/* =====================================================
   SUBMIT / UPDATE PREDICTION
===================================================== */

async function submitPrediction(
    desiredStatus
) {

    updateActivePick();


    const item =
        selectedFixtures[
            activeFixtureId
        ];


    if (!item) {

        return false;
    }


    const match =
        item.match;


    const date =
        document.getElementById(
            "predictionDate"
        ).value;


    const statusBox =
        document.getElementById(
            "predictionStatus"
        );


    if (!date) {

        statusBox.innerHTML = `
            <div class="status status-error">
                ❌ Prediction date is required.
            </div>
        `;

        return false;
    }


    if (!item.selection.trim()) {

        statusBox.innerHTML = `
            <div class="status status-error">
                ❌ Enter your prediction.
            </div>
        `;

        return false;
    }


    if (
        !Number.isInteger(
            item.confidence
        ) ||
        item.confidence < 5 ||
        item.confidence > 10
    ) {

        statusBox.innerHTML = `
            <div class="status status-error">
                ❌ Confidence must be between 5 and 10.
            </div>
        `;

        return false;
    }


    statusBox.innerHTML = `
        <div class="status status-info">
            ⏳ ${
                item.dbId
                ?
                "Updating prediction..."
                :
                "Creating prediction..."
            }
        </div>
    `;


    try {

        let response;


        const payload = {

            prediction_date:
                date,

            fixture_id:
                match.fixture?.id ||
                null,

            home_team:
                match.teams?.home?.name ||
                "",

            away_team:
                match.teams?.away?.name ||
                "",

            home_team_id:
                match.teams?.home?.id ||
                null,

            away_team_id:
                match.teams?.away?.id ||
                null,

            country:
                match.league?.country ||
                null,

            league:
                match.league?.name ||
                null,

            kickoff:
                match.fixture?.date ||
                null,

            market:
                item.market,

            selection:
                item.selection,

            confidence:
                Number(
                    item.confidence
                ),

            analysis:
                item.analysis ||
                null,

            status:
                desiredStatus,

            result:
                "PENDING"
        };


        /*
         * EXISTING RECORD
         *
         * PATCH instead of POST.
         */

        if (item.dbId) {

            response =
                await fetch(
                    "/api/predictions?id=" +
                    encodeURIComponent(
                        item.dbId
                    ),
                    {

                        method: "PATCH",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify(
                                payload
                            )
                    }
                );

        }

        /*
         * NEW RECORD
         */

        else {

            response =
                await fetch(
                    "/api/predictions",
                    {

                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify(
                                payload
                            )
                    }
                );

        }


        const data =
            await readJsonResponse(
                response
            );


        if (!response.ok) {

            throw new Error(
                data.error ||
                data.message ||
                "Unable to save prediction."
            );
        }


        /*
         * IMPORTANT:
         *
         * Save the database ID returned
         * by POST/PATCH.
         */

        const saved =
            data.prediction ||
            data.data;


        if (saved?.id) {

            item.dbId =
                saved.id;
        }


        item.status =
            normalizeStatus(
                desiredStatus
            );


        item.result =
            "PENDING";


        savedPredictions[
            String(
                match.fixture.id
            )
        ] = {

            ...(saved || {}),
            id:
                item.dbId,
            fixture_id:
                match.fixture.id,
            status:
                item.status
        };


        statusBox.innerHTML = `
            <div class="status status-success">

                ${
                    desiredStatus === "PUBLISHED"
                    ?
                    "🚀 Prediction published successfully."
                    :
                    "💾 Draft saved successfully."
                }

            </div>
        `;


        renderFixtures();

        renderMyPicks();

        return true;

    }

    catch (error) {

        console.error(
            "Prediction save error:",
            error
        );


        statusBox.innerHTML = `
            <div class="status status-error">
                ❌ ${escapeHtml(
                    error.message
                )}
            </div>
        `;


        return false;
    }
}

/* =====================================================
   DAILY SLIP
===================================================== */

async function saveDailySlip(
    publish
) {

    const date =
        document.getElementById(
            "predictionDate"
        ).value;


    const bookingCode =
        document.getElementById(
            "bookingCode"
        ).value.trim();


    const bookmaker =
        document.getElementById(
            "bookmaker"
        ).value.trim();


    const statusBox =
        document.getElementById(
            "slipStatus"
        );


    if (!date) {

        showStatus(
            statusBox,
            "Select a prediction date.",
            "error"
        );

        return false;
    }


    if (
        publish &&
        !bookingCode
    ) {

        showStatus(
            statusBox,
            "Enter the booking code before publishing.",
            "warning"
        );

        return false;
    }


    statusBox.innerHTML = `
        <div class="status status-info">
            ⏳ ${
                publish
                ?
                "Publishing daily slip..."
                :
                "Saving daily slip..."
            }
        </div>
    `;


    try {

        const response =
            await fetch(
                "/api/predictions",
                {

                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            type:
                                "daily_slip",

                            prediction_date:
                                date,

                            booking_code:
                                bookingCode ||
                                null,

                            bookmaker:
                                bookmaker ||
                                null,

                            status:
                                publish
                                ?
                                "published"
                                :
                                "draft"

                        })
                }
            );


        const data =
            await readJsonResponse(
                response
            );


        if (!response.ok) {

            throw new Error(
                data.error ||
                data.message ||
                "Unable to save daily slip."
            );
        }


        showStatus(
            statusBox,

            publish
            ?
            "🚀 Daily slip published successfully."
            :
            "💾 Daily slip saved successfully.",

            "success"
        );


        return true;

    }

    catch (error) {

        console.error(error);

        showStatus(
            statusBox,
            error.message,
            "error"
        );

        return false;
    }
}


/* =====================================================
   PUBLISH DAILY SLIP
===================================================== */

async function publishDailySlip() {

    const picks =
        Object.values(
            selectedFixtures
        );


    if (!picks.length) {

        showStatus(
            document.getElementById(
                "slipStatus"
            ),
            "Select at least one prediction first.",
            "warning"
        );

        return;
    }


    const bookingCode =
        document.getElementById(
            "bookingCode"
        ).value.trim();


    if (!bookingCode) {

        showStatus(
            document.getElementById(
                "slipStatus"
            ),
            "Enter the booking code first.",
            "warning"
        );

        return;
    }


    /*
     * First publish/update every prediction.
     */

    for (
        const item of picks
    ) {

        if (
            item.status ===
            "PUBLISHED"
        ) {

            continue;
        }


        activeFixtureId =
            String(
                item.match.fixture.id
            );


        const success =
            await submitPrediction(
                "PUBLISHED"
            );


        if (!success) {

            return;
        }

    }


    /*
     * Only after every prediction succeeds,
     * publish the daily slip.
     */

    await saveDailySlip(
        true
    );
}

function removeActivePick() {

    if (
        activeFixtureId === null
    ) {

        return;
    }


    const item =
        selectedFixtures[
            activeFixtureId
        ];


    /*
     * Do not delete an existing database row
     * here. This only removes it from the
     * current admin selection.
     */

    delete selectedFixtures[
        activeFixtureId
    ];


    activeFixtureId =
        null;


    renderFixtures();

    renderSelectedForm();

    renderMyPicks();
}


/* =====================================================
   JSON RESPONSE
===================================================== */

async function readJsonResponse(
    response
) {

    const raw =
        await response.text();


    let data;


    try {

        data =
            JSON.parse(raw);

    }

    catch (error) {

        console.error(
            "Non-JSON server response:",
            raw
        );


        throw new Error(
            "Server returned an invalid response. Check the Vercel function logs."
        );

    }


    return data;
}


/* =====================================================
   STATUS
===================================================== */

function showStatus(
    element,

    type
) {

    element.innerHTML = `
        <div class="status status-${type}">

        </div>
    `;

/* =====================================================
   STATUS NORMALIZATION
===================================================== */

function normalizeStatus(
    status
) {

    const value =
        String(
            status || "DRAFT"
        )
        .toUpperCase();


    if (
        value === "PUBLISHED"
    ) {

        return "PUBLISHED";
    }


    if (
        value === "UNPUBLISHED"
    ) {

        return "UNPUBLISHED";
    }


    return "DRAFT";
}


function normalizeResult(
    result
) {

    const value =
        String(
            result || "PENDING"
        )
        .toUpperCase();


    if (
        [
            "PENDING",
            "WIN",
            "LOSS",
            "VOID"
        ].includes(value)
    ) {

        return value;
    }


    return "PENDING";
}


/* =====================================================
   KICKOFF
===================================================== */

function formatKickoff(
    date,
    timestamp
) {

    try {

        let d;


        if (timestamp) {

            d =
                new Date(
                    Number(timestamp) *
                    1000
                );

        } else if (date) {

            d =
                new Date(date);

        } else {

            return "Time unavailable";
        }


        return d.toLocaleString(
            "en-NG",
            {

                timeZone:
                    "Africa/Lagos",

                day:
                    "2-digit",

                month:
                    "short",

                hour:
                    "2-digit",

                minute:
                    "2-digit",

                hour12:
                    false

            }
        ) + " WAT";

    }

    catch {

        return "Time unavailable";
    }
}


/* =====================================================
   LEAGUE PRIORITY
===================================================== */

function getLeaguePriority(
    name
) {

    const normalized =
        normalizeLeagueName(
            name
        );


    for (
        let i = 0;
        i < TOP_LEAGUES.length;
        i++
    ) {

        const target =
            normalizeLeagueName(
                TOP_LEAGUES[i]
            );


        if (
            normalized === target ||
            normalized.includes(target) ||
            target.includes(normalized)
        ) {

            return i;
        }

    }


    return 1000;
}


/* =====================================================
   LEAGUE NORMALIZATION
===================================================== */

function normalizeLeagueName(
    name
) {

    return String(
        name || ""
    )
    .normalize("NFD")
    .replace(
        /[\u0300-\u036f]/g,
        ""
    )
    .toLowerCase()
    .replace(
        /[^a-z0-9]+/g,
        " "
    )
    .trim();
}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(
    value
) {

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );
}


/* =====================================================
   ESCAPE JAVASCRIPT
===================================================== */

function escapeJs(
    value
) {

    return String(
        value ?? ""
    )
    .replace(
        /\\/g,
        "\\\\"
    )
    .replace(
        /'/g,
        "\\'"
    )
    .replace(
        /"/g,
        '\\"'
    )
    .replace(
        /\n/g,
        "\\n"
    )
    .replace(
        /\r/g,
        "\\r"
    );
}

</script>
