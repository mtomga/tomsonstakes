<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>TomsonStakes Admin</title>

  <style>
    :root {
      --bg: #07130d;
      --panel: #0d2117;
      --panel2: #10291c;
      --border: rgba(255,255,255,.09);
      --text: #f4fff7;
      --muted: #9bb5a5;
      --green: #20e875;
      --green-dark: #0b7a3b;
      --red: #ff5d6c;
      --yellow: #ffd166;
      --blue: #62a8ff;
      --shadow: 0 20px 50px rgba(0,0,0,.25);
      --radius: 18px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Inter, Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at top right, rgba(32,232,117,.08), transparent 30%),
        radial-gradient(circle at top left, rgba(98,168,255,.05), transparent 25%),
        var(--bg);
      color: var(--text);
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .container {
      width: min(1400px, 94%);
      margin: 0 auto;
      padding: 28px 0 60px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-bottom: 25px;
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .logo {
      width: 52px;
      height: 52px;
      border-radius: 15px;
      background: linear-gradient(135deg, var(--green), #0ea65a);
      color: #03220f;
      display: grid;
      place-items: center;
      font-size: 25px;
      font-weight: 900;
      box-shadow: 0 10px 30px rgba(32,232,117,.18);
    }

    h1,
    h2,
    h3 {
      margin: 0;
    }

    .brand h1 {
      font-size: 25px;
    }

    .brand p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .date-control {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--panel);
      border: 1px solid var(--border);
      padding: 9px;
      border-radius: 14px;
    }

    input,
    select,
    textarea {
      width: 100%;
      border: 1px solid var(--border);
      background: #081810;
      color: var(--text);
      border-radius: 11px;
      padding: 11px 12px;
      outline: none;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: rgba(32,232,117,.7);
      box-shadow: 0 0 0 3px rgba(32,232,117,.08);
    }

    .date-control input {
      width: 155px;
    }

    .btn {
      border: 0;
      border-radius: 11px;
      padding: 11px 15px;
      font-weight: 800;
      transition: .18s ease;
    }

    .btn:hover {
      transform: translateY(-1px);
    }

    .btn-primary {
      background: var(--green);
      color: #03220f;
    }

    .btn-secondary {
      background: #183525;
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-danger {
      background: rgba(255,93,108,.12);
      color: #ff8792;
      border: 1px solid rgba(255,93,108,.22);
    }

    .btn-blue {
      background: rgba(98,168,255,.12);
      color: var(--blue);
      border: 1px solid rgba(98,168,255,.22);
    }

    .status {
      margin-bottom: 18px;
      padding: 13px 15px;
      border-radius: 13px;
      display: none;
      font-size: 14px;
    }

    .status.show {
      display: block;
    }

    .status.success {
      background: rgba(32,232,117,.09);
      border: 1px solid rgba(32,232,117,.2);
      color: #9cffc3;
    }

    .status.error {
      background: rgba(255,93,108,.09);
      border: 1px solid rgba(255,93,108,.2);
      color: #ffadb5;
    }

    .status.info {
      background: rgba(98,168,255,.09);
      border: 1px solid rgba(98,168,255,.2);
      color: #a9ceff;
    }

    .grid {
      display: grid;
      grid-template-columns: minmax(0, 1.5fr) minmax(340px, .8fr);
      gap: 20px;
      align-items: start;
    }

    .card {
      background: linear-gradient(
        180deg,
        rgba(16,41,28,.96),
        rgba(9,28,18,.96)
      );
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .card-header {
      padding: 18px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .card-header h2 {
      font-size: 17px;
    }

      color: var(--muted);
