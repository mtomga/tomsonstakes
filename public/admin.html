<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>TomsonStakes Admin</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family:
        Arial,
        Helvetica,
        sans-serif;
    background: #0f172a;
    color: #ffffff;
}

.container {
    width: 100%;
    max-width: 1250px;
    margin: auto;
    padding: 20px;
}

h1,
h2,
h3 {
    margin-top: 0;
}

.header {
    margin-bottom: 20px;
}

.header h1 {
    margin-bottom: 5px;
}

.header p {
    margin: 0;
    color: #94a3b8;
}

.panel {
    background: #111827;
    border: 1px solid #1e293b;
    border-radius: 12px;
    padding: 18px;
    margin-bottom: 20px;
}

.daily-grid {
    display: grid;
    grid-template-columns:
        repeat(4, 1fr);
    gap: 12px;
}

.main-grid {
    display: grid;
    grid-template-columns:
        1.15fr
        0.85fr;
    gap: 20px;
}

label {
    display: block;
    margin-bottom: 6px;
    font-size: 13px;
    color: #cbd5e1;
}

input,
select,
textarea {
    width: 100%;
    padding: 11px;
    border-radius: 8px;
    border: 1px solid #334155;
    background: #020617;
    color: #ffffff;
    outline: none;
}

textarea {
    min-height: 120px;
    resize: vertical;
}

input:focus,
select:focus,
textarea:focus {
    border-color: #64748b;
}

button {
    border: none;
    border-radius: 8px;
    padding: 11px 15px;
    cursor: pointer;
    font-weight: bold;
}

.btn {
    background: #334155;
    color: white;
}

.btn:hover {
    opacity: 0.9;
}

.btn-primary {
    background: #2563eb;
    color: white;
}

.btn-success {
    background: #16a34a;
    color: white;
}

.btn-danger {
    background: #dc2626;
    color: white;
}

.btn-warning {
    background: #d97706;
    color: white;
}

.actions {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-top: 12px;
}

.status {
    margin-top: 12px;
    padding: 10px;
    border-radius: 8px;
    background: #020617;
    color: #94a3b8;
}

.league {
    margin-bottom: 18px;
}

.league-title {
    background: #1e293b;
    padding: 10px 12px;
    border-radius: 8px;
    margin-bottom: 8px;
    font-weight: bold;
}

.top-league {
    border-left: 4px solid #22c55e;
}

.fixture {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    padding: 12px;
    margin-bottom: 8px;
    background: #020617;
    border: 1px solid #1e293b;
    border-radius: 8px;
}

.fixture-info {
    min-width: 0;
}

.fixture-teams {
    font-weight: bold;
    margin-bottom: 5px;
}

.fixture-meta {
    font-size: 12px;
    color: #94a3b8;
}

.fixture button {
    flex-shrink: 0;
}

.selected {
    border-color: #2563eb;
}

.pick {
    padding: 12px;
    margin-bottom: 10px;
    border: 1px solid #334155;
    border-radius: 8px;
    background: #020617;
}

.pick-title {
    font-weight: bold;
    margin-bottom: 6px;
}

.pick-meta {
    color: #94a3b8;
    font-size: 12px;
    line-height: 1.6;
}

.badge {
    display: inline-block;
    padding: 4px 8px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: bold;
    margin-top: 6px;
}

.badge-draft {
    background: #78350f;
}

.badge-published {
    background: #166534;
}

.badge-unpublished {
    background: #475569;
}

.empty {
    padding: 20px;
    text-align: center;
    color: #64748b;
}

.small {
    font-size: 12px;
    color: #94a3b8;
}

@media (max-width: 850px) {

    .daily-grid {
        grid-template-columns: 1fr 1fr;
    }

    .main-grid {
        grid-template-columns: 1fr;
    }

}

@media (max-width: 550px) {

    .daily-grid {
        grid-template-columns: 1fr;
    }

    .fixture {
        align-items: flex-start;
        flex-direction: column;
    }

}

</style>

</head>


<body>

<div class="container">

    <div class="header">

        <h1>TomsonStakes Admin</h1>

        <p>
            Football prediction management
        </p>

    </div>


    <!-- =================================================
         DAILY SLIP
    ================================================== -->

    <div class="panel">

        <h2>Daily Slip</h2>

        <div class="daily-grid">

            <div>

                <label>
                    Prediction Date
                </label>

                <input
                    type="date"
                    id="predictionDate"
                >

            </div>


            <div>

                <label>
                    Booking Code
                </label>

                <input
                    type="text"
                    id="bookingCode"
                    placeholder="e.g. ABC123"
                >

            </div>


            <div>

                <label>
                    Bookmaker
                </label>

                <input
                    type="text"
                    id="bookmaker"
                    placeholder="e.g. Bet9ja"
                >

            </div>

            <div class="actions">

                <button
                    class="btn-primary"
                    onclick="loadFixtures()"
                >
                    LOAD MATCHES
                </button>

                <button
                    class="btn"
                    onclick="saveDailySlip(false)"
                >
                    SAVE SLIP
                </button>

                <button
                    class="btn-success"
                    onclick="publishDailySlip()"
                >
                    PUBLISH DAILY SLIP
                </button>

            </div>

        </div>

        <div
            id="pageStatus"
            class="status"
        >
            Ready.
        </div>

    </div>


    <!-- =================================================
         MAIN
    ================================================== -->

    <div class="main-grid">


        <!-- =============================================
             FIXTURES
        ============================================== -->

        <div class="panel">

            <h2>Fixtures</h2>

            <div
                id="fixturesContainer"
            >
                <div class="empty">
                    Select a date and load matches.
                </div>
            </div>

        </div>


        <!-- =============================================
             EDITOR
        ============================================== -->

        <div>

            <div class="panel">

                <h2>
                    Prediction Editor
                </h2>

                <div
                    id="predictionEditor"
                >

                    <div class="empty">
                        Select a fixture.
                    </div>

                </div>

            </div>


            <div class="panel">

                <h2>
                    My Picks
                </h2>

                <div
                    id="myPicks"
                >

                    <div class="empty">
                        No selected predictions.
                    </div>

                </div>

            </div>

        </div>

    </div>

</div>


<script>

/* =====================================================
   GLOBAL STATE
===================================================== */

let allFixtures = [];

let selectedFixtures = {};

let activeFixtureId = null;


/* =====================================================
   TOP LEAGUES
===================================================== */

const TOP_LEAGUES = [

    "Premier League",

    "La Liga",

    "Bundesliga",

    "Serie A",

    "Ligue 1",

    "UEFA Champions League",

    "Europa League",

    "Conference League",

    "Eredivisie",

    "Primeira Liga",

    "Saudi Pro League",

    "Belgian Pro League",

    "Süper Lig",

    "Scottish Premiership",

    "Brasileirão Série A",

    "Liga Profesional Argentina",

    "Liga MX",

    "MLS",

    "J1 League",

    "Championship",

    "2. Bundesliga",

    "Serie B",

    "Ligue 2",

    "LaLiga 2",

    "Copa Libertadores",

    "Copa Sudamericana",

    "CAF Champions League",

    "CAF Confederation Cup"

];


/* =====================================================
   STATUS NORMALIZATION
===================================================== */

function normalizeStatus(status) {

    const value =
        String(
            status || "DRAFT"
        )
        .trim()
        .toUpperCase();

    const allowed = [
        "DRAFT",
        "PUBLISHED",
        "UNPUBLISHED"
    ];

    return allowed.includes(value)
        ? value
        : "DRAFT";
}


/* =====================================================
   RESULT NORMALIZATION
===================================================== */

function normalizeResult(result) {

    const value =
        String(
            result || "PENDING"
        )
        .trim()
        .toUpperCase();

    const allowed = [
        "PENDING",
        "WIN",
        "LOSS",
        "VOID"
    ];

    return allowed.includes(value)
        ? value
        : "PENDING";
}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value) {

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


/* =====================================================
   STATUS BADGE
===================================================== */

function statusBadge(status) {

    const normalized =
        normalizeStatus(status);

    const cls =
        normalized
            .toLowerCase();

    return `
        <span class="badge badge-${cls}">
            ${normalized}
        </span>
    `;

}


/* =====================================================
   PAGE STATUS
===================================================== */

function setPageStatus(message) {

    const element =
        document.getElementById(
            "pageStatus"
        );

    if (element) {

        element.textContent =
            message;

    }

}


/* =====================================================
   LOAD FIXTURES
===================================================== */

async function loadFixtures() {

    const date =
        document.getElementById(
            "predictionDate"
        ).value;


    if (!date) {

        alert(
            "Please select a prediction date."
        );

        return;

    }


    setPageStatus(
        "Loading fixtures..."
    );


    try {

        const response =
            await fetch(
                "/api/fixtures?date=" +
                encodeURIComponent(date)
            );


        const raw =
            await response.text();


        let data;

        try {

            data =
                raw
                    ? JSON.parse(raw)
                    : {};

        } catch (error) {

            throw new Error(
                "Fixtures API returned invalid JSON: " +
                raw.substring(0, 300)
            );

        }


        if (!response.ok) {

            throw new Error(
                data.error ||
                "Failed to load fixtures."
            );

        }


        let fixtures =
            data.response ||
            data.fixtures ||
            data.data ||
            data;


        if (!Array.isArray(fixtures)) {

            fixtures = [];

        }


        allFixtures =
            normalizeFixtures(
                fixtures
            );


        selectedFixtures = {};

        activeFixtureId = null;


        renderFixtures();

        renderSelectedForm();

        renderMyPicks();


        setPageStatus(
            allFixtures.length +
            " fixtures loaded."
        );


    } catch (error) {

        console.error(
            "Load fixtures error:",
            error
        );

        setPageStatus(
            "Error: " +
            error.message
        );

    }

}


/* =====================================================
   NORMALIZE FIXTURES
===================================================== */

function normalizeFixtures(fixtures) {

    return fixtures
        .map(raw => {

            const fixture =
                raw.fixture ||
                raw;

            const teams =
                raw.teams ||
                {};

            const league =
                raw.league ||
                {};

            return {

                fixture: {

                    id:
                        fixture.id ||
                        raw.fixture_id ||
                        raw.id ||
                        null,

                    date:
                        fixture.date ||
                        raw.kickoff ||
                        raw.date ||
                        null,

                    status:
                        fixture.status ||
                        raw.status ||
                        null

                },

                teams: {

                    home: {

                        id:
                            teams.home?.id ||
                            raw.home_team_id ||
                            null,

                        name:
                            teams.home?.name ||
                            raw.home_team ||
                            raw.home ||
                            ""

                    },

                    away: {

                        id:
                            teams.away?.id ||
                            raw.away_team_id ||
                            null,

                        name:
                            teams.away?.name ||
                            raw.away_team ||
                            raw.away ||
                            ""

                    }

                },

                league: {

                    id:
                        league.id ||
                        raw.league_id ||
                        null,

                    name:
                        league.name ||
                        raw.league ||
                        "Unknown League",

                    country:
                        league.country ||
                        raw.country ||
                        ""

                }

            };

        })
        .filter(
            item =>
                item.fixture.id &&
                item.teams.home.name &&
                item.teams.away.name
        );

}


/* =====================================================
   LEAGUE NAME
===================================================== */

function normalizeLeagueName(name) {

    return String(
        name || "Unknown League"
    ).trim();

}


/* =====================================================
   LEAGUE PRIORITY
===================================================== */

function getLeaguePriority(name) {

    const normalized =
        normalizeLeagueName(name)
            .toLowerCase();


    const index =
        TOP_LEAGUES.findIndex(
            league =>
                league.toLowerCase() ===
                normalized
        );


    return index === -1
        ? 999
        : index;

}


/* =====================================================
   GROUP FIXTURES
===================================================== */

function groupByLeague(fixtures) {

    const groups = {};

    fixtures.forEach(
        fixture => {

            const league =
                normalizeLeagueName(
                    fixture.league.name
                );


            if (!groups[league]) {

                groups[league] = [];

            }


            groups[league].push(
                fixture
            );

        }
    );


    return groups;

}


/* =====================================================
   RENDER FIXTURES
===================================================== */

function renderFixtures() {

    const container =
        document.getElementById(
            "fixturesContainer"
        );


    if (!allFixtures.length) {

        container.innerHTML = `
            <div class="empty">
                No fixtures found.
            </div>
        `;

        return;

    }


    const groups =
        groupByLeague(
            allFixtures
        );


    const leagues =
        Object.keys(groups)
            .sort(
                (a, b) =>
                    getLeaguePriority(a) -
                    getLeaguePriority(b)
            );


    container.innerHTML =
        leagues
            .map(
                league =>
                    buildLeagueHTML(
                        league,
                        groups[league]
                    )
            )
            .join("");

}


/* =====================================================
   BUILD LEAGUE HTML
===================================================== */

function buildLeagueHTML(
    league,
    fixtures
) {

    const isTop =
        getLeaguePriority(
            league
        ) !== 999;


    return `

        <div class="league">

            <div class="league-title ${
                isTop
                    ? "top-league"
                    : ""
            }">

                ${escapeHTML(league)}

                <span class="small">
                    (${fixtures.length})
                </span>

            </div>

            ${fixtures
                .map(
                    buildFixtureHTML
                )
                .join("")}

        </div>

    `;

}


/* =====================================================
   BUILD FIXTURE HTML
===================================================== */

function buildFixtureHTML(
    match
) {

    const id =
        match.fixture.id;


    const selected =
        selectedFixtures[id]
            ? "selected"
            : "";


    const kickoff =
        match.fixture.date
            ? new Date(
                match.fixture.date
            ).toLocaleString(
                "en-NG",
                {
                    dateStyle:
                        "short",
                    timeStyle:
                        "short"
                }
            )
            : "Kickoff unknown";


    return `

        <div
            class="fixture ${selected}"
        >

            <div class="fixture-info">

                <div class="fixture-teams">

                    ${escapeHTML(
                        match.teams.home.name
                    )}

                    vs

                    ${escapeHTML(
                        match.teams.away.name
                    )}

                </div>

                <div class="fixture-meta">

                    ID:
                    ${escapeHTML(id)}

                    <br>

                    ${escapeHTML(
                        match.league.country
                    )}

                    ·

                    ${escapeHTML(
                        kickoff
                    )}

                </div>

            </div>


            <button
                class="btn-primary"
                onclick="selectFixture(${id})"
            >

                ${
                    selected
                        ? "SELECTED"
                        : "SELECT"
                }

            </button>

        </div>

    `;

}


/* =====================================================
   SELECT FIXTURE
===================================================== */

function selectFixture(id) {

    const match =
        allFixtures.find(
            item =>
                Number(
                    item.fixture.id
                ) === Number(id)
        );


    if (!match) {

        alert(
            "Fixture not found."
        );

        return;

    }


    activeFixtureId =
        Number(id);


    if (
        !selectedFixtures[id]
    ) {

        selectedFixtures[id] = {

            match:
                match,

            dbId:
                null,

            market:
                "Match Winner",

            selection:
                match.teams.home.name,

            confidence:
                5,

            analysis:
                "",

            status:
                "DRAFT",

            result:
                "PENDING"

        };

    }


    renderFixtures();

    renderSelectedForm();

    renderMyPicks();

}


/* =====================================================
   RENDER EDITOR
===================================================== */

function renderSelectedForm() {

    const container =
        document.getElementById(
            "predictionEditor"
        );


    if (
        activeFixtureId === null ||
        !selectedFixtures[
            activeFixtureId
        ]
    ) {

        container.innerHTML = `
            <div class="empty">
                Select a fixture.
            </div>
        `;

        return;

    }


    const item =
        selectedFixtures[
            activeFixtureId
        ];


    const match =
        item.match;


    container.innerHTML = `

        <div class="small">
            ${escapeHTML(
                match.teams.home.name
            )}
            vs
            ${escapeHTML(
                match.teams.away.name
            )}
        </div>

        <br>


        <label>
            Market
        </label>

        <select
            id="market"
            onchange="updateActivePick()"
        >

            <option
                value="Match Winner"
                ${
                    item.market ===
                    "Match Winner"
                        ? "selected"
                        : ""
                }
            >
                Match Winner
            </option>

            <option
                value="Double Chance"
                ${
                    item.market ===
                    "Double Chance"
                        ? "selected"
                        : ""
                }
            >
                Double Chance
            </option>

            <option
                value="Over/Under 1.5"
                ${
                    item.market ===
                    "Over/Under 1.5"
                        ? "selected"
                        : ""
                }
            >
                Over/Under 1.5
            </option>

            <option
                value="Over/Under 2.5"
                ${
                    item.market ===
                    "Over/Under 2.5"
                        ? "selected"
                        : ""
                }
            >
                Over/Under 2.5
            </option>

            <option
                value="Over/Under 3.5"
                ${
                    item.market ===
                    "Over/Under 3.5"
                        ? "selected"
                        : ""
                }
            >
                Over/Under 3.5
            </option>

            <option
                value="BTTS"
                ${
                    item.market ===
                    "BTTS"
                        ? "selected"
                        : ""
                }
            >
                BTTS
            </option>

        </select>


        <br>


        <label>
            Selection
        </label>

        <input
            id="selection"
            value="${escapeHTML(
                item.selection
            )}"
            oninput="updateActivePick()"
            placeholder="Prediction selection"
        >


        <br>


        <label>
            Confidence: 5–10
        </label>

        <input
            id="confidence"
            type="number"
            min="5"
            max="10"
            value="${item.confidence}"
            oninput="updateActivePick()"
        >


        <br>


        <label>
            Analysis
        </label>

        <textarea
            id="analysis"
            oninput="updateActivePick()"
            placeholder="Enter prediction analysis..."
        >${escapeHTML(
            item.analysis
        )}</textarea>


        <div class="status">

            Current Status:

            ${statusBadge(
                item.status
            )}

            ${
                item.dbId
                    ? `<div class="small">
                        Database ID: ${escapeHTML(
                            item.dbId
                        )}
                    </div>`
                    : ""
            }

        </div>


        <div class="actions">

            <button
                class="btn-primary"
                onclick="saveCurrentPrediction()"
            >
                SAVE DRAFT
            </button>


            <button
                class="btn-success"
                onclick="publishCurrentPrediction()"
            >
                PUBLISH
            </button>


            <button
                class="btn-danger"
                onclick="removeActivePick()"
            >
                REMOVE
            </button>

        </div>

    `;

}


/* =====================================================
   UPDATE ACTIVE PICK
===================================================== */

function updateActivePick() {

    if (
        activeFixtureId === null
    ) {
        return;
    }


    const item =
        selectedFixtures[
            activeFixtureId
        ];


    if (!item) {
        return;
    }


    const market =
        document.getElementById(
            "market"
        );

    const selection =
        document.getElementById(
            "selection"
        );

    const confidence =
        document.getElementById(
            "confidence"
        );

    const analysis =
        document.getElementById(
            "analysis"
        );


    if (market) {

        item.market =
            market.value;

    }


    if (selection) {

        item.selection =
            selection.value;

    }


    if (confidence) {

        item.confidence =
            Number(
                confidence.value
            );

    }


    if (analysis) {

        item.analysis =
            analysis.value;

    }

}


/* =====================================================
   SAVE CURRENT PREDICTION
===================================================== */

async function saveCurrentPrediction() {

    updateActivePick();


    if (
        activeFixtureId === null
    ) {

        alert(
            "Select a fixture first."
        );

        return;

    }


    await submitPrediction(
        "DRAFT"
    );

}


/* =====================================================
   PUBLISH CURRENT PREDICTION
===================================================== */

async function publishCurrentPrediction() {

    updateActivePick();


    if (
        activeFixtureId === null
    ) {

        alert(
            "Select a fixture first."
        );

        return;

    }


    const item =
        selectedFixtures[
            activeFixtureId
        ];


    if (!item.dbId) {

        await submitPrediction(
            "PUBLISHED"
        );

        return;

    }


    await updatePredictionStatus(
        item,
        "PUBLISHED"
    );

}


/* =====================================================
   SUBMIT NEW PREDICTION
===================================================== */

async function submitPrediction(
    status
) {

    const item =
        selectedFixtures[
            activeFixtureId
        ];


    if (!item) {

        alert(
            "No prediction selected."
        );

        return false;

    }


    const date =
        document.getElementById(
            "predictionDate"
        ).value;


    if (!date) {

        alert(
            "Please select a prediction date."
        );

        return false;

    }


    if (
        !Number.isInteger(
            Number(item.confidence)
        ) ||
        Number(item.confidence) < 5 ||
        Number(item.confidence) > 10
    ) {

        alert(
            "Confidence must be between 5 and 10."
        );

        return false;

    }


    const match =
        item.match;


    const payload = {

        type:
            "prediction",

        prediction_date:
            date,

        fixture_id:
            match.fixture?.id ||
            null,

        home_team:
            match.teams?.home?.name ||
            "",

        away_team:
            match.teams?.away?.name ||
            "",

        home_team_id:
            match.teams?.home?.id ||
            null,

        away_team_id:
            match.teams?.away?.id ||
            null,

        country:
            match.league?.country ||
            null,

        league:
            match.league?.name ||
            null,

        kickoff:
            match.fixture?.date ||
            null,

        market:
            item.market,

        selection:
            item.selection,

        confidence:
            Number(
                item.confidence
            ),

        analysis:
            item.analysis ||
            null,

        status:
            normalizeStatus(
                status
            ),

        result:
            "PENDING"

    };


    try {

        const response =
            await fetch(
                "/api/predictions",
                {

                    method:
                        "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify(
                            payload
                        )

                }
            );


        const raw =
            await response.text();


        let data;

        try {

            data =
                raw
                    ? JSON.parse(raw)
                    : {};

        } catch (error) {

            throw new Error(
                "Server returned invalid JSON: " +
                raw.substring(0, 300)
            );

        }


        if (
            !response.ok ||
            !data.success
        ) {

            throw new Error(
                data.error ||
                "Failed to save prediction."
            );

        }


        if (
            data.prediction
        ) {

            item.dbId =
                data.prediction.id;

            item.status =
                normalizeStatus(
                    data.prediction.status
                );

            item.result =
                normalizeResult(
                    data.prediction.result
                );

        } else {

            item.status =
                normalizeStatus(
                    status
                );

        }


        renderSelectedForm();

        renderMyPicks();


        setPageStatus(
            item.status ===
                "PUBLISHED"
                ? "Prediction published successfully."
                : "Draft saved successfully."
        );


        return true;


    } catch (error) {

        console.error(
            "Prediction save error:",
            error
        );


        alert(
            "Prediction Error: " +
            error.message
        );


        return false;

    }

}


/* =====================================================
   UPDATE EXISTING PREDICTION
===================================================== */

async function updatePredictionStatus(
    item,
    status
) {

    if (!item.dbId) {

        return false;

    }


    try {

        const response =
            await fetch(
                "/api/predictions?id=" +
                encodeURIComponent(
                    item.dbId
                ),
                {

                    method:
                        "PATCH",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            status:
                                normalizeStatus(
                                    status
                                )
                        })

                }
            );


        const raw =
            await response.text();


        let data;

        try {

            data =
                raw
                    ? JSON.parse(raw)
                    : {};

        } catch (error) {

            throw new Error(
                "Server returned invalid JSON: " +
                raw.substring(0, 300)
            );

        }


        if (
            !response.ok ||
            !data.success
        ) {

            throw new Error(
                data.error ||
                "Failed to update prediction."
            );

        }


        item.status =
            normalizeStatus(
                data.prediction?.status ||
                status
            );


        renderSelectedForm();

        renderMyPicks();


        setPageStatus(
            "Prediction published successfully."
        );


        return true;


    } catch (error) {

        console.error(
            "Prediction update error:",
            error
        );


        alert(
            "Publish Error: " +
            error.message
        );


        return false;

    }

}


/* =====================================================
   SAVE DAILY SLIP
===================================================== */

async function saveDailySlip(
    publish = false
) {

    const date =
        document.getElementById(
            "predictionDate"
        ).value;


    const bookingCode =
        document.getElementById(
            "bookingCode"
        ).value.trim();


    const bookmaker =
        document.getElementById(
            "bookmaker"
        ).value.trim();


    if (!date) {

        alert(
            "Please select a prediction date."
        );

        return false;

    }


    const payload = {

        type:
            "daily_slip",

        prediction_date:
            date,

        booking_code:
            bookingCode ||
            null,

        bookmaker:
            bookmaker ||
            null,

        status:
            publish
                ? "PUBLISHED"
                : "DRAFT"

    };


    try {

        const response =
            await fetch(
                "/api/predictions",
                {

                    method:
                        "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify(
                            payload
                        )

                }
            );


        const raw =
            await response.text();


        let data;

        try {

            data =
                raw
                    ? JSON.parse(raw)
                    : {};

        } catch (error) {

            throw new Error(
                "Server returned invalid JSON: " +
                raw.substring(0, 300)
            );

        }


        if (
            !response.ok ||
            !data.success
        ) {

            throw new Error(
                data.error ||
                "Failed to save Daily Slip."
            );

        }


        setPageStatus(
            publish
                ? "Daily Slip published successfully."
                : "Daily Slip saved successfully."
        );


        return true;


    } catch (error) {

        console.error(
            "Daily Slip error:",
            error
        );


        alert(
            "Daily Slip Error: " +
            error.message
        );


        return false;

    }

}


/* =====================================================
   PUBLISH DAILY SLIP
===================================================== */

async function publishDailySlip() {

    const picks =
        Object.values(
            selectedFixtures
        );


    if (!picks.length) {

        alert(
            "Select at least one prediction first."
        );

        return;

    }


    const date =
        document.getElementById(
            "predictionDate"
        ).value;


    if (!date) {

        alert(
            "Please select a prediction date."
        );

        return;

    }


    const confirmed =
        confirm(
            "Publish the Daily Slip?\n\n" +
            "All selected predictions will be published."
        );


    if (!confirmed) {

        return;

    }


    try {

        /*
         * Publish every selected prediction.
         *
         * Existing drafts are UPDATED.
         * Unsaved predictions are INSERTED once
         * as PUBLISHED.
         */

        for (
            const item of picks
        ) {

            updateActivePickFromItem(
                item
            );


            if (item.dbId) {

                await updatePredictionStatus(
                    item,
                    "PUBLISHED"
                );

            } else {

                activeFixtureId =
                    Number(
                        item.match.fixture.id
                    );


                const success =
                    await submitPrediction(
                        "PUBLISHED"
                    );


                if (!success) {

                    throw new Error(
                        "Failed to publish " +
                        item.match.teams.home.name +
                        " vs " +
                        item.match.teams.away.name
                    );

                }

            }

        }


        /*
         * Publish Daily Slip itself.
         */

        const slipSaved =
            await saveDailySlip(
                true
            );


        if (!slipSaved) {

            throw new Error(
                "Predictions were published, but the Daily Slip could not be published."
            );

        }


        /*
         * Refresh UI.
         */

        Object.values(
            selectedFixtures
        ).forEach(
            item => {

                item.status =
                    "PUBLISHED";

            }
        );


        renderFixtures();

        renderSelectedForm();

        renderMyPicks();


        setPageStatus(
            "Daily Slip published successfully."
        );


        alert(
            "Daily Slip published successfully."
        );


    } catch (error) {

        console.error(
            "Publish Daily Slip error:",
            error
        );


        alert(
            "Publish failed: " +
            error.message
        );

    }

}


/* =====================================================
   UPDATE ITEM BEFORE PUBLISH
===================================================== */

function updateActivePickFromItem(
    item
) {

    /*
     * The editor may have unsaved changes.
     * If this is the active item, capture them.
     */

    const id =
        Number(
            item.match.fixture.id
        );


    if (
        activeFixtureId === id
    ) {

        updateActivePick();

    }

}


/* =====================================================
   RENDER MY PICKS
===================================================== */

function renderMyPicks() {

    const container =
        document.getElementById(
            "myPicks"
        );


    const picks =
        Object.values(
            selectedFixtures
        );


    if (!picks.length) {

        container.innerHTML = `
            <div class="empty">
                No selected predictions.
            </div>
        `;

        return;

    }


    container.innerHTML =
        picks
            .map(
                (item, index) => {

                    const match =
                        item.match;


                    return `

                        <div class="pick">

                            <div class="pick-title">

                                ${escapeHTML(
                                    match.teams.home.name
                                )}

                                vs

                                ${escapeHTML(
                                    match.teams.away.name
                                )}

                            </div>


                            <div class="pick-meta">

                                Market:
                                ${escapeHTML(
                                    item.market
                                )}

                                <br>

                                Selection:
                                ${escapeHTML(
                                    item.selection
                                )}

                                <br>

                                Confidence:
                                ${escapeHTML(
                                    item.confidence
                                )}

                                <br>

                                ${
                                    item.dbId
                                        ? "DB ID: " +
                                          escapeHTML(
                                              item.dbId
                                          )
                                        : "Not saved yet"
                                }

                            </div>


                            ${statusBadge(
                                item.status
                            )}

                        </div>

                    `;

                }
            )
            .join("");

}


/* =====================================================
   REMOVE ACTIVE PICK
===================================================== */

function removeActivePick() {

    if (
        activeFixtureId === null
    ) {

        return;

    }


    delete selectedFixtures[
        activeFixtureId
    ];


    activeFixtureId =
        null;


    renderFixtures();

    renderSelectedForm();

    renderMyPicks();

}


/* =====================================================
   DEFAULT DATE
===================================================== */

(function initialize() {

    const dateInput =
        document.getElementById(
            "predictionDate"
        );


    if (
        dateInput &&
        !dateInput.value
    ) {

        const now =
            new Date();


        const year =
            now.getFullYear();


        const month =
            String(
                now.getMonth() + 1
            )
            .padStart(
                2,
                "0"
            );


        const day =
            String(
                now.getDate()
            )
            .padStart(
                2,
                "0"
            );


        dateInput.value =
            `${year}-${month}-${day}`;

    }

})();

</script>
