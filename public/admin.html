<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>TomsonStakes Admin</title>


<style>

/* =========================================================
   GLOBAL
========================================================= */

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #111827;
    color: #ffffff;
}

.container {
    max-width: 1100px;
    margin: auto;
    padding: 20px;
}


/* =========================================================
   HEADER
========================================================= */

.header {
    text-align: center;
    padding: 25px 10px;
}

.header h1 {
    margin: 0;
    font-size: 32px;
    font-weight: 900;
}

.subtitle {
    color: #9ca3af;
    margin-top: 8px;
    font-size: 13px;
    letter-spacing: .5px;
}


/* =========================================================
   PANELS
========================================================= */

.panel {
    background: #1f2937;
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 20px;
}

.panel h2 {
    margin-top: 0;
}


/* =========================================================
   FORM
========================================================= */

label {
    display: block;
    color: #d1d5db;
    font-size: 13px;
    font-weight: 800;
    margin-bottom: 7px;
}

input,
select,
textarea {

    width: 100%;

    padding: 13px;

    border: none;

    border-radius: 8px;

    font-size: 15px;

    margin-bottom: 15px;

    background: #ffffff;

    color: #111827;
}

textarea {

    min-height: 140px;

    resize: vertical;
}


/* =========================================================
   BUTTONS
========================================================= */

button {

    border: none;

    border-radius: 8px;

    padding: 13px 18px;

    font-size: 14px;

    font-weight: 800;

    cursor: pointer;
}

button:disabled {

    opacity: .6;

    cursor: wait;
}

.load-button {

    width: 100%;

    background: #16a34a;

    color: white;
}

.publish-button {

    width: 100%;

    background: #16a34a;

    color: white;

    font-size: 16px;
}

.draft-button {

    width: 100%;

    background: #374151;

    color: white;

    margin-top: 10px;
}


/* =========================================================
   STATUS
========================================================= */

.status {

    padding: 12px;

    border-radius: 8px;

    margin-top: 12px;

    font-weight: bold;

    line-height: 1.5;
}

.success {

    background: #dcfce7;

    color: #166534;
}

.warning {

    background: #fef3c7;

    color: #92400e;
}

.error {

    background: #fee2e2;

    color: #991b1b;
}


/* =========================================================
   MATCH CARD
========================================================= */

.match {

    background: #ffffff;

    color: #111827;

    border-radius: 13px;

    padding: 16px;

    margin-top: 12px;

    border: 3px solid transparent;
}

.match.selected {

    border-color: #16a34a;
}

.match-header {

    display: flex;

    justify-content: space-between;

    gap: 10px;

    color: #6b7280;

    font-size: 12px;

    font-weight: bold;
}

.teams {

    display: grid;

    grid-template-columns: 1fr 70px 1fr;

    align-items: center;

    gap: 10px;

    margin-top: 15px;
}

.team {

    font-weight: 900;

    font-size: 16px;
}

.team-away {

    text-align: right;
}

.vs {

    text-align: center;

    color: #6b7280;

    font-weight: 900;
}

.kickoff {

    text-align: center;

    margin-top: 12px;

    color: #6b7280;

    font-size: 13px;

    font-weight: bold;
}

.match-meta {

    margin-top: 12px;

    padding-top: 10px;

    border-top: 1px solid #e5e7eb;

    color: #9ca3af;

    font-size: 10px;

    line-height: 1.7;
}

.select-button {

    width: 100%;

    margin-top: 14px;

    background: #2563eb;

    color: white;
}

.selected .select-button {

    background: #16a34a;
}


/* =========================================================
   SELECTED MATCH
========================================================= */

.selected-match {

    background: #111827;

    border: 1px solid #374151;

    padding: 14px;

    border-radius: 10px;

    margin-bottom: 20px;

    line-height: 1.6;
}

.selected-match-title {

    color: #9ca3af;

    font-size: 11px;

    text-transform: uppercase;

    letter-spacing: 1px;

    font-weight: bold;
}

.selected-match-teams {

    font-size: 19px;

    font-weight: 900;

    margin-top: 5px;
}


/* =========================================================
   CONFIDENCE
========================================================= */

.confidence-row {

    display: grid;

    grid-template-columns: 1fr 100px;

    gap: 10px;

    align-items: start;
}


/* =========================================================
   HIDDEN
========================================================= */

.hidden {

    display: none;
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 650px) {

    .container {
        padding: 12px;
    }

    .header h1 {
        font-size: 27px;
    }

    .teams {
        grid-template-columns: 1fr 45px 1fr;
    }

    .team {
        font-size: 13px;
    }

    .confidence-row {
        grid-template-columns: 1fr;
    }

}

</style>

</head>


<body>


<div class="container">


<!-- =====================================================
     HEADER
===================================================== -->

<div class="header">

    <h1>
        🔥 TOMSONSTAKES ADMIN
    </h1>

    <div class="subtitle">
        FOOTBALL PREDICTION MANAGEMENT PANEL
    </div>

</div>


<!-- =====================================================
     LOAD FIXTURES
===================================================== -->

<div class="panel">

    <h2>
        📅 Select Match Date
    </h2>

    <label>
        Match Date
    </label>

    <input
        type="date"
        id="matchDate"
    >

    <button
        class="load-button"
        id="loadButton"
        onclick="loadFixtures()"
    >
        ⚽ LOAD MATCHES
    </button>

    <div id="loadStatus"></div>

</div>


<!-- =====================================================
     MATCH LIST
===================================================== -->

<div
    id="matchesPanel"
    class="panel hidden"
>

    <h2>
        ⚽ Available Matches
    </h2>

    <div
        id="matches"
    ></div>

</div>


<!-- =====================================================
     PREDICTION FORM
===================================================== -->

<div
    id="predictionPanel"
    class="panel hidden"
>

    <h2>
        📝 Create Prediction
    </h2>


    <!-- SELECTED MATCH -->

    <div
        class="selected-match"
        id="selectedMatch"
    ></div>


    <!-- MARKET -->

    <label>
        Market
    </label>

    <select
        id="market"
    >

        <option value="1X2">
            1X2
        </option>

        <option value="Home Win">
            Home Win
        </option>

        <option value="Draw">
            Draw
        </option>

        <option value="Away Win">
            Away Win
        </option>

        <option value="Double Chance">
            Double Chance
        </option>

        <option value="Over 0.5 Goals">
            Over 0.5 Goals
        </option>

        <option value="Over 1.5 Goals">
            Over 1.5 Goals
        </option>

        <option value="Over 2.5 Goals">
            Over 2.5 Goals
        </option>

        <option value="Over 3.5 Goals">
            Over 3.5 Goals
        </option>

        <option value="Under 1.5 Goals">
            Under 1.5 Goals
        </option>

        <option value="Under 2.5 Goals">
            Under 2.5 Goals
        </option>

        <option value="Under 3.5 Goals">
            Under 3.5 Goals
        </option>

        <option value="BTTS">
            Both Teams To Score
        </option>

        <option value="BTTS No">
            BTTS — No
        </option>

        <option value="Correct Score">
            Correct Score
        </option>

        <option value="Other">
            Other
        </option>

    </select>


    <!-- SELECTION -->

    <label>
        Your Prediction / Selection
    </label>

    <input
        type="text"
        id="selection"
        placeholder="e.g. Arsenal Win"
    >


    <!-- CONFIDENCE -->

    <label>
        Confidence (%)
    </label>

    <input
        type="number"
        id="confidence"
        min="1"
        max="100"
        placeholder="e.g. 82"
    >


    <!-- ANALYSIS -->

    <label>
        Analysis / Reason
    </label>

    <textarea
        id="analysis"
        placeholder="Enter your reasoning for this prediction..."
    ></textarea>


    <!-- PUBLISH -->

    <button
        class="publish-button"
        id="publishButton"
        onclick="savePrediction('published')"
    >
        🚀 PUBLISH PREDICTION
    </button>


    <!-- DRAFT -->

    <button
        class="draft-button"
        id="draftButton"
        onclick="savePrediction('draft')"
    >
        💾 SAVE AS DRAFT
    </button>


    <div
        id="saveStatus"
    ></div>

</div>


</div>


<script>


/* =========================================================
   GLOBAL STATE
========================================================= */

let fixtures = [];

let selectedFixture = null;


/* =========================================================
   DEFAULT DATE
========================================================= */

(function setDefaultDate() {

    const now =
        new Date();

    const year =
        now.getFullYear();

    const month =
        String(
            now.getMonth() + 1
        ).padStart(2, "0");

    const day =
        String(
            now.getDate()
        ).padStart(2, "0");

    document.getElementById(
        "matchDate"
    ).value =
        `${year}-${month}-${day}`;

})();


/* =========================================================
   LOAD FIXTURES
========================================================= */

async function loadFixtures() {

    const date =
        document.getElementById(
            "matchDate"
        ).value;

    const status =
        document.getElementById(
            "loadStatus"
        );

    const button =
        document.getElementById(
            "loadButton"
        );

    const matches =
        document.getElementById(
            "matches"
        );


    if (!date) {

        status.innerHTML = `

            <div class="status warning">

                ⚠️ Please select a match date.

            </div>

        `;

        return;

    }


    button.disabled = true;


    status.innerHTML = `

        <div class="status warning">

            🔎 Loading football fixtures...

        </div>

    `;


    matches.innerHTML = "";


    try {

        const response =
            await fetch(
                `/api/fixtures?date=${encodeURIComponent(date)}`
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.message ||
                data.error ||
                "Unable to load fixtures."
            );

        }


        if (
            !data.response ||
            !Array.isArray(
                data.response
            ) ||
            data.response.length === 0
        ) {

            document
                .getElementById(
                    "matchesPanel"
                )
                .classList.remove(
                    "hidden"
                );


            status.innerHTML = `

                <div class="status warning">

                    ⚠️ No football fixtures
                    found for

                    ${escapeHtml(date)}.

                </div>

            `;

            return;

        }


        fixtures =
            data.response;


        selectedFixture =
            null;


        document
            .getElementById(
                "predictionPanel"
            )
            .classList.add(
                "hidden"
            );


        renderFixtures();


        document
            .getElementById(
                "matchesPanel"
            )
            .classList.remove(
                "hidden"
            );


        status.innerHTML = `

            <div class="status success">

                ✓ Successfully loaded

                ${fixtures.length}

                football fixtures.

            </div>

        `;

    }


    catch (error) {

        console.error(
            "LOAD FIXTURES ERROR:",
            error
        );


        status.innerHTML = `

            <div class="status error">

                ❌ Unable to load fixtures.

                <br><br>

                ${escapeHtml(
                    error.message
                )}

            </div>

        `;

    }


    finally {

        button.disabled =
            false;

    }

}


/* =========================================================
   RENDER FIXTURES
========================================================= */

function renderFixtures() {

    const container =
        document.getElementById(
            "matches"
        );


    container.innerHTML = "";


    fixtures.forEach(
        (match, index) => {


            const home =
                match.teams?.home?.name ||
                "Home Team";


            const away =
                match.teams?.away?.name ||
                "Away Team";


            const country =
                match.league?.country ||
                "Unknown Country";


            const league =
                match.league?.name ||
                "Unknown Competition";


            const round =
                match.league?.round ||
                "";


            const fixtureId =
                match.fixture?.id ||
                "";


            const homeId =
                match.teams?.home?.id ||
                "";


            const awayId =
                match.teams?.away?.id ||
                "";


            const leagueId =
                match.league?.id ||
                "";


            const season =
                match.league?.season ||
                "";


            const kickoff =
                formatKickoff(
                    match.fixture?.date,
                    match.fixture?.timestamp
                );


            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "match";


            card.id =
                `match-${index}`;


            card.innerHTML = `

                <div class="match-header">

                    <span>

                        🌍
                        ${escapeHtml(
                            country
                        )}

                    </span>

                    <span>

                        🏆
                        ${escapeHtml(
                            league
                        )}

                    </span>

                </div>


                <div class="teams">

                    <div class="team">

                        ${escapeHtml(
                            home
                        )}

                    </div>


                    <div class="vs">

                        VS

                    </div>


                    <div class="team team-away">

                        ${escapeHtml(
                            away
                        )}

                    </div>

                </div>


                <div class="kickoff">

                    🕐
                    ${escapeHtml(
                        kickoff
                    )}

                </div>


                <div class="match-meta">

                    Fixture ID:
                    ${escapeHtml(
                        String(
                            fixtureId
                        )
                    )}

                    <br>

                    Team IDs:
                    ${escapeHtml(
                        String(homeId)
                    )}
                    —
                    ${escapeHtml(
                        String(awayId)
                    )}

                    <br>

                    League ID:
                    ${escapeHtml(
                        String(leagueId)
                    )}

                    |

                    Season:
                    ${escapeHtml(
                        String(season)
                    )}

                    ${
                        round
                        ?
                        `
                        <br>

                        Round:
                        ${escapeHtml(
                            round
                        )}
                        `
                        :
                        ""
                    }

                </div>


                <button
                    class="select-button"
                    onclick="
                        selectFixture(
                            ${index}
                        )
                    "
                >

                    🎯 SELECT THIS MATCH

                </button>

            `;


            container.appendChild(
                card
            );

        }
    );

}


/* =========================================================
   SELECT FIXTURE
========================================================= */

function selectFixture(
    index
) {

    selectedFixture =
        fixtures[index];


    document
        .querySelectorAll(
            ".match"
        )
        .forEach(
            element => {

                element.classList.remove(
                    "selected"
                );

            }
        );


    const selectedCard =
        document.getElementById(
            `match-${index}`
        );


    if (selectedCard) {

        selectedCard.classList.add(
            "selected"
        );

    }


    const home =
        selectedFixture
            ?.teams
            ?.home
            ?.name ||
        "Home Team";


    const away =
        selectedFixture
            ?.teams
            ?.away
            ?.name ||
        "Away Team";


    const country =
        selectedFixture
            ?.league
            ?.country ||
        "";


    const league =
        selectedFixture
            ?.league
            ?.name ||
        "";


    const round =
        selectedFixture
            ?.league
            ?.round ||
        "";


    const kickoff =
        formatKickoff(
            selectedFixture
                ?.fixture
                ?.date,

            selectedFixture
                ?.fixture
                ?.timestamp
        );


    document.getElementById(
        "selectedMatch"
    ).innerHTML = `

        <div class="selected-match-title">

            SELECTED MATCH

        </div>


        <div class="selected-match-teams">

            ${escapeHtml(home)}

            <span
                style="
                    color:#9ca3af;
                    margin:0 8px;
                "
            >
                VS
            </span>

            ${escapeHtml(away)}

        </div>


        <div
            style="
                color:#9ca3af;
                font-size:12px;
                margin-top:8px;
            "
        >

            🌍
            ${escapeHtml(country)}

            &nbsp; • &nbsp;

            🏆
            ${escapeHtml(league)}

            ${
                round
                ?
                `&nbsp; • &nbsp;
                 ${escapeHtml(round)}`
                :
                ""
            }

            <br>

            🕐
            ${escapeHtml(kickoff)}

        </div>

    `;


    document
        .getElementById(
            "predictionPanel"
        )
        .classList.remove(
            "hidden"
        );


    document
        .getElementById(
            "predictionPanel"
        )
        .scrollIntoView({
            behavior: "smooth",
            block: "start"
        });

}


/* =========================================================
   SAVE PREDICTION
========================================================= */

async function savePrediction(
    status
) {


    /* -----------------------------------------------------
       CHECK MATCH
    ----------------------------------------------------- */

    if (!selectedFixture) {

        showSaveStatus(
            "⚠️ Please select a match first.",
            "warning"
        );

        return;

    }


    /* -----------------------------------------------------
       FORM VALUES
    ----------------------------------------------------- */

    const market =
        document
            .getElementById(
                "market"
            )
            .value;


    const selection =
        document
            .getElementById(
                "selection"
            )
            .value
            .trim();


    const confidence =
        Number(
            document
                .getElementById(
                    "confidence"
                )
                .value
        );


    const analysis =
        document
            .getElementById(
                "analysis"
            )
            .value
            .trim();


    const predictionDate =
        document
            .getElementById(
                "matchDate"
            )
            .value;


    /* -----------------------------------------------------
       VALIDATION
    ----------------------------------------------------- */

    if (!predictionDate) {

        showSaveStatus(
            "⚠️ Match date is required.",
            "warning"
        );

        return;

    }


    if (!market) {

        showSaveStatus(
            "⚠️ Please select a market.",
            "warning"
        );

        return;

    }


    if (!selection) {

        showSaveStatus(
            "⚠️ Enter your prediction / selection.",
            "warning"
        );

        return;

    }


    if (
        !Number.isFinite(
            confidence
        ) ||
        confidence < 1 ||
        confidence > 100
    ) {

        showSaveStatus(
            "⚠️ Confidence must be between 1 and 100.",
            "warning"
        );

        return;

    }


    /* -----------------------------------------------------
       BUTTON
    ----------------------------------------------------- */

    const button =
        status === "published"
            ?
            document.getElementById(
                "publishButton"
            )
            :
            document.getElementById(
                "draftButton"
            );


    button.disabled =
        true;


    showSaveStatus(
        "💾 Saving prediction...",
        "warning"
    );


    /* -----------------------------------------------------
       FIXTURE DATA
    ----------------------------------------------------- */

    const match =
        selectedFixture;


    const fixtureId =
        match.fixture?.id ||
        null;


    const homeTeam =
        match.teams?.home?.name ||
        "";


    const awayTeam =
        match.teams?.away?.name ||
        "";


    const homeTeamId =
        match.teams?.home?.id ||
        null;


    const awayTeamId =
        match.teams?.away?.id ||
        null;


    const country =
        match.league?.country ||
        null;


    const league =
        match.league?.name ||
        null;


    const kickoff =
        match.fixture?.date ||
        null;


    /* -----------------------------------------------------
       PAYLOAD — MATCHES public.predictions
    ----------------------------------------------------- */

    const payload = {

        prediction_date:
            predictionDate,

        fixture_id:
            fixtureId,

        home_team:
            homeTeam,

        away_team:
            awayTeam,

        home_team_id:
            homeTeamId,

        away_team_id:
            awayTeamId,

        country:
            country,

        league:
            league,

        kickoff:
            kickoff,

        market:
            market,

        selection:
            selection,

        confidence:
            confidence,

        analysis:
            analysis ||
            null,

        status:
            status,

        result:
            "pending",

        published_at:
            status === "published"
                ?
                new Date().toISOString()
                :
                null

    };


    console.log(
        "TOMSONSTAKES PREDICTION PAYLOAD:",
        payload
    );


    /* -----------------------------------------------------
       SEND TO API
    ----------------------------------------------------- */

    try {

        const response =
            await fetch(
                "/api/predictions",
                {

                    method:
                        "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify(
                            payload
                        )

                }
            );


        let data;


        try {

            data =
                await response.json();

        }

        catch {

            throw new Error(
                "The prediction API returned an invalid response."
            );

        }


        if (!response.ok) {

            throw new Error(
                data.error ||
                data.message ||
                "Failed to save prediction."
            );

        }


        console.log(
            "TOMSONSTAKES API RESPONSE:",
            data
        );


        showSaveStatus(

            status === "published"

                ?

                "✅ Prediction published successfully!"

                :

                "✅ Prediction saved as draft!",

            "success"

        );


        /* -------------------------------------------------
           CLEAR FORM
        ------------------------------------------------- */

        document.getElementById(
            "selection"
        ).value = "";


        document.getElementById(
            "confidence"
        ).value = "";


        document.getElementById(
            "analysis"
        ).value = "";


    }


    catch (error) {

        console.error(
            "SAVE PREDICTION ERROR:",
            error
        );


        showSaveStatus(

            "❌ " +
            error.message,

            "error"

        );

    }


    finally {

        button.disabled =
            false;

    }

}


/* =========================================================
   SAVE STATUS
========================================================= */

function showSaveStatus(
    message,
    type
) {

    document.getElementById(
        "saveStatus"
    ).innerHTML = `

        <div class="status ${type}">

            ${escapeHtml(
                message
            )}

        </div>

    `;

}


/* =========================================================
   FORMAT KICKOFF
========================================================= */

function formatKickoff(
    isoDate,
    timestamp
) {

    try {

        let date;


        if (timestamp) {

            date =
                new Date(
                    Number(timestamp) *
                    1000
                );

        }

        else if (isoDate) {

            date =
                new Date(
                    isoDate
                );

        }

        else {

            return "Time unavailable";

        }


        if (
            Number.isNaN(
                date.getTime()
            )
        ) {

            return "Time unavailable";

        }


        return date.toLocaleString(
            "en-NG",
            {

                timeZone:
                    "Africa/Lagos",

                day:
                    "2-digit",

                month:
                    "short",

                year:
                    "numeric",

                hour:
                    "2-digit",

                minute:
                    "2-digit",

                hour12:
                    false

            }
        ) + " WAT";

    }

    catch {

        return "Time unavailable";

    }

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(
    value
) {

    return String(
        value ?? ""
    )

    .replace(
        /&/g,
        "&amp;"
    )

    .replace(
        /</g,
        "&lt;"
    )

    .replace(
        />/g,
        "&gt;"
    )

    .replace(
        /"/g,
        "&quot;"
    )

    .replace(
        /'/g,
        "&#039;"
    );

}


</script>


</body>

</html>
