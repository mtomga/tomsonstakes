<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TomsonStakes Global Football</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #111827;
    color: #fff;
}

.container {
    max-width: 1050px;
    margin: auto;
    padding: 20px;
}

/* =========================
   HEADER
========================= */

.header {
    text-align: center;
    padding: 25px 10px;
}

.header h1 {
    margin: 0;
    font-size: 32px;
    font-weight: 800;
}

.subtitle {
    color: #9ca3af;
    margin-top: 8px;
    font-size: 14px;
    letter-spacing: .5px;
}

/* =========================
   CONTROL
========================= */

.control-box {
    background: #1f2937;
    padding: 20px;
    border-radius: 14px;
    text-align: center;
    margin-bottom: 20px;
}

.control-box p {
    margin-top: 0;
    color: #d1d5db;
}

input[type="date"] {
    width: 100%;
    max-width: 400px;
    padding: 14px;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    background: #fff;
    color: #111827;
}

button {
    border: none;
    border-radius: 8px;
    padding: 13px 18px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
}

button:disabled {
    opacity: .6;
    cursor: wait;
}

.main-button {
    background: #16a34a;
    color: white;
    width: 100%;
    max-width: 400px;
    margin-top: 12px;
}

.analyze-button {
    background: #2563eb;
    color: white;
    width: 100%;
    margin-top: 14px;
}

.analyze-button:hover {
    background: #1d4ed8;
}

/* =========================
   GENERAL
========================= */

.notice {
    background: #1f2937;
    padding: 18px;
    border-radius: 12px;
    margin-top: 15px;
}

.status {
    padding: 12px;
    border-radius: 8px;
    margin-top: 12px;
    font-weight: bold;
}

.status-ready {
    background: #dcfce7;
    color: #166534;
}

.status-warning {
    background: #fef3c7;
    color: #92400e;
}

.status-error {
    background: #fee2e2;
    color: #991b1b;
}

/* =========================
   COUNTRY SECTION
========================= */

.country-section {
    margin-top: 25px;
}

.country-title {
    background: #374151;
    border-left: 5px solid #16a34a;
    padding: 14px 16px;
    border-radius: 10px;
    font-size: 21px;
    font-weight: 800;
}

.country-count {
    color: #9ca3af;
    font-size: 13px;
    font-weight: normal;
}

/* =========================
   LEAGUE SECTION
========================= */

.league-section {
    margin-top: 15px;
}

.league-title {
    background: #1f2937;
    padding: 13px 15px;
    border-radius: 9px;
    border-bottom: 2px solid #374151;
}

.league-name {
    font-size: 17px;
    font-weight: 800;
}

.league-round {
    color: #9ca3af;
    font-size: 12px;
    margin-top: 4px;
}

/* =========================
   FIXTURE
========================= */

.fixture {
    background: #fff;
    color: #111827;
    border-radius: 14px;
    padding: 17px;
    margin-top: 10px;
    box-shadow: 0 4px 12px rgba(0,0,0,.12);
}

.fixture-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
}

.fixture-number {
    color: #6b7280;
    font-size: 12px;
}

.match-time {
    color: #6b7280;
    font-size: 13px;
    font-weight: bold;
}

.teams-area {
    margin-top: 14px;
    display: grid;
    grid-template-columns: 1fr 90px 1fr;
    align-items: center;
    gap: 10px;
}

.team {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
}

.team-away {
    justify-content: flex-end;
    text-align: right;
}

.team-logo {
    width: 38px;
    height: 38px;
    object-fit: contain;
    flex-shrink: 0;
}

.team-name {
    font-weight: 800;
    font-size: 15px;
    word-break: break-word;
}

.score-area {
    text-align: center;
}

.score {
    font-size: 25px;
    font-weight: 900;
    line-height: 1;
}

.vs {
    color: #9ca3af;
    font-size: 13px;
    font-weight: bold;
}

.status-pill {
    display: inline-block;
    margin-top: 7px;
    padding: 5px 8px;
    border-radius: 999px;
    font-size: 10px;
    font-weight: 900;
    text-transform: uppercase;
}

.status-upcoming {
    background: #dbeafe;
    color: #1d4ed8;
}

.status-live {
    background: #fee2e2;
    color: #b91c1c;
}

.status-finished {
    background: #dcfce7;
    color: #166534;
}

.status-postponed {
    background: #fef3c7;
    color: #92400e;
}

.status-cancelled {
    background: #fee2e2;
    color: #991b1b;
}

.status-suspended {
    background: #ffedd5;
    color: #9a3412;
}

.kickoff-only {
    text-align: center;
    margin-top: 8px;
    color: #374151;
    font-weight: bold;
    font-size: 14px;
}

.fixture-footer {
    margin-top: 14px;
    border-top: 1px solid #e5e7eb;
    padding-top: 10px;
}

.fixture-id {
    color: #9ca3af;
    font-size: 10px;
    word-break: break-all;
}

/* =========================
   ANALYSIS
========================= */

.analysis {
    margin-top: 15px;
}

.prediction-result {
    background: #111827;
    color: white;
    border-radius: 14px;
    padding: 22px;
    text-align: center;
}

.prediction-label {
    font-size: 12px;
    color: #9ca3af;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    font-weight: bold;
}

.prediction-value {
    font-size: 30px;
    font-weight: 900;
    margin: 8px 0 22px;
}

.probability-label {
    font-size: 12px;
    color: #9ca3af;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    font-weight: bold;
}

.probability-value {
    font-size: 34px;
    font-weight: 900;
    margin-top: 7px;
}

/* =========================
   RESPONSIVE
========================= */

@media (max-width: 650px) {

    .container {
        padding: 12px;
    }

    .header h1 {
        font-size: 27px;
    }

    .country-title {
        font-size: 18px;
    }

    .league-name {
        font-size: 15px;
    }

    .teams-area {
        grid-template-columns: 1fr 70px 1fr;
    }

    .team-name {
        font-size: 13px;
    }

    .team-logo {
        width: 32px;
        height: 32px;
    }

    .score {
        font-size: 22px;
    }

    .prediction-value {
        font-size: 25px;
    }

    .probability-value {
        font-size: 30px;
    }
}
</style>
</head>

<body>

<div class="container">

    <!-- HEADER -->
    <div class="header">
        <h1>🔥 TOMSONSTAKES</h1>
        <div class="subtitle">
            GLOBAL FOOTBALL PREDICTION ENGINE
        </div>
    </div>

    <!-- DATE CONTROL -->
    <div class="control-box">

        <p>
            Select a date to scan available football fixtures.
        </p>

        <input
            type="date"
            id="matchDate"
        >

        <br>

        <button
            class="main-button"
            id="scanButton"
            onclick="analyzeMatches()"
        >
            ANALYZE MATCHES
        </button>

    </div>

    <!-- RESULTS -->
    <div id="results"></div>

</div>


<script>

/* =========================================================
   TOP LEAGUE PRIORITY
   Lower number = displayed earlier
========================================================= */

const TOP_LEAGUES = [

    "Premier League",
    "La Liga",
    "Bundesliga",
    "Serie A",
    "Ligue 1",

    "UEFA Champions League",
    "UEFA Europa League",
    "UEFA Conference League",

    "Eredivisie",
    "Primeira Liga",
    "Saudi Pro League",
    "Belgian Pro League",
    "Süper Lig",
    "Scottish Premiership",

    "Brasileirão Série A",
    "Liga Profesional Argentina",
    "Liga MX",
    "MLS",
    "J1 League",

    "Championship",
    "2. Bundesliga",
    "Serie B",
    "Ligue 2",
    "LaLiga 2",

    "Copa Libertadores",
    "Copa Sudamericana",

    "CAF Champions League",
    "CAF Confederation Cup"

];


/* =========================================================
   STATUS GROUPS
========================================================= */

const FINISHED_STATUSES = [
    "FT",
    "AET",
    "PEN",
    "AWD",
    "WO"
];

const LIVE_STATUSES = [
    "1H",
    "HT",
    "2H",
    "ET",
    "BT",
    "P"
];

const POSTPONED_STATUSES = [
    "PST"
];

const CANCELLED_STATUSES = [
    "CANC",
    "ABD"
];

const SUSPENDED_STATUSES = [
    "SUSP",
    "INT"
];


/* =========================================================
   MAIN FIXTURE SCAN
========================================================= */

async function analyzeMatches() {

    const date =
        document.getElementById("matchDate").value;

    const results =
        document.getElementById("results");

    const scanButton =
        document.getElementById("scanButton");


    if (!date) {

        results.innerHTML = `
            <div class="notice status-warning">
                ⚠️ Please select a match date.
            </div>
        `;

        return;
    }


    scanButton.disabled = true;

    results.innerHTML = `
        <div class="notice">

            <h2>🔥 TOMSONSTAKES</h2>

            <p>
                🔎 Scanning global football fixtures for
                <strong>${escapeHtml(date)}</strong>...
            </p>

            <p>
                ⏳ Connecting to live football data...
            </p>

        </div>
    `;


    try {

        const response = await fetch(
            `/api/fixtures?date=${encodeURIComponent(date)}`
        );


        const data = await response.json();


        if (!response.ok) {

            throw new Error(
                data.message ||
                data.error ||
                "Unable to retrieve football fixtures."
            );

        }


        if (
            data.errors &&
            Object.keys(data.errors).length > 0
        ) {

            const apiErrors =
                Object.values(data.errors).join("; ");

            throw new Error(apiErrors);

        }


        if (
            !data.response ||
            !Array.isArray(data.response) ||
            data.response.length === 0
        ) {

            results.innerHTML = `

                <div class="notice">

                    <h2>⚽ TOMSONSTAKES GLOBAL FIXTURES</h2>

                    <p>
                        📅 Date:
                        <strong>${escapeHtml(date)}</strong>
                    </p>

                    <div class="status status-warning">
                        ⚠️ No football fixtures were found
                        for this date.
                    </div>

                </div>

            `;

            return;
        }


        /*
         * Group all fixtures by:
         *
         * Country
         *      └── League
         *              └── Fixtures
         */

        const grouped =
            groupFixtures(data.response);


        const countryGroups =
            sortCountryGroups(grouped);


        let html = `

            <div class="notice">

                <h2>🔥 TOMSONSTAKES GLOBAL FIXTURES</h2>

                <p>
                    📅 Date:
                    <strong>${escapeHtml(date)}</strong>
                </p>

                <p>
                    🌍 Fixtures found:
                    <strong>${data.response.length}</strong>
                </p>

            </div>

        `;


        let fixtureIndex = 0;


        for (const countryGroup of countryGroups) {

            html += buildCountryGroup(
                countryGroup,
                date,
                () => fixtureIndex++
            );

        }


        results.innerHTML = html;


    } catch (error) {

        console.error(
            "FIXTURE SCAN ERROR:",
            error
        );


        results.innerHTML = `

            <div class="notice">

                <div class="status status-error">

                    ❌ Unable to load fixtures.

                    <br><br>

                    <strong>
                        ${escapeHtml(error.message)}
                    </strong>

                </div>

            </div>

        `;

    } finally {

        scanButton.disabled = false;

    }

}


/* =========================================================
   GROUP FIXTURES
========================================================= */

function groupFixtures(fixtures) {

    const countries = {};


    fixtures.forEach(match => {

        const country =
            match.league?.country ||
            "Other";


        const leagueName =
            match.league?.name ||
            "Unknown Competition";


        const leagueId =
            match.league?.id ||
            leagueName;


        if (!countries[country]) {

            countries[country] = {
                country,
                leagues: {}
            };

        }


        if (!countries[country].leagues[leagueId]) {

            countries[country].leagues[leagueId] = {

                leagueId,

                leagueName,

                leagueLogo:
                    match.league?.logo || "",

                round:
                    match.league?.round || "",

                fixtures: []

            };

        }


        countries[country]
            .leagues[leagueId]
            .fixtures
            .push(match);

    });


    return countries;
}


/* =========================================================
   SORT COUNTRY GROUPS
   A country containing a top league comes first.
========================================================= */

function sortCountryGroups(grouped) {

    return Object.values(grouped).sort(
        (a, b) => {

            const priorityA =
                getBestLeaguePriority(
                    Object.values(a.leagues)
                );

            const priorityB =
                getBestLeaguePriority(
                    Object.values(b.leagues)
                );


            if (priorityA !== priorityB) {

                return priorityA - priorityB;

            }


            return a.country.localeCompare(
                b.country
            );

        }
    );

}


/* =========================================================
   BEST LEAGUE PRIORITY FOR COUNTRY
========================================================= */

function getBestLeaguePriority(leagues) {

    if (!leagues.length) {
        return 9999;
    }


    return Math.min(
        ...leagues.map(
            league =>
                getLeaguePriority(
                    league.leagueName
                )
        )
    );

}


/* =========================================================
   LEAGUE PRIORITY
========================================================= */

function getLeaguePriority(name) {

    const normalized =
        normalizeLeagueName(name);


    for (
        let i = 0;
        i < TOP_LEAGUES.length;
        i++
    ) {

        const target =
            normalizeLeagueName(
                TOP_LEAGUES[i]
            );


        if (
            normalized === target ||
            normalized.includes(target)
        ) {

            return i;

        }

    }


    return 1000;
}


/* =========================================================
   SORT LEAGUES
========================================================= */

function sortLeagues(leagues) {

    return leagues.sort(
        (a, b) => {

            const priorityA =
                getLeaguePriority(
                    a.leagueName
                );

            const priorityB =
                getLeaguePriority(
                    b.leagueName
                );


            if (priorityA !== priorityB) {

                return priorityA - priorityB;

            }


            return a.leagueName.localeCompare(
                b.leagueName
            );

        }
    );

}


/* =========================================================
   SORT FIXTURES BY KICKOFF
========================================================= */

function sortFixtures(fixtures) {

    return fixtures.sort(
        (a, b) => {

            const timeA =
                Number(
                    a.fixture?.timestamp || 0
                );

            const timeB =
                Number(
                    b.fixture?.timestamp || 0
                );


            if (timeA !== timeB) {

                return timeA - timeB;

            }


            const homeA =
                a.teams?.home?.name || "";

            const homeB =
                b.teams?.home?.name || "";


            return homeA.localeCompare(
                homeB
            );

        }
    );

}


/* =========================================================
   COUNTRY HTML
========================================================= */

function buildCountryGroup(
    countryGroup,
    selectedDate,
    getIndex
) {

    const leagues =
        sortLeagues(
            Object.values(
                countryGroup.leagues
            )
        );


    const fixtureCount =
        leagues.reduce(
            (total, league) =>
                total + league.fixtures.length,
            0
        );


    let html = `

        <section class="country-section">

            <div class="country-title">

                🌍
                ${escapeHtml(
                    countryGroup.country
                )}

                <span class="country-count">
                    (${fixtureCount} matches)
                </span>

            </div>

    `;


    leagues.forEach(league => {

        html += buildLeagueGroup(
            league,
            selectedDate,
            getIndex
        );

    });


    html += `

        </section>

    `;


    return html;
}


/* =========================================================
   LEAGUE HTML
========================================================= */

function buildLeagueGroup(
    league,
    selectedDate,
    getIndex
) {

    const fixtures =
        sortFixtures(
            league.fixtures
        );


    let html = `

        <div class="league-section">

            <div class="league-title">

                <div class="league-name">
                    🏆
                    ${escapeHtml(
                        league.leagueName
                    )}
                </div>

                ${
                    league.round
                    ?
                    `<div class="league-round">
                        ${escapeHtml(
                            league.round
                        )}
                    </div>`
                    :
                    ""
                }

            </div>

    `;


    fixtures.forEach(match => {

        const index =
            getIndex();


        html += buildFixtureCard(
            match,
            index,
            selectedDate
        );

    });


    html += `

        </div>

    `;


    return html;
}


/* =========================================================
   FIXTURE CARD
========================================================= */

function buildFixtureCard(
    match,
    index,
    selectedDate
) {

    const home =
        match.teams?.home?.name ||
        "Home Team";


    const away =
        match.teams?.away?.name ||
        "Away Team";


    const homeLogo =
        match.teams?.home?.logo ||
        "";


    const awayLogo =
        match.teams?.away?.logo ||
        "";


    const homeIdentity =
        createIdentity(home);


    const awayIdentity =
        createIdentity(away);


    const identitiesValid =
        Boolean(homeIdentity) &&
        Boolean(awayIdentity) &&
        homeIdentity !== awayIdentity;


    const fixtureId =
        match.fixture?.id || "";


    const state =
        getMatchState(match);


    const kickoff =
        formatKickoffWAT(
            match.fixture?.date,
            match.fixture?.timestamp
        );


    let middleHTML = "";


    /*
     * UPCOMING
     */

    if (state.type === "upcoming") {

        middleHTML = `

            <div class="score-area">

                <div class="vs">
                    VS
                </div>

                <div class="status-pill status-upcoming">
                    UPCOMING
                </div>

            </div>

        `;

    }


    /*
     * LIVE
     */

    else if (state.type === "live") {

        middleHTML = `

            <div class="score-area">

                <div class="score">

                    ${state.homeScore}
                    -
                    ${state.awayScore}

                </div>

                <div class="status-pill status-live">

                    ${
                        state.statusCode === "HT"
                        ?
                        "HALF TIME"
                        :
                        (
                            state.elapsed
                            ?
                            `LIVE ${state.elapsed}'`
                            :
                            "LIVE"
                        )
                    }

                </div>

            </div>

        `;

    }


    /*
     * FINISHED
     */

    else if (state.type === "finished") {

        middleHTML = `

            <div class="score-area">

                <div class="score">

                    ${state.homeScore}
                    -
                    ${state.awayScore}

                </div>

                <div class="status-pill status-finished">

                    ${escapeHtml(
                        state.label
                    )}

                </div>

            </div>

        `;

    }


    /*
     * POSTPONED
     */

    else if (state.type === "postponed") {

        middleHTML = `

            <div class="score-area">

                <div class="vs">
                    —
                </div>

                <div class="status-pill status-postponed">
                    POSTPONED
                </div>

            </div>

        `;

    }


    /*
     * CANCELLED
     */

    else if (state.type === "cancelled") {

        middleHTML = `

            <div class="score-area">

                <div class="vs">
                    —
                </div>

                <div class="status-pill status-cancelled">
                    CANCELLED
                </div>

            </div>

        `;

    }


    /*
     * SUSPENDED / INTERRUPTED
     */

    else if (state.type === "suspended") {

        middleHTML = `

            <div class="score-area">

                <div class="score">

                    ${state.homeScore}
                    -
                    ${state.awayScore}

                </div>

                <div class="status-pill status-suspended">

                    ${escapeHtml(
                        state.label
                    )}

                </div>

            </div>

        `;

    }


    return `

        <div
            class="fixture"
            id="fixture-${index}"
        >

            <div class="fixture-header">

                <span class="fixture-number">

                    MATCH #${index + 1}

                </span>

                <span class="match-time">

                    🕐 ${escapeHtml(kickoff)}

                </span>

            </div>


            <div class="teams-area">


                <!-- HOME TEAM -->

                <div class="team">

                    ${
                        homeLogo
                        ?
                        `
                        <img
                            class="team-logo"
                            src="${escapeHtml(homeLogo)}"
                            alt=""
                            onerror="this.style.display='none'"
                        >
                        `
                        :
                        ""
                    }

                    <div class="team-name">

                        ${escapeHtml(home)}

                    </div>

                </div>


                <!-- SCORE / STATUS -->

                ${middleHTML}


                <!-- AWAY TEAM -->

                <div class="team team-away">

                    <div class="team-name">

                        ${escapeHtml(away)}

                    </div>

                    ${
                        awayLogo
                        ?
                        `
                        <img
                            class="team-logo"
                            src="${escapeHtml(awayLogo)}"
                            alt=""
                            onerror="this.style.display='none'"
                        >
                        `
                        :
                        ""
                    }

                </div>


            </div>


            ${
                state.type === "upcoming"
                ?
                `
                <div class="kickoff-only">

                    Kickoff:
                    ${escapeHtml(kickoff)}

                </div>
                `
                :
                ""
            }


            <div class="fixture-footer">

                <div class="fixture-id">

                    Fixture ID:
                    ${escapeHtml(String(fixtureId))}

                </div>


                ${
                    identitiesValid
                    ?
                    `
                    <button
                        class="analyze-button"
                        id="analyze-button-${index}"
                        onclick="
                            runMatchAnalysis(
                                ${index},
                                '${escapeJs(home)}',
                                '${escapeJs(away)}',
                                '${escapeJs(homeIdentity)}',
                                '${escapeJs(awayIdentity)}',
                                '${escapeJs(selectedDate)}'
                            )
                        "
                    >

                        🔍 ANALYZE MATCH

                    </button>
                    `
                    :
                    `
                    <div class="status status-error">

                        ❌ Unable to create valid
                        team identities.

                    </div>
                    `
                }


                <div
                    id="analysis-${index}"
                    class="analysis"
                ></div>

            </div>

        </div>

    `;
}


/* =========================================================
   DETERMINE MATCH STATE
========================================================= */

function getMatchState(match) {

    const statusCode =
        String(
            match.fixture?.status?.short ||
            "NS"
        ).toUpperCase();


    const statusLong =
        match.fixture?.status?.long ||
        statusCode;


    const homeScore =
        match.goals?.home ?? 0;


    const awayScore =
        match.goals?.away ?? 0;


    const elapsed =
        match.fixture?.status?.elapsed ??
        null;


    /*
     * FINISHED
     */

    if (
        FINISHED_STATUSES.includes(
            statusCode
        )
    ) {

        let label = "FT";


        if (statusCode === "AET") {

            label = "AET";

        }

        else if (statusCode === "PEN") {

            label = "PEN";

        }

        else if (statusCode === "AWD") {

            label = "AWARDED";

        }

        else if (statusCode === "WO") {

            label = "WALKOVER";

        }


        return {

            type: "finished",

            statusCode,

            label,

            homeScore,

            awayScore

        };

    }


    /*
     * LIVE
     */

    if (
        LIVE_STATUSES.includes(
            statusCode
        )
    ) {

        return {

            type: "live",

            statusCode,

            elapsed,

            homeScore,

            awayScore

        };

    }


    /*
     * POSTPONED
     */

    if (
        POSTPONED_STATUSES.includes(
            statusCode
        )
    ) {

        return {

            type: "postponed",

            statusCode

        };

    }


    /*
     * CANCELLED
     */

    if (
        CANCELLED_STATUSES.includes(
            statusCode
        )
    ) {

        return {

            type: "cancelled",

            statusCode

        };

    }


    /*
     * SUSPENDED / INTERRUPTED
     */

    if (
        SUSPENDED_STATUSES.includes(
            statusCode
        )
    ) {

        return {

            type: "suspended",

            statusCode,

            label:
                statusCode === "INT"
                ?
                "INTERRUPTED"
                :
                "SUSPENDED",

            homeScore,

            awayScore

        };

    }


    /*
     * EVERYTHING ELSE
     *
     * NS, TBD, etc.
     * These are treated as upcoming.
     */

    return {

        type: "upcoming",

        statusCode

    };

}


/* =========================================================
   FORMAT KICKOFF IN NIGERIAN TIME
========================================================= */

function formatKickoffWAT(
    isoDate,
    timestamp
) {

    try {

        let dateObject;


        if (timestamp) {

            dateObject =
                new Date(
                    Number(timestamp) * 1000
                );

        }

        else if (isoDate) {

            dateObject =
                new Date(isoDate);

        }

        else {

            return "Time unavailable";

        }


        return dateObject.toLocaleTimeString(
            "en-NG",
            {
                timeZone: "Africa/Lagos",
                hour: "2-digit",
                minute: "2-digit",
                hour12: false
            }
        ) + " WAT";


    } catch (error) {

        return "Time unavailable";

    }

}


/* =========================================================
   MATCH ANALYSIS
========================================================= */

async function runMatchAnalysis(
    index,
    home,
    away,
    homeIdentity,
    awayIdentity,
    date
) {

    const box =
        document.getElementById(
            `analysis-${index}`
        );


    const button =
        document.getElementById(
            `analyze-button-${index}`
        );


    box.innerHTML = `

        <div class="status status-warning">

            🔎 Searching football evidence...

        </div>

    `;


    button.disabled = true;


    const MATCH = {

        home,

        homeIdentity,

        away,

        awayIdentity,

        date

    };


    try {

        /*
         * STEP 1
         * WEB DATA
         */

        const webUrl =
            `/api/web-data` +
            `?home=${encodeURIComponent(home)}` +
            `&homeIdentity=${encodeURIComponent(homeIdentity)}` +
            `&away=${encodeURIComponent(away)}` +
            `&awayIdentity=${encodeURIComponent(awayIdentity)}` +
            `&date=${encodeURIComponent(date)}`;


        const webResponse =
            await fetch(webUrl);


        const webData =
            await webResponse.json();


        if (!webResponse.ok) {

            throw new Error(
                webData.error ||
                webData.message ||
                "Web data request failed."
            );

        }


        /*
         * STEP 2
         * NORMALIZE WEB DATA
         */

        box.innerHTML = `

            <div class="status status-warning">

                ⚙️ Normalizing football sources...

            </div>

        `;


        const normalizeResponse =
            await fetch(
                "/api/normalize-web",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({

                        ...webData,

                        match: MATCH

                    })

                }
            );


        const normalized =
            await normalizeResponse.json();


        if (!normalizeResponse.ok) {

            throw new Error(
                normalized.error ||
                normalized.message ||
                "Normalization failed."
            );

        }


        /*
         * STEP 3
         * PREDICTION ENGINE
         */

        box.innerHTML = `

            <div class="status status-warning">

                🧠 Running prediction engine...

            </div>

        `;


        const predictionResponse =
            await fetch(
                "/api/predict",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({

                        match: MATCH,

                        normalized

                    })

                }
            );


        const prediction =
            await predictionResponse.json();


        if (!predictionResponse.ok) {

            throw new Error(
                prediction.error ||
                prediction.message ||
                "Prediction failed."
            );

        }


        /*
         * FINAL DISPLAY
         *
         * IMPORTANT:
         * We intentionally display ONLY:
         *
         * PREDICTION
         * PROBABILITY
         */

        box.innerHTML =
            buildAnalysisHTML(
                prediction
            );


        button.textContent =
            "✓ ANALYSIS COMPLETE";


        button.disabled = false;


    } catch (error) {

        console.error(
            "MATCH ANALYSIS ERROR:",
            error
        );


        box.innerHTML = `

            <div class="status status-error">

                ❌ Analysis failed.

                <br><br>

                <strong>
                    ${escapeHtml(
                        error.message
                    )}
                </strong>

            </div>

        `;


        button.disabled = false;

    }

}


/* =========================================================
   FINAL PREDICTION DISPLAY
========================================================= */

function buildAnalysisHTML(
    prediction
) {

    if (
        !prediction ||
        !prediction.success ||
        !prediction.prediction
    ) {

        return `

            <div class="status status-warning">

                ⚠️ No sufficiently supported
                prediction was produced for
                this fixture.

            </div>

        `;

    }


    const probability =
        formatPredictionProbability(
            prediction.probability
        );


    return `

        <div class="prediction-result">

            <div class="prediction-label">

                PREDICTION

            </div>


            <div class="prediction-value">

                ${escapeHtml(
                    prediction.prediction
                )}

            </div>


            <div class="probability-label">

                PROBABILITY

            </div>


            <div class="probability-value">

                ${escapeHtml(
                    probability
                )}

            </div>

        </div>

    `;

}


/* =========================================================
   FORMAT PROBABILITY
========================================================= */

function formatPredictionProbability(
    value
) {

    if (
        value === undefined ||
        value === null ||
        value === ""
    ) {

        return "—";

    }


    const number =
        Number(value);


    if (
        Number.isNaN(number)
    ) {

        return String(value);

    }


    /*
     * If API returns 0.72,
     * convert to 72%.
     *
     * If API returns 72,
     * keep 72%.
     */

    const percent =
        number > 0 && number <= 1
        ?
        number * 100
        :
        number;


    return (
        Math.round(percent)
        + "%"
    );

}


/* =========================================================
   NORMALIZE LEAGUE NAME
========================================================= */

function normalizeLeagueName(
    name
) {

    return String(name || "")
        .normalize("NFD")
        .replace(
            /[\u0300-\u036f]/g,
            ""
        )
        .toLowerCase()
        .replace(
            /[^a-z0-9]+/g,
            " "
        )
        .trim();

}


/* =========================================================
   CREATE TEAM IDENTITY
========================================================= */

function createIdentity(name) {

    return String(name || "")
        .trim()
        .normalize("NFD")
        .replace(
            /[\u0300-\u036f]/g,
            ""
        )
        .replace(
            /[’']/g,
            ""
        )
        .replace(
            /&/g,
            " AND "
        )
        .toUpperCase()
        .replace(
            /[^A-Z0-9]+/g,
            "_"
        )
        .replace(
            /^_+|_+$/g,
            ""
        ) || "";

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(value) {

    return String(value ?? "")
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


/* =========================================================
   ESCAPE JAVASCRIPT STRING
========================================================= */

function escapeJs(value) {

    return String(value ?? "")
        .replace(
            /\\/g,
            "\\\\"
        )
        .replace(
            /'/g,
            "\\'"
        )
        .replace(
            /\r/g,
            "\\r"
        )
        .replace(
            /\n/g,
            "\\n"
        );

}
