    <h1>

    </h1>

    <div class="subtitle">

    </div>

</div>

<div class="control-box">

    <p>
        Select a date to scan available football fixtures.
    </p>

    <input
        type="date"
        id="matchDate"
    >

    <br>

    <button

        id="scanButton"
        onclick="analyzeMatches()"
    >
        ANALYZE MATCHES
    </button>

</div>

<div id="results"></div>

</div><script>

/* =========================================================
   TOP LEAGUE PRIORITY
========================================================= */

const TOP_LEAGUES = [

    "Premier League",
    "La Liga",
    "Bundesliga",
    "Serie A",
    "Ligue 1",

    "UEFA Champions League",
    "UEFA Europa League",
    "UEFA Conference League",

    "Eredivisie",
    "Primeira Liga",
    "Saudi Pro League",
    "Belgian Pro League",
    "Süper Lig",
    "Scottish Premiership",

    "Brasileirão Série A",
    "Liga Profesional Argentina",
    "Liga MX",
    "MLS",
    "J1 League",

    "Championship",
    "2. Bundesliga",
    "Serie B",
    "Ligue 2",
    "LaLiga 2",

    "Copa Libertadores",
    "Copa Sudamericana",

    "CAF Champions League",
    "CAF Confederation Cup"

];


/* =========================================================
   STATUS GROUPS
========================================================= */

const FINISHED_STATUSES = [
    "FT",
    "AET",
    "PEN",
    "AWD",
    "WO"
];

const LIVE_STATUSES = [
    "1H",
    "HT",
    "2H",
    "ET",
    "BT",
    "P"
];

const POSTPONED_STATUSES = [
    "PST"
];

const CANCELLED_STATUSES = [
    "CANC",
    "ABD"
];

const SUSPENDED_STATUSES = [
    "SUSP",
    "INT"
];


/* =========================================================
   MAIN FIXTURE SCAN
========================================================= */

async function analyzeMatches() {

    const date =
        document.getElementById("matchDate").value;

    const results =
        document.getElementById("results");

    const scanButton =
        document.getElementById("scanButton");

    if (!date) {

        results.innerHTML = `
            <div class="notice status-warning">
                ⚠️ Please select a match date.
            </div>
        `;

        return;
    }

    scanButton.disabled = true;

    results.innerHTML = `
        <div class="notice">

            <h2>🔥 TOMSONSTAKES</h2>

            <p>
                🔎 Scanning global football fixtures for
                <strong>${escapeHtml(date)}</strong>...
            </p>

            <p>
                ⏳ Connecting to live football data...
            </p>

        </div>
    `;

    try {

        const response = await fetch(
            `/api/fixtures?date=${encodeURIComponent(date)}`
        );

        const data =
            await response.json();

        if (!response.ok) {

            throw new Error(
                data.message ||
                data.error ||
                "Unable to retrieve football fixtures."
            );

        }

        if (
            data.errors &&
            Object.keys(data.errors).length > 0
        ) {

            const apiErrors =
                Object.values(data.errors).join("; ");

            throw new Error(apiErrors);

        }

        if (
            !data.response ||
            !Array.isArray(data.response) ||
            data.response.length === 0
        ) {

            results.innerHTML = `

                <div class="notice">

                    <h2>
                        ⚽ TOMSONSTAKES GLOBAL FIXTURES
                    </h2>

                    <p>
                        📅 Date:
                        <strong>
                            ${escapeHtml(date)}
                        </strong>
                    </p>

                    <div class="status status-warning">
                        ⚠️ No football fixtures were found
                        for this date.
                    </div>

                </div>

            `;

            return;
        }

        const grouped =
            groupFixtures(data.response);

        const countryGroups =
            sortCountryGroups(grouped);

        let html = `

            <div class="notice">

                <h2>
                    🔥 TOMSONSTAKES GLOBAL FIXTURES
                </h2>

                <p>
                    📅 Date:
                    <strong>
                        ${escapeHtml(date)}
                    </strong>
                </p>

                <p>
                    🌍 Fixtures found:
                    <strong>
                        ${data.response.length}
                    </strong>
                </p>

            </div>

        `;

        let fixtureIndex = 0;

        for (
            const countryGroup
            of countryGroups
        ) {

            html += buildCountryGroup(
                countryGroup,
                date,
                () => fixtureIndex++
            );

        }

        results.innerHTML = html;

    } catch (error) {

        console.error(
            "FIXTURE SCAN ERROR:",
            error
        );

        results.innerHTML = `

            <div class="notice">

                <div class="status status-error">

                    ❌ Unable to load fixtures.

                    <br><br>

                    <strong>
                        ${escapeHtml(
                            error.message
                        )}
                    </strong>

                </div>

            </div>

        `;

    } finally {

        scanButton.disabled = false;

    }

}


/* =========================================================
   GROUP FIXTURES
========================================================= */

function groupFixtures(fixtures) {

    const countries = {};

    fixtures.forEach(match => {

        const country =
            match.league?.country ||
            "Other";

        const leagueName =
            match.league?.name ||
            "Unknown Competition";

        const leagueId =
            match.league?.id ||
            leagueName;

        if (!countries[country]) {

            countries[country] = {
                country,
                leagues: {}
            };

        }

        if (
            !countries[country]
                .leagues[leagueId]
        ) {

            countries[country]
                .leagues[leagueId] = {

                    leagueId,

                    leagueName,

                    leagueLogo:
                        match.league?.logo ||
                        "",

                    round:
                        match.league?.round ||
                        "",

                    season:
                        match.league?.season ||
                        null,

                    fixtures: []

                };

        }

        countries[country]
            .leagues[leagueId]
            .fixtures
            .push(match);

    });

    return countries;
}


/* =========================================================
   SORT COUNTRY GROUPS
========================================================= */

function sortCountryGroups(grouped) {

    return Object.values(grouped).sort(
        (a, b) => {

            const priorityA =
                getBestLeaguePriority(
                    Object.values(a.leagues)
                );

            const priorityB =
                getBestLeaguePriority(
                    Object.values(b.leagues)
                );

            if (
                priorityA !==
                priorityB
            ) {

                return priorityA -
                    priorityB;

            }

            return a.country.localeCompare(
                b.country
            );

        }
    );
}


/* =========================================================
   BEST LEAGUE PRIORITY
========================================================= */

function getBestLeaguePriority(
    leagues
) {

    if (!leagues.length) {
        return 9999;
    }

    return Math.min(
        ...leagues.map(
            league =>
                getLeaguePriority(
                    league.leagueName
                )
        )
    );
}


/* =========================================================
   LEAGUE PRIORITY
========================================================= */

function getLeaguePriority(name) {

    const normalized =
        normalizeLeagueName(name);

    for (
        let i = 0;
        i < TOP_LEAGUES.length;
        i++
    ) {

        const target =
            normalizeLeagueName(
                TOP_LEAGUES[i]
            );

        if (
            normalized === target ||
            normalized.includes(target)
        ) {

            return i;

        }

    }

    return 1000;
}


/* =========================================================
   SORT LEAGUES
========================================================= */

function sortLeagues(leagues) {

    return leagues.sort(
        (a, b) => {

            const priorityA =
                getLeaguePriority(
                    a.leagueName
                );

            const priorityB =
                getLeaguePriority(
                    b.leagueName
                );

            if (
                priorityA !==
                priorityB
            ) {

                return priorityA -
                    priorityB;

            }

            return a.leagueName.localeCompare(
                b.leagueName
            );

        }
    );
}


/* =========================================================
   SORT FIXTURES
========================================================= */

function sortFixtures(fixtures) {

    return fixtures.sort(
        (a, b) => {

            const timeA =
                Number(
                    a.fixture?.timestamp ||
                    0
                );

            const timeB =
                Number(
                    b.fixture?.timestamp ||
                    0
                );

            if (
                timeA !==
                timeB
            ) {

                return timeA -
                    timeB;

            }

            const homeA =
                a.teams?.home?.name ||
                "";

            const homeB =
                b.teams?.home?.name ||
                "";

            return homeA.localeCompare(
                homeB
            );

        }
    );
}


/* =========================================================
   COUNTRY HTML
========================================================= */

function buildCountryGroup(
    countryGroup,
    selectedDate,
    getIndex
) {

    const leagues =
        sortLeagues(
            Object.values(
                countryGroup.leagues
            )
        );

    const fixtureCount =
        leagues.reduce(
            (total, league) =>
                total +
                league.fixtures.length,
            0
        );

    let html = `

        <section class="country-section">

            <div class="country-title">

                🌍
                ${escapeHtml(
                    countryGroup.country
                )}

                <span class="country-count">
                    (${fixtureCount} matches)
                </span>

            </div>

    `;

    leagues.forEach(league => {

        html += buildLeagueGroup(
            league,
            selectedDate,
            getIndex
        );

    });

    html += `
        </section>
    `;

    return html;
}


/* =========================================================
   LEAGUE HTML
========================================================= */

function buildLeagueGroup(
    league,
    selectedDate,
    getIndex
) {

    const fixtures =
        sortFixtures(
            league.fixtures
        );

    let html = `

        <div class="league-section">

            <div class="league-title">

                <div class="league-name">

                    🏆
                    ${escapeHtml(
                        league.leagueName
                    )}

                </div>

                ${
                    league.round
                    ?
                    `
                    <div class="league-round">
                        ${escapeHtml(
                            league.round
                        )}
                    </div>
                    `
                    :
                    ""
                }

            </div>

    `;

    fixtures.forEach(match => {

        const index =
            getIndex();

        html += buildFixtureCard(
            match,
            index,
            selectedDate
        );

    });

    html += `
        </div>
    `;

    return html;
}


/* =========================================================
   FIXTURE CARD
========================================================= */

function buildFixtureCard(
    match,
    index,
    selectedDate
) {

    const home =
        match.teams?.home?.name ||
        "Home Team";

    const away =
        match.teams?.away?.name ||
        "Away Team";

    const homeId =
        Number(
            match.teams?.home?.id
        );

    const awayId =
        Number(
            match.teams?.away?.id
        );

    const leagueId =
        Number(
            match.league?.id
        );

    const season =
        Number(
            match.league?.season
        );

    const homeLogo =
        match.teams?.home?.logo ||
        "";

    const awayLogo =
        match.teams?.away?.logo ||
        "";

    const homeIdentity =
        createIdentity(home);

    const awayIdentity =
        createIdentity(away);

    const identitiesValid =
        Boolean(homeIdentity) &&
        Boolean(awayIdentity) &&
        homeIdentity !== awayIdentity;

    const idsValid =
        Number.isFinite(homeId) &&
        Number.isFinite(awayId) &&
        homeId > 0 &&
        awayId > 0;

    const leagueValid =
        Number.isFinite(leagueId) &&
        leagueId > 0;

    const seasonValid =
        Number.isFinite(season) &&
        season >= 2000;

    const fixtureId =
        match.fixture?.id ||
        "";

    const state =
        getMatchState(match);

    const kickoff =
        formatKickoffWAT(
            match.fixture?.date,
            match.fixture?.timestamp
        );

    let middleHTML = "";

    if (
        state.type ===
        "upcoming"
    ) {

        middleHTML = `

            <div class="score-area">

                <div class="vs">
                    VS
                </div>

                <div class="status-pill status-upcoming">
                    UPCOMING
                </div>

            </div>

        `;

    }

    else if (
        state.type ===
        "live"
    ) {

        middleHTML = `

            <div class="score-area">

                <div class="score">
                    ${state.homeScore}
                    -
                    ${state.awayScore}
                </div>

                <div class="status-pill status-live">

                    ${
                        state.statusCode === "HT"
                        ?
                        "HALF TIME"
                        :
                        (
                            state.elapsed
                            ?
                            `LIVE ${state.elapsed}'`
                            :
                            "LIVE"
                        )
                    }

                </div>

            </div>

        `;

    }

    else if (
        state.type ===
        "finished"
    ) {

        middleHTML = `

            <div class="score-area">

                <div class="score">
                    ${state.homeScore}
                    -
                    ${state.awayScore}
                </div>

                <div class="status-pill status-finished">

                    ${escapeHtml(
                        state.label
                    )}

                </div>

            </div>

        `;

    }

    else if (
        state.type ===
        "postponed"
    ) {

        middleHTML = `

            <div class="score-area">

                <div class="vs">—</div>

                <div class="status-pill status-postponed">
                    POSTPONED
                </div>

            </div>

        `;

    }

    else if (
        state.type ===
        "cancelled"
    ) {

        middleHTML = `

            <div class="score-area">

                <div class="vs">—</div>

                <div class="status-pill status-cancelled">
                    CANCELLED
                </div>

            </div>

        `;

    }

    else {

        middleHTML = `

            <div class="score-area">

                <div class="score">
                    ${state.homeScore}
                    -
                    ${state.awayScore}
                </div>

                <div class="status-pill status-suspended">

                    ${escapeHtml(
                        state.label ||
                        "SUSPENDED"
                    )}

                </div>

            </div>

        `;

    }

    const canAnalyze =
        state.type === "upcoming" &&
        identitiesValid &&
        idsValid &&
        leagueValid &&
        seasonValid;

    let analysisButton = "";

    if (canAnalyze) {

        analysisButton = `

            <button
                class="analyze-button"
                id="analyze-button-${index}"
                onclick="
                    runMatchAnalysis(
                        ${index},
                        '${escapeJs(home)}',
                        '${escapeJs(away)}',
                        ${homeId},
                        ${awayId},
                        ${leagueId},
                        ${season},
                        '${escapeJs(homeIdentity)}',
                        '${escapeJs(awayIdentity)}',
                        '${escapeJs(selectedDate)}',
                        ${fixtureId || "null"}
                    )
                "
            >

                🔍 ANALYZE MATCH

            </button>

        `;

    }

    else {

        analysisButton = `

            <div class="status status-warning">

                ⚠️ Prediction analysis requires
                valid home team ID, away team ID,
                league ID and season.

            </div>

        `;

    }

    return `

        <div
            class="fixture"
            id="fixture-${index}"
        >

            <div class="fixture-header">

                <span class="fixture-number">
                    MATCH #${index + 1}
                </span>

                <span class="match-time">
                    🕐 ${escapeHtml(kickoff)}
                </span>

            </div>

            <div class="teams-area">

                <div class="team">

                    ${
                        homeLogo
                        ?
                        `
                        <img
                            class="team-logo"
                            src="${escapeHtml(homeLogo)}"
                            alt=""
                            onerror="this.style.display='none'"
                        >
                        `
                        :
                        ""
                    }

                    <div class="team-name">
                        ${escapeHtml(home)}
                    </div>

                </div>

                ${middleHTML}

                <div class="team team-away">

                    <div class="team-name">
                        ${escapeHtml(away)}
                    </div>

                    ${
                        awayLogo
                        ?
                        `
                        <img
                            class="team-logo"
                            src="${escapeHtml(awayLogo)}"
                            alt=""
                            onerror="this.style.display='none'"
                        >
                        `
                        :
                        ""
                    }

                </div>

            </div>

            ${
                state.type ===
                "upcoming"
                ?
                `
                <div class="kickoff-only">

                    Kickoff:
                    ${escapeHtml(kickoff)}

                </div>
                `
                :
                ""
            }

            <div class="fixture-footer">

                <div class="fixture-id">

                    Fixture ID:
                    ${escapeHtml(
                        String(fixtureId)
                    )}

                    <br>

                    Team IDs:
                    ${escapeHtml(
                        String(homeId)
                    )}
                    -
                    ${escapeHtml(
                        String(awayId)
                    )}

                    <br>

                    League:
                    ${escapeHtml(
                        String(leagueId)
                    )}

                    |

                    Season:
                    ${escapeHtml(
                        String(season)
                    )}

                </div>

                ${analysisButton}

                <div
                    id="analysis-${index}"
                    class="analysis"
                ></div>

            </div>

        </div>

    `;
}


/* =========================================================
   MATCH ANALYSIS
========================================================= */

async function runMatchAnalysis(
    index,
    home,
    away,
    homeId,
    awayId,
    leagueId,
    season,
    homeIdentity,
    awayIdentity,
    date,
    fixtureId
) {

    const box =
        document.getElementById(
            `analysis-${index}`
        );

    const button =
        document.getElementById(
            `analyze-button-${index}`
        );

    box.innerHTML = `

        <div class="status status-warning">

            🔎 Searching football evidence...

        </div>

    `;

    button.disabled = true;

    const MATCH = {

        fixtureId:
            fixtureId || null,

        home,

        homeId,

        homeIdentity,

        away,

        awayId,

        awayIdentity,

        leagueId,

        season,

        date

    };

    try {

        /* =====================================================
           STEP 1 — WEB DATA
        ===================================================== */

        const webUrl =
            `/api/web-data` +
            `?home=${encodeURIComponent(home)}` +
            `&homeIdentity=${encodeURIComponent(homeIdentity)}` +
            `&away=${encodeURIComponent(away)}` +
            `&awayIdentity=${encodeURIComponent(awayIdentity)}` +
            `&homeId=${encodeURIComponent(homeId)}` +
            `&awayId=${encodeURIComponent(awayId)}` +
            `&leagueId=${encodeURIComponent(leagueId)}` +
            `&season=${encodeURIComponent(season)}` +
            `&fixtureId=${encodeURIComponent(fixtureId || "")}` +
            `&date=${encodeURIComponent(date)}`;

        const webResponse =
            await fetch(webUrl);

        const webData =
            await webResponse.json();

        if (!webResponse.ok) {

            throw new Error(
                webData.error ||
                webData.message ||
                "Web data request failed."
            );

        }

        /* =====================================================
           STEP 2 — NORMALIZE
        ===================================================== */

        box.innerHTML = `

            <div class="status status-warning">

                ⚙️ Normalizing football sources...

            </div>

        `;

        const normalizeResponse =
            await fetch(
                "/api/normalize-web",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            ...webData,

                            match: MATCH

                        })

                }
            );

        const normalized =
            await normalizeResponse.json();

        if (!normalizeResponse.ok) {

            throw new Error(
                normalized.error ||
                normalized.message ||
                "Normalization failed."
            );

        }

        /* =====================================================
           STEP 3 — PREDICTION
        ===================================================== */

        box.innerHTML = `

            <div class="status status-warning">

                🧠 Running TOMSONSTAKES V4.0
                prediction engine...

            </div>

        `;

        const predictionResponse =
            await fetch(
                "/api/predict",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            match: MATCH,

                            normalized

                        })

                }
            );

        const prediction =
            await predictionResponse.json();

        if (!predictionResponse.ok) {

            throw new Error(
                prediction.error ||
                prediction.message ||
                "Prediction failed."
            );

        }

        box.innerHTML =
            buildAnalysisHTML(
                prediction
            );

        button.textContent =
            "✓ ANALYSIS COMPLETE";

        button.disabled = false;

    }

    catch (error) {

        console.error(
            "MATCH ANALYSIS ERROR:",
            error
        );

        box.innerHTML = `

            <div class="status status-error">

                ❌ Analysis failed.

                <br><br>

                <strong>
                    ${escapeHtml(
                        error.message
                    )}
                </strong>

            </div>

        `;

        button.disabled = false;

    }

}


/* =========================================================
   FINAL PREDICTION DISPLAY
========================================================= */

function buildAnalysisHTML(
    prediction
) {

    if (
        !prediction ||
        !prediction.success ||
        !prediction.prediction
    ) {

        return `

            <div class="status status-warning">

                ⚠️ No sufficiently supported
                prediction was produced for
                this fixture.

            </div>

        `;

    }

    const rawProbability =
        Number(
            prediction.probability
        );

    if (
        Number.isNaN(rawProbability) ||
        !Number.isFinite(rawProbability)
    ) {

        return `

            <div class="status status-warning">

                ⚠️ Invalid probability returned
                by prediction engine.

            </div>

        `;

    }

    let probability =
        rawProbability > 0 &&
        rawProbability <= 1
        ?
        rawProbability * 100
        :
        rawProbability;

    probability =
        Math.max(
            0,
            Math.min(
                100,
                probability
            )
        );

    let remark;
    let remarkClass;

    if (probability < 60) {

        remark = "AVOID";
        remarkClass = "remark-avoid";

    }

    else if (probability <= 80) {

        remark = "MEDIUM";
        remarkClass = "remark-medium";

    }

    else {

        remark = "HIGH";
        remarkClass = "remark-high";

    }

    const displayProbability =
        Math.round(probability) +
        "%";

    return `

        <div class="prediction-result">

            <div class="prediction-label">
                TOMSONSTAKES V4.0 PREDICTION
            </div>

            <div class="prediction-value">

                ${escapeHtml(
                    prediction.prediction
                )}

            </div>

            <div class="probability-label">
                PROBABILITY
            </div>

            <div class="probability-value">

                ${escapeHtml(
                    displayProbability
                )}

            </div>

            <div
                class="prediction-remark ${remarkClass}"
            >

                ${escapeHtml(
                    remark
                )}

            </div>

            ${buildSignalBreakdown(
                prediction
            )}

        </div>

    `;
}


/* =========================================================
   SIGNAL BREAKDOWN
========================================================= */

function buildSignalBreakdown(
    prediction
) {

    const signals =
        prediction.signals ||
        prediction.breakdown ||
        prediction.components ||
        null;

    if (
        !signals ||
        typeof signals !== "object"
    ) {

        return "";

    }

    const signalDefinitions = [

        {
            keys: [
                "last5RecencyWeighted",
                "recencyWeightedForm",
                "last5"
            ],

            label:
                "Last 5 — Recency Weighted",

            weight:
                45

        },

        {
            keys: [
                "leagueStandings",
                "standings"
            ],

            label:
                "Current League Standings",

            weight:
                30

        },

        {
            keys: [
                "seasonHomeAwayStrength",
                "homeAwayStrength"
            ],

            label:
                "Season Home/Away Strength",

            weight:
                5

        },

        {
            keys: [
                "expectedGoals",
                "goalModel",
                "xg"
            ],

            label:
                "Expected Goals / Goal Model",

            weight:
                10

        },

        {
            keys: [
                "recentVenueForm",
                "venueForm"
            ],

            label:
                "Recent Home/Away Venue Form",

            weight:
                5

        },

        {
            keys: [
                "last5H2H",
                "h2h"
            ],

            label:
                "Last 5 H2H",

            weight:
                5

        }

    ];

    let rows = "";

    signalDefinitions.forEach(
        definition => {

            let value = null;

            for (
                const key
                of definition.keys
            ) {

                if (
                    signals[key] !==
                    undefined
                ) {

                    value =
                        signals[key];

                    break;

                }

            }

            const display =
                formatSignalValue(
                    value
                );

            const barValue =
                signalToPercentage(
                    value
                );

            rows += `

                <div class="signal-row">

                    <div class="signal-name">

                        ${escapeHtml(
                            definition.label
                        )}

                    </div>

                    <div class="signal-weight">

                        ${definition.weight}%

                    </div>

                    <div class="signal-value">

                        ${escapeHtml(
                            display
                        )}

                    </div>

                    <div class="signal-bar">

                        <div
                            class="signal-fill"
                            style="width:${barValue}%"
                        ></div>

                    </div>

                </div>

            `;

        }
    );

    return `

        <div class="signal-panel">

            <div class="signal-title">

                🧠 ENGINE SIGNAL BREAKDOWN

            </div>

            ${rows}

            <div class="engine-note">

                V4.0 weighting:
                45% recency-weighted last 5,
                30% league standings,
                5% season home/away strength,
                10% expected goals/goal model,
                5% recent venue form,
                5% last 5 H2H.

            </div>

        </div>

    `;
}


/* =========================================================
   FORMAT SIGNAL
========================================================= */

function formatSignalValue(
    value
) {

    if (
        value === null ||
        value === undefined ||
        value === ""
    ) {

        return "N/A";

    }

    if (
        typeof value ===
        "number"
    ) {

        if (
            value >= 0 &&
            value <= 1
        ) {

            return Math.round(
                value * 100
            ) + "%";

        }

        return String(
            Math.round(
                value * 100
            ) / 100
        );

    }

    if (
        typeof value ===
        "object"
    ) {

        if (
            value.score !==
            undefined
        ) {

            return formatSignalValue(
                value.score
            );

        }

        if (
            value.value !==
            undefined
        ) {

            return formatSignalValue(
                value.value
            );

        }

        if (
            value.probability !==
            undefined
        ) {

            return formatSignalValue(
                value.probability
            );

        }

        return "Available";

    }

    return String(value);
}


/* =========================================================
   SIGNAL BAR
========================================================= */

function signalToPercentage(
    value
) {

    if (
        value === null ||
        value === undefined
    ) {

        return 0;

    }

    let number;

    if (
        typeof value ===
        "object"
    ) {

        number =
            Number(
                value.score ??
                value.value ??
                value.probability ??
                0
            );

    }

    else {

        number =
            Number(value);

    }

    if (
        !Number.isFinite(number)
    ) {

        return 0;

    }

    if (
        number >= 0 &&
        number <= 1
    ) {

        number *= 100;

    }

    return Math.max(
        0,
        Math.min(
            100,
            number
        )
    );

}


/* =========================================================
   MATCH STATE
========================================================= */

function getMatchState(match) {

    const statusCode =
        String(
            match.fixture?.status?.short ||
            "NS"
        ).toUpperCase();

    const homeScore =
        match.goals?.home ??
        0;

    const awayScore =
        match.goals?.away ??
        0;

    const elapsed =
        match.fixture?.status?.elapsed ??
        null;

    if (
        FINISHED_STATUSES.includes(
            statusCode
        )
    ) {

        let label = "FT";

        if (
            statusCode === "AET"
        ) {

            label = "AET";

        }

        else if (
            statusCode === "PEN"
        ) {

            label = "PEN";

        }

        else if (
            statusCode === "AWD"
        ) {

            label = "AWARDED";

        }

        else if (
            statusCode === "WO"
        ) {

            label = "WALKOVER";

        }

        return {

            type:
                "finished",

            statusCode,

            label,

            homeScore,

            awayScore

        };

    }

    if (
        LIVE_STATUSES.includes(
            statusCode
        )
    ) {

        return {

            type:
                "live",

            statusCode,

            elapsed,

            homeScore,

            awayScore

        };

    }

    if (
        POSTPONED_STATUSES.includes(
            statusCode
        )
    ) {

        return {

            type:
                "postponed",

            statusCode

        };

    }

    if (
        CANCELLED_STATUSES.includes(
            statusCode
        )
    ) {

        return {

            type:
                "cancelled",

            statusCode

        };

    }

    if (
        SUSPENDED_STATUSES.includes(
            statusCode
        )
    ) {

        return {

            type:
                "suspended",

            statusCode,

            label:
                statusCode === "INT"
                ?
                "INTERRUPTED"
                :
                "SUSPENDED",

            homeScore,

            awayScore

        };

    }

    return {

        type:
            "upcoming",

        statusCode

    };

}


/* =========================================================
   FORMAT KICKOFF WAT
========================================================= */

function formatKickoffWAT(
    isoDate,
    timestamp
) {

    try {

        let dateObject;

        if (timestamp) {

            dateObject =
                new Date(
                    Number(timestamp) *
                    1000
                );

        }

        else if (isoDate) {

            dateObject =
                new Date(
                    isoDate
                );

        }

        else {

            return "Time unavailable";

        }

        return dateObject.toLocaleTimeString(
            "en-NG",
            {
                timeZone:
                    "Africa/Lagos",

                hour:
                    "2-digit",

                minute:
                    "2-digit",

                hour12:
                    false

            }
        ) + " WAT";

    }

    catch (
        error
    ) {

        return "Time unavailable";

    }

}


/* =========================================================
   NORMALIZE LEAGUE
========================================================= */

function normalizeLeagueName(
    name
) {

    return String(
        name || ""
    )
    .normalize("NFD")
    .replace(
        /[\u0300-\u036f]/g,
        ""
    )
    .toLowerCase()
    .replace(
        /[^a-z0-9]+/g,
        " "
    )
    .trim();

}


/* =========================================================
   TEAM IDENTITY
========================================================= */

function createIdentity(
    name
) {

    return String(
        name || ""
    )
    .trim()
    .normalize("NFD")
    .replace(
        /[\u0300-\u036f]/g,
        ""
    )
    .replace(
        /[’']/g,
        ""
    )
    .replace(
        /&/g,
        " AND "
    )
    .toUpperCase()
    .replace(
        /[^A-Z0-9]+/g,
        "_"
    )
    .replace(
        /^_+|_+$/g,
        ""
    ) || "";

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(
    value
) {

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


/* =========================================================
   ESCAPE JAVASCRIPT
========================================================= */

function escapeJs(
    value
) {

    return String(
        value ?? ""
    )
    .replace(
        /\\/g,
        "\\\\"
    )
    .replace(
        /'/g,
        "\\'"
    )
    .replace(
        /\r/g,
        "\\r"
    )
    .replace(
        /\n/g,
        "\\n"
    );

}
