<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>TomsonStakes Global Football</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #111827;
    color: #fff;
}

.container {
    max-width: 1100px;
    margin: auto;
    padding: 20px;
}

/* =========================================================
   HEADER
========================================================= */

.header {
    text-align: center;
    padding: 25px 10px;
}

.header h1 {
    margin: 0;
    font-size: 32px;
}

.subtitle {
    color: #9ca3af;
    margin-top: 8px;
}

/* =========================================================
   CONTROL
========================================================= */

.control-box {
    background: #1f2937;
    padding: 20px;
    border-radius: 14px;
    text-align: center;
    margin-bottom: 20px;
}

input[type="date"] {
    width: 100%;
    max-width: 400px;
    padding: 14px;
    border: none;
    border-radius: 8px;
    font-size: 16px;
}

button {
    border: none;
    border-radius: 8px;
    padding: 13px 18px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
}

.main-button {
    background: #16a34a;
    color: white;
    width: 100%;
    max-width: 400px;
    margin-top: 12px;
}

.analyze-button {
    background: #2563eb;
    color: white;
    width: 100%;
    margin-top: 12px;
}

button:disabled {
    opacity: .6;
    cursor: wait;
}

/* =========================================================
   NOTICE / STATUS
========================================================= */

.notice {
    background: #1f2937;
    padding: 18px;
    border-radius: 12px;
    margin-top: 15px;
}

.status {
    padding: 12px;
    border-radius: 8px;
    margin-top: 12px;
    font-weight: bold;
}

.status-ready {
    background: #dcfce7;
    color: #166534;
}

.status-warning {
    background: #fef3c7;
    color: #92400e;
}

.status-error {
    background: #fee2e2;
    color: #991b1b;
}

/* =========================================================
   COUNTRY SECTION
========================================================= */

.country-section {
    margin-top: 28px;
}

.country-header {
    background: #0f172a;
    border-left: 5px solid #16a34a;
    padding: 15px 18px;
    border-radius: 10px;
    margin-bottom: 12px;
}

.country-title {
    font-size: 22px;
    font-weight: bold;
}

.country-count {
    color: #9ca3af;
    font-size: 13px;
    margin-top: 4px;
}

/* =========================================================
   LEAGUE SECTION
========================================================= */

.league-section {
    background: #1f2937;
    border-radius: 12px;
    margin-bottom: 18px;
    overflow: hidden;
}

.league-header {
    background: #374151;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
}

.league-logo {
    width: 35px;
    height: 35px;
    object-fit: contain;
    background: white;
    border-radius: 50%;
    padding: 3px;
}

.league-name {
    font-size: 18px;
    font-weight: bold;
}

.league-meta {
    color: #9ca3af;
    font-size: 12px;
    margin-top: 3px;
}

/* =========================================================
   FIXTURE
========================================================= */

.fixture {
    background: #fff;
    color: #111827;
    border-radius: 0;
    padding: 16px;
    border-top: 1px solid #e5e7eb;
}

.fixture:first-of-type {
    border-top: none;
}

.fixture-title {
    font-size: 16px;
    font-weight: bold;
    line-height: 1.5;
}

.fixture-meta {
    color: #6b7280;
    font-size: 13px;
    margin-top: 5px;
}

/* =========================================================
   TEAM ROW
========================================================= */

.teams-row {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 10px;
    margin-bottom: 8px;
}

.team {
    font-weight: bold;
}

.team.home {
    text-align: right;
}

.team.away {
    text-align: left;
}

.vs {
    color: #6b7280;
    font-weight: bold;
}

/* =========================================================
   ANALYSIS
========================================================= */

.analysis {
    margin-top: 12px;
    background: #f3f4f6;
    color: #111827;
    border-radius: 10px;
    padding: 12px;
}

.hidden {
    display: none;
}

/* =========================================================
   FINAL PREDICTION
========================================================= */

.prediction-result {
    margin-top: 15px;
    background: #111827;
    color: white;
    border-radius: 14px;
    padding: 25px 20px;
    text-align: center;
    border: 2px solid #2563eb;
}

.prediction-label {
    font-size: 13px;
    font-weight: bold;
    color: #9ca3af;
    letter-spacing: 2px;
}

.prediction-value {
    font-size: 30px;
    font-weight: bold;
    margin-top: 8px;
    color: #22c55e;
}

.probability-label {
    font-size: 13px;
    font-weight: bold;
    color: #9ca3af;
    letter-spacing: 2px;
    margin-top: 20px;
}

.probability-value {
    font-size: 26px;
    font-weight: bold;
    margin-top: 6px;
}

/* =========================================================
   MOBILE
========================================================= */

@media(max-width:600px) {

    .container {
        padding: 12px;
    }

    .header h1 {
        font-size: 27px;
    }

    .country-title {
        font-size: 19px;
    }

    .league-name {
        font-size: 16px;
    }

    .teams-row {
        grid-template-columns: 1fr;
        text-align: center;
        gap: 4px;
    }

    .team.home,
    .team.away {
        text-align: center;
    }

    .vs {
        font-size: 12px;
    }

}

</style>

</head>

<body>

<div class="container">

    <!-- =====================================================
         HEADER
    ====================================================== -->

    <div class="header">

        <h1>🔥 TOMSONSTAKES</h1>

        <div class="subtitle">
            GLOBAL FOOTBALL PREDICTION ENGINE
        </div>

    </div>


    <!-- =====================================================
         DATE SEARCH
    ====================================================== -->

    <div class="control-box">

        <p>
            Select a date to scan available football fixtures.
        </p>

        <input
            type="date"
            id="matchDate"
        >

        <br>

        <button
            class="main-button"
            id="scanButton"
            onclick="analyzeMatches()"
        >
            ANALYZE MATCHES
        </button>

    </div>


    <!-- =====================================================
         RESULTS
    ====================================================== -->

    <div id="results"></div>

</div>


<script>

/* =========================================================
   LEAGUE PRIORITY
========================================================= */

/*
 * Lower number = higher priority.
 *
 * This determines the order in which leagues appear.
 *
 * You can add more leagues later.
 */

const LEAGUE_PRIORITY = {

    /* -----------------------------------------------------
       ENGLAND
    ----------------------------------------------------- */

    "Premier League": 1,

    "Championship": 10,

    "League One": 20,

    "League Two": 21,


    /* -----------------------------------------------------
       SPAIN
    ----------------------------------------------------- */

    "La Liga": 2,

    "Segunda Division": 11,


    /* -----------------------------------------------------
       ITALY
    ----------------------------------------------------- */

    "Serie A": 3,

    "Serie B": 12,


    /* -----------------------------------------------------
       GERMANY
    ----------------------------------------------------- */

    "Bundesliga": 4,

    "2. Bundesliga": 13,


    /* -----------------------------------------------------
       FRANCE
    ----------------------------------------------------- */

    "Ligue 1": 5,

    "Ligue 2": 14,


    /* -----------------------------------------------------
       NETHERLANDS
    ----------------------------------------------------- */

    "Eredivisie": 6,


    /* -----------------------------------------------------
       PORTUGAL
    ----------------------------------------------------- */

    "Primeira Liga": 7,


    /* -----------------------------------------------------
       BELGIUM
    ----------------------------------------------------- */

    "Jupiler Pro League": 8,


    /* -----------------------------------------------------
       TURKEY
    ----------------------------------------------------- */

    "Super Lig": 9,


    /* -----------------------------------------------------
       SCOTLAND
    ----------------------------------------------------- */

    "Premiership": 15,


    /* -----------------------------------------------------
       OTHER IMPORTANT COMPETITIONS
    ----------------------------------------------------- */

    "UEFA Champions League": 30,

    "UEFA Europa League": 31,

    "UEFA Europa Conference League": 32,

    "World Cup": 40,

    "UEFA Nations League": 41

};


/* =========================================================
   COUNTRY PRIORITY
========================================================= */

const COUNTRY_PRIORITY = {

    "England": 1,

    "Spain": 2,

    "Italy": 3,

    "Germany": 4,

    "France": 5,

    "Netherlands": 6,

    "Portugal": 7,

    "Belgium": 8,

    "Turkey": 9,

    "Scotland": 10,

    "Brazil": 20,

    "Argentina": 21,

    "Mexico": 22,

    "USA": 23,

    "Saudi-Arabia": 24,

    "Saudi Arabia": 24,

    "Japan": 25,

    "South Korea": 26,

    "Australia": 27,

    "Nigeria": 28

};


/* =========================================================
   COUNTRY FLAGS
========================================================= */

const COUNTRY_FLAGS = {

    "England": "🏴",

    "Spain": "🇪🇸",

    "Italy": "🇮🇹",

    "Germany": "🇩🇪",

    "France": "🇫🇷",

    "Netherlands": "🇳🇱",

    "Portugal": "🇵🇹",

    "Belgium": "🇧🇪",

    "Turkey": "🇹🇷",

    "Scotland": "🏴",

    "Brazil": "🇧🇷",

    "Argentina": "🇦🇷",

    "Mexico": "🇲🇽",

    "USA": "🇺🇸",

    "Saudi Arabia": "🇸🇦",

    "Saudi-Arabia": "🇸🇦",

    "Japan": "🇯🇵",

    "South Korea": "🇰🇷",

    "Australia": "🇦🇺",

    "Nigeria": "🇳🇬"

};


/* =========================================================
   GLOBAL FIXTURE SEARCH
========================================================= */

async function analyzeMatches() {

    const date =
        document.getElementById("matchDate").value;

    const results =
        document.getElementById("results");

    const scanButton =
        document.getElementById("scanButton");


    if (!date) {

        results.innerHTML = `

            <div class="notice status-warning">

                ⚠️ Please select a match date.

            </div>

        `;

        return;
    }


    scanButton.disabled = true;


    results.innerHTML = `

        <div class="notice">

            <h2>🔥 TOMSONSTAKES</h2>

            <p>

                🔎 Scanning global football fixtures for

                <strong>
                    ${escapeHtml(date)}
                </strong>

            </p>

            <p>
                ⏳ Connecting to live football data...
            </p>

        </div>

    `;


    try {

        const response =
            await fetch(
                `/api/fixtures?date=${encodeURIComponent(date)}`
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.message ||
                data.error ||
                "Unable to retrieve football fixtures."
            );

        }


        if (
            !data.response ||
            !Array.isArray(data.response) ||
            data.response.length === 0
        ) {

            results.innerHTML = `

                <div class="notice status-warning">

                    <h2>🔥 TOMSONSTAKES</h2>

                    <p>

                        📅 Date:

                        <strong>
                            ${escapeHtml(date)}
                        </strong>

                    </p>

                    <p>
                        ⚠️ No fixtures were returned.
                    </p>

                </div>

            `;

            scanButton.disabled = false;

            return;
        }


        /*
         * GROUP FIXTURES
         */

        const grouped =
            groupFixturesByCountryAndLeague(
                data.response
            );


        /*
         * BUILD DISPLAY
         */

        let html = `

            <div class="notice">

                <h2>
                    🔥 TOMSONSTAKES GLOBAL FIXTURES
                </h2>

                <p>

                    📅 Date:

                    <strong>
                        ${escapeHtml(date)}
                    </strong>

                </p>

                <p>

                    🌍 Fixtures found:

                    <strong>
                        ${data.response.length}
                    </strong>

                </p>

            </div>

        `;


        let fixtureIndex = 0;


        /*
         * COUNTRY LOOP
         */

        grouped.forEach(
            countryGroup => {

                html += buildCountryHeader(
                    countryGroup
                );


                /*
                 * LEAGUE LOOP
                 */

                countryGroup.leagues.forEach(
                    leagueGroup => {

                        html += buildLeagueHeader(
                            leagueGroup
                        );


                        /*
                         * FIXTURE LOOP
                         */

                        leagueGroup.fixtures.forEach(
                            match => {

                                html +=
                                    buildFixtureCard(
                                        match,
                                        fixtureIndex
                                    );

                                fixtureIndex++;

                            }
                        );


                        html += `

                            </div>

                        `;

                    }
                );


                html += `

                    </div>

                `;

            }
        );


        results.innerHTML = html;


    } catch (error) {

        console.error(error);


        results.innerHTML = `

            <div class="notice status-error">

                <h2>🔥 TOMSONSTAKES</h2>

                <p>
                    ❌ Unable to load football fixtures.
                </p>

                <p>

                    <strong>
                        Error:
                    </strong>

                    ${escapeHtml(
                        error.message
                    )}

                </p>

            </div>

        `;

    } finally {

        scanButton.disabled = false;

    }

}


/* =========================================================
   GROUP FIXTURES
========================================================= */

function groupFixturesByCountryAndLeague(
    fixtures
) {

    const countries = {};


    fixtures.forEach(
        match => {

            const country =
                match.league?.country ||
                "Other";


            const league =
                match.league?.name ||
                "Other Competitions";


            if (!countries[country]) {

                countries[country] = {};

            }


            if (!countries[country][league]) {

                countries[country][league] = {

                    name: league,

                    country: country,

                    logo:
                        match.league?.logo ||
                        "",

                    leagueId:
                        match.league?.id ||
                        null,

                    fixtures: []

                };

            }


            countries[country][league].fixtures.push(
                match
            );

        }
    );


    /*
     * Convert object into array
     */

    const countryArray =
        Object.entries(countries)
            .map(
                ([country, leagues]) => {

                    const leagueArray =
                        Object.values(leagues);


                    /*
                     * SORT LEAGUES
                     *
                     * Known major leagues first.
                     *
                     * Unknown leagues go afterward.
                     */

                    leagueArray.sort(
                        (a, b) => {

                            const priorityA =
                                getLeaguePriority(
                                    a.name
                                );

                            const priorityB =
                                getLeaguePriority(
                                    b.name
                                );


                            if (
                                priorityA !==
                                priorityB
                            ) {

                                return (
                                    priorityA -
                                    priorityB
                                );

                            }


                            return a.name.localeCompare(
                                b.name
                            );

                        }
                    );


                    /*
                     * SORT FIXTURES BY KICKOFF
                     */

                    leagueArray.forEach(
                        league => {

                            league.fixtures.sort(
                                (
                                    a,
                                    b
                                ) => {

                                    const dateA =
                                        new Date(
                                            a.fixture?.date ||
                                            0
                                        ).getTime();


                                    const dateB =
                                        new Date(
                                            b.fixture?.date ||
                                            0
                                        ).getTime();


                                    return (
                                        dateA -
                                        dateB
                                    );

                                }
                            );

                        }
                    );


                    return {

                        country,

                        leagues:
                            leagueArray,

                        fixtureCount:
                            leagueArray.reduce(
                                (
                                    total,
                                    league
                                ) =>
                                    total +
                                    league.fixtures.length,
                                0
                            )

                    };

                }
            );


    /*
     * SORT COUNTRIES
     *
     * England first,
     * Spain second,
     * Italy third,
     * Germany fourth,
     * etc.
     */

    countryArray.sort(
        (a, b) => {

            const priorityA =
                getCountryPriority(
                    a.country
                );

            const priorityB =
                getCountryPriority(
                    b.country
                );


            if (
                priorityA !==
                priorityB
            ) {

                return (
                    priorityA -
                    priorityB
                );

            }


            return a.country.localeCompare(
                b.country
            );

        }
    );


    return countryArray;

}


/* =========================================================
   LEAGUE PRIORITY
========================================================= */

function getLeaguePriority(
    leagueName
) {

    if (
        LEAGUE_PRIORITY[
            leagueName
        ] !== undefined
    ) {

        return LEAGUE_PRIORITY[
            leagueName
        ];

    }


    /*
     * Try partial matching.
     */

    const name =
        String(
            leagueName || ""
        ).toLowerCase();


    if (
        name.includes(
            "premier league"
        )
    ) {
        return 50;
    }


    if (
        name.includes(
            "champions league"
        )
    ) {
        return 60;
    }


    if (
        name.includes(
            "europa league"
        )
    ) {
        return 61;
    }


    /*
     * Unknown leagues.
     */

    return 1000;

}


/* =========================================================
   COUNTRY PRIORITY
========================================================= */

function getCountryPriority(
    country
) {

    if (
        COUNTRY_PRIORITY[
            country
        ] !== undefined
    ) {

        return COUNTRY_PRIORITY[
            country
        ];

    }


    return 1000;

}


/* =========================================================
   COUNTRY HEADER
========================================================= */

function buildCountryHeader(
    countryGroup
) {

    const flag =
        COUNTRY_FLAGS[
            countryGroup.country
        ] ||
        "🌍";


    return `

        <div class="country-section">

            <div class="country-header">

                <div class="country-title">

                    ${flag}

                    ${escapeHtml(
                        countryGroup.country
                    )}

                </div>

                <div class="country-count">

                    ${countryGroup.fixtureCount}
                    fixture${
                        countryGroup.fixtureCount === 1
                            ? ""
                            : "s"
                    }

                </div>

            </div>

    `;

}


/* =========================================================
   LEAGUE HEADER
========================================================= */

function buildLeagueHeader(
    leagueGroup
) {

    return `

        <div class="league-section">

            <div class="league-header">

                ${
                    leagueGroup.logo
                    ? `

                        <img
                            class="league-logo"
                            src="${escapeHtml(
                                leagueGroup.logo
                            )}"
                            alt=""
                        >

                    `
                    : ""
                }

                <div>

                    <div class="league-name">

                        ${escapeHtml(
                            leagueGroup.name
                        )}

                    </div>

                    <div class="league-meta">

                        ${
                            leagueGroup.fixtures.length
                        }

                        fixture${
                            leagueGroup.fixtures.length === 1
                                ? ""
                                : "s"
                        }

                    </div>

                </div>

            </div>

    `;

}


/* =========================================================
   FIXTURE CARD
========================================================= */

function buildFixtureCard(
    match,
    index
) {

    const home =
        match.teams?.home?.name ||
        "Home Team";


    const away =
        match.teams?.away?.name ||
        "Away Team";


    const homeIdentity =
        createIdentity(home);


    const awayIdentity =
        createIdentity(away);


    const identitiesValid =
        Boolean(homeIdentity) &&
        Boolean(awayIdentity) &&
        homeIdentity !== awayIdentity;


    const kickoffUTC =
        match.fixture?.date;


    let kickoffWAT =
        "Time unavailable";


    if (kickoffUTC) {

        try {

            const dateObject =
                new Date(
                    kickoffUTC
                );


            kickoffWAT =
                dateObject.toLocaleTimeString(
                    "en-NG",
                    {
                        timeZone:
                            "Africa/Lagos",

                        hour:
                            "2-digit",

                        minute:
                            "2-digit",

                        hour12:
                            false
                    }
                ) + " WAT";

        } catch (e) {

            kickoffWAT =
                "Time unavailable";

        }

    }


    const matchDate =
        kickoffUTC
            ? kickoffUTC.substring(
                0,
                10
            )
            : document.getElementById(
                "matchDate"
              ).value;


    return `

        <div class="fixture">

            <div class="teams-row">

                <div class="team home">

                    ${escapeHtml(home)}

                </div>

                <div class="vs">

                    VS

                </div>

                <div class="team away">

                    ${escapeHtml(away)}

                </div>

            </div>


            <div class="fixture-meta">

                🕐

                <strong>
                    ${escapeHtml(
                        kickoffWAT
                    )}
                </strong>

            </div>


            ${
                identitiesValid

                ? `

                    <button
                        class="analyze-button"
                        id="analyze-button-${index}"
                        onclick="runMatchAnalysis(
                            ${index},
                            '${escapeJs(home)}',
                            '${escapeJs(away)}',
                            '${escapeJs(homeIdentity)}',
                            '${escapeJs(awayIdentity)}',
                            '${escapeJs(matchDate)}'
                        )"
                    >

                        🔍 ANALYZE MATCH

                    </button>

                `

                : `

                    <div class="status status-error">

                        ❌ Unable to create valid
                        team identities.

                    </div>

                `
            }


            <div
                id="analysis-${index}"
                class="analysis hidden"
            ></div>

        </div>

    `;

}


/* =========================================================
   MATCH ANALYSIS
========================================================= */

async function runMatchAnalysis(
    index,
    home,
    away,
    homeIdentity,
    awayIdentity,
    date
) {

    const box =
        document.getElementById(
            `analysis-${index}`
        );


    const button =
        document.getElementById(
            `analyze-button-${index}`
        );


    box.classList.remove(
        "hidden"
    );


    button.disabled = true;


    box.innerHTML = `

        <div class="status status-warning">

            🔎 Analyzing

            <strong>
                ${escapeHtml(home)}
            </strong>

            vs

            <strong>
                ${escapeHtml(away)}
            </strong>

            ...

        </div>

    `;


    const MATCH = {

        home:
            home,

        homeIdentity:
            homeIdentity,

        away:
            away,

        awayIdentity:
            awayIdentity,

        date:
            date

    };


    try {

        /* =================================================
           STEP 1 — WEB DATA
        ================================================= */

        const webUrl =
            `/api/web-data` +

            `?home=${encodeURIComponent(
                home
            )}` +

            `&homeIdentity=${encodeURIComponent(
                homeIdentity
            )}` +

            `&away=${encodeURIComponent(
                away
            )}` +

            `&awayIdentity=${encodeURIComponent(
                awayIdentity
            )}` +

            `&date=${encodeURIComponent(
                date
            )}`;


        const webResponse =
            await fetch(
                webUrl
            );


        const webData =
            await webResponse.json();


        if (!webResponse.ok) {

            throw new Error(
                webData.error ||
                webData.message ||
                "Web data request failed."
            );

        }


        /* =================================================
           STEP 2 — NORMALIZE
        ================================================= */

        box.innerHTML = `

            <div class="status status-warning">

                ⚙️ Preparing prediction...

            </div>

        `;


        const normalizeResponse =
            await fetch(
                "/api/normalize-web",
                {

                    method:
                        "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            ...webData,

                            match:
                                MATCH

                        })

                }
            );


        const normalized =
            await normalizeResponse.json();


        if (!normalizeResponse.ok) {

            throw new Error(
                normalized.error ||
                normalized.message ||
                "Normalization failed."
            );

        }


        /* =================================================
           STEP 3 — PREDICTION
        ================================================= */

        box.innerHTML = `

            <div class="status status-warning">

                🧠 Calculating prediction...

            </div>

        `;


        const predictionResponse =
            await fetch(
                "/api/predict",
                {

                    method:
                        "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            match:
                                MATCH,

                            normalized:
                                normalized

                        })

                }
            );


        const prediction =
            await predictionResponse.json();


        if (!predictionResponse.ok) {

            throw new Error(
                prediction.error ||
                prediction.message ||
                "Prediction failed."
            );

        }


        /* =================================================
           ONLY SHOW FINAL PREDICTION
        ================================================= */

        box.innerHTML =
            buildAnalysisHTML(
                prediction
            );


        button.textContent =
            "✓ ANALYSIS COMPLETE";


        button.disabled =
            false;


    } catch (error) {

        console.error(
            "MATCH ANALYSIS ERROR:",
            error
        );


        box.innerHTML = `

            <div class="status status-error">

                ❌ Analysis failed.

                <br><br>

                <strong>
                    ${escapeHtml(
                        error.message
                    )}
                </strong>

            </div>

        `;


        button.disabled =
            false;

    }

}


/* =========================================================
   FINAL ANALYSIS DISPLAY
========================================================= */

function buildAnalysisHTML(
    prediction
) {

    if (
        !prediction ||
        !prediction.success ||
        !prediction.prediction
    ) {

        return `

            <div class="status status-warning">

                ⚠️ No sufficiently supported
                prediction was produced.

            </div>

        `;

    }


    const probability =
        Number(
            prediction.probability
        );


    return `

        <div class="prediction-result">

            <div class="prediction-label">

                PREDICTION

            </div>


            <div class="prediction-value">

                ${escapeHtml(
                    prediction.prediction
                )}

            </div>


            <div class="probability-label">

                PROBABILITY

            </div>


            <div class="probability-value">

                ${
                    Number.isFinite(
                        probability
                    )
                    ? probability.toFixed(0) + "%"
                    : "—"
                }

            </div>

        </div>

    `;

}


/* =========================================================
   TEAM IDENTITY
========================================================= */

function createIdentity(
    name
) {

    return String(
        name || ""
    )
    .trim()
    .normalize("NFD")
    .replace(
        /[\u0300-\u036f]/g,
        ""
    )
    .replace(
        /[’']/g,
        ""
    )
    .replace(
        /&/g,
        " AND "
    )
    .toUpperCase()
    .replace(
        /[^A-Z0-9]+/g,
        "_"
    )
    .replace(
        /^_+|_+$/g,
        "");

}


/* =========================================================
   SECURITY
========================================================= */

function escapeHtml(
    value
) {

    return String(
        value
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


function escapeJs(
    value
) {

    return String(
        value
    )
    .replace(
        /\\/g,
        "\\\\"
    )
    .replace(
        /'/g,
        "\\'"
    )
    .replace(
        /\r/g,
        "\\r"
    )
    .replace(
        /\n/g,
        "\\n"
    );

}

</script>
