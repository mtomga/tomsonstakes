<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>TomsonStakes</title>

<style>

* {
    box-sizing: border-box;
}

:root {
    --bg: #050b14;
    --panel: #0b1726;
    --panel2: #102238;
    --border: #203b56;
    --green: #22c55e;
    --green-dark: #15803d;
    --gold: #f59e0b;
    --text: #f8fafc;
    --muted: #94a3b8;
}

body {

    margin: 0;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background:
        radial-gradient(
            circle at 20% 0%,
            #123b2a 0,
            transparent 28%
        ),
        radial-gradient(
            circle at 100% 10%,
            #17395c 0,
            transparent 30%
        ),
        #050b14;

    color: var(--text);

    min-height: 100vh;
}


/* =====================================================
   CONTAINER
===================================================== */

.container {

    width: 100%;

    max-width: 1100px;

    margin: auto;

    padding:
        16px;

}


/* =====================================================
   HERO
===================================================== */

.hero {

    position: relative;

    overflow: hidden;

    border:
        1px solid
        var(--border);

    border-radius: 24px;

    padding:
        30px 24px;

    margin-bottom: 16px;

    background:
        linear-gradient(
            135deg,
            #0d2c21,
            #0a1727 55%,
            #081321
        );

    box-shadow:
        0 20px 70px
        rgba(0,0,0,.3);

}


.hero:after {

    content: "";

    position: absolute;

    width: 180px;

    height: 180px;

    border-radius: 50%;

    background:
        rgba(34,197,94,.10);

    right: -50px;

    top: -70px;

}


.brand {

    display:
        flex;

    align-items:
        center;

    gap: 14px;

    position: relative;

    z-index: 2;

}


.logo {

    width: 60px;

    height: 60px;

    display:
        grid;

    place-items:
        center;

    border-radius:
        18px;

    background:
        linear-gradient(
            135deg,
            #22c55e,
            #15803d
        );

    font-size: 28px;

    box-shadow:
        0 10px 30px
        rgba(34,197,94,.25);

}


.hero h1 {

    margin: 0;

    font-size: 32px;

    font-weight: 950;

    letter-spacing:
        -1px;

}


.hero p {

    margin:
        7px 0 0;

    color:
        var(--muted);

    font-size:
        13px;

}


/* =====================================================
   DAILY SLIP CARD
===================================================== */

.slip-card {

    background:
        linear-gradient(
            135deg,
            #123d2a,
            #0b261b
        );

    border:
        1px solid
        rgba(34,197,94,.35);

    border-radius:
        18px;

    padding:
        20px;

    margin-bottom:
        18px;

}


.slip-label {

    color:
        #86efac;

    font-size:
        10px;

    font-weight:
        900;

    letter-spacing:
        1.3px;

    text-transform:
        uppercase;

}


.slip-code {

    font-size:
        27px;

    font-weight:
        950;

    margin-top:
        5px;

    letter-spacing:
        1px;

}


.slip-meta {

    display:
        flex;

    flex-wrap:
        wrap;

    gap:
        8px;

    margin-top:
        13px;

}


.meta {

    padding:
        7px 10px;

    border-radius:
        8px;

    background:
        rgba(0,0,0,.2);

    color:
        #d1fae5;

    font-size:
        10px;

    font-weight:
        800;

}


.copy-button {

    margin-top:
        13px;

    background:
        #22c55e;

    color:
        white;

    border:
        none;

    padding:
        10px 14px;

    border-radius:
        9px;

    font-weight:
        900;

    cursor:
        pointer;

}


/* =====================================================
   SECTION
===================================================== */

.section-title {

    display:
        flex;

    justify-content:
        space-between;

    align-items:
        center;

    margin:
        20px 0 10px;

}


.section-title h2 {

    margin:
        0;

    font-size:
        18px;

    font-weight:
        950;

}


.date-label {

    color:
        var(--muted);

    font-size:
        10px;

}


/* =====================================================
   LEAGUE
===================================================== */

.league {

    background:
        rgba(11,23,38,.92);

    border:
        1px solid
        var(--border);

    border-radius:
        16px;

    overflow:
        hidden;

    margin-bottom:
        15px;

}


.league-header {

    display:
        flex;

    justify-content:
        space-between;

    align-items:
        center;

    padding:
        14px 15px;

    background:
        linear-gradient(
            90deg,
            #102b44,
            #0b1827
        );

    border-left:
        5px solid
        var(--green);

}


.league-name {

    font-size:
        14px;

    font-weight:
        950;

}


.league-country {

    margin-top:
        3px;

    color:
        var(--muted);

    font-size:
        9px;

}


.league-count {

    background:
        rgba(34,197,94,.13);

    color:
        #86efac;

    border:
        1px solid
        rgba(34,197,94,.25);

    border-radius:
        20px;

    padding:
        5px 8px;

    font-size:
        8px;

    font-weight:
        900;

}


/* =====================================================
   PREDICTION
===================================================== */

.prediction {

    margin:
        9px;

    padding:
        15px;

    border-radius:
        13px;

    background:
        linear-gradient(
            135deg,
            #ffffff,
            #f8fafc
        );

    color:
        #111827;

    box-shadow:
        0 5px 18px
        rgba(0,0,0,.13);

}


.pred-top {

    display:
        flex;

    justify-content:
        space-between;

    gap:
        10px;

    color:
        #64748b;

    font-size:
        9px;

    font-weight:
        800;

}


.pred-teams {

    display:
        grid;

    grid-template-columns:
        1fr 40px 1fr;

    gap:
        8px;

    align-items:
        center;

    margin-top:
        12px;

}


.team {

    font-size:
        14px;

    font-weight:
        950;

}


.away {

    text-align:
        right;

}


.vs {

    text-align:
        center;

    color:
        #64748b;

    font-weight:
        950;

}


/* =====================================================
   PICK
===================================================== */

.pick-box {

    margin-top:
        13px;

    padding:
        12px;

    border-radius:
        10px;

    background:
        #ecfdf5;

    border:
        1px solid
        #bbf7d0;

}


.pick-market {

    color:
        #15803d;

    font-size:
        9px;

    font-weight:
        900;

    text-transform:
        uppercase;

}


.pick-selection {

    margin-top:
        3px;

    color:
        #14532d;

    font-size:
        18px;

    font-weight:
        950;

}


.confidence {

    display:
        inline-block;

    margin-top:
        7px;

    padding:
        5px 7px;

    border-radius:
        6px;

    background:
        #dcfce7;

    color:
        #166534;

    font-size:
        9px;

    font-weight:
        900;

}


/* =====================================================
   ANALYSIS
===================================================== */

.analysis {

    margin-top:
        11px;

    color:
        #475569;

    font-size:
        11px;

    line-height:
        1.6;

}


.empty {

    text-align:
        center;

    padding:
        45px 15px;

    color:
        var(--muted);

    font-size:
        12px;

}


/* =====================================================
   FOOTER
===================================================== */

.footer {

    text-align:
        center;

    padding:
        30px 10px;

    color:
        #64748b;

    font-size:
        10px;

}


@media(max-width:600px) {

    .hero h1 {
        font-size: 25px;
    }

    .pred-teams {
        grid-template-columns:
            1fr 32px 1fr;
    }

    .team {
        font-size: 12px;
    }

    .slip-code {
        font-size: 23px;
    }

}

</style>

</head>


<body>

<div class="container">


    <!-- HERO -->

    <div class="hero">

        <div class="brand">

            <div class="logo">
                ⚽
            </div>

            <div>

                <h1>
                    TOMSONSTAKES
                </h1>

                <p>
                    Football predictions •
                    analysis • daily selections
                </p>

            </div>

        </div>

    </div>


    <!-- DAILY SLIP -->

    <div
        id="dailySlip"
        class="slip-card"
        style="display:none"
    >

        <div class="slip-label">
            🎟️ TODAY'S BOOKING CODE
        </div>

        <div
            id="bookingCode"
            class="slip-code"
        >
            —
        </div>

        <div
            id="slipMeta"
            class="slip-meta"
        ></div>

        <button
            id="copyButton"
            class="copy-button"
        >
            📋 COPY BOOKING CODE
        </button>

    </div>


    <!-- TITLE -->

    <div class="section-title">

        <h2>
            🔥 TODAY'S PREDICTIONS
        </h2>

        <div
            id="predictionDate"
            class="date-label"
        >
            Loading...
        </div>

    </div>


    <div id="predictions">

        <div class="empty">
            Loading today's predictions...
        </div>

    </div>


    <div class="footer">

        TOMSONSTAKES • Football Prediction Center

    </div>

</div>


<script>

/* =====================================================
   STATE
===================================================== */

let currentBookingCode = "";


/* =====================================================
   LOAD
===================================================== */

document.addEventListener(
    "DOMContentLoaded",
    loadPage
);


async function loadPage() {

    const today =
        getToday();


    document.getElementById(
        "predictionDate"
    ).textContent =
        formatDate(today);


    try {

        const response =
            await fetch(
                "/api/predictions?date=" +
                encodeURIComponent(today)
            );


        const data =
            await readJson(
                response
            );


        if (!response.ok) {

            throw new Error(
                data.error ||
                data.message ||
                "Unable to load predictions."
            );

        }


        const predictions =
            Array.isArray(
                data.predictions
            )
            ?
            data.predictions
            :
            [];


        const published =
            predictions.filter(
                function(item) {

                    return normalizeStatus(
                        item.status
                    ) === "PUBLISHED";

                }
            );


        renderPredictions(
            published
        );


        /*
         * Daily slip is currently returned
         * through the same API only if your
         * backend provides it.
         *
         * If not, we attempt the dedicated
         * daily slip endpoint.
         */

        await loadDailySlip(
            today
        );

    }

    catch (error) {

        console.error(error);

        document.getElementById(
            "predictions"
        ).innerHTML = `
            <div class="empty">
                Unable to load today's predictions.
            </div>
        `;

    }

}


/* =====================================================
   DAILY SLIP
===================================================== */

async function loadDailySlip(
    date
) {

    try {

        const response =
            await fetch(
                "/api/daily-slip?date=" +
                encodeURIComponent(date)
            );


        if (!response.ok) {

            return;

        }


        const data =
            await readJson(
                response
            );


        const slip =
            data.slip ||
            data.daily_slip ||
            data.data;


        if (!slip) {

            return;

        }


        if (
            normalizeStatus(
                slip.status
            ) !==
            "PUBLISHED"
        ) {

            return;

        }


        showDailySlip(
            slip
        );

    }

    catch (error) {

        /*
         * Do not break the prediction
         * page if the optional slip
         * endpoint is unavailable.
         */

        console.log(
            "Daily slip unavailable:",
            error
        );

    }

}


/* =====================================================
   SHOW DAILY SLIP
===================================================== */

function showDailySlip(
    slip
) {

    const card =
        document.getElementById(
            "dailySlip"
        );


    const code =
        slip.booking_code ||
        "";


    if (!code) {

        return;
    }


    currentBookingCode =
        code;


    document.getElementById(
        "bookingCode"
    ).textContent =
        code;


    const meta =
        document.getElementById(
            "slipMeta"
        );


    meta.innerHTML = `

        ${
            slip.bookmaker
            ?
            `<span class="meta">
                🏦 ${escapeHtml(
                    slip.bookmaker
                )}
            </span>`
            :
            ""
        }

        <span class="meta">
            📅 ${escapeHtml(
                formatDate(
                    slip.prediction_date
                )
            )}
        </span>

    `;


    card.style.display =
        "block";


    document.getElementById(
        "copyButton"
    ).onclick =
        copyBookingCode;
}


/* =====================================================
   COPY
===================================================== */

function copyBookingCode() {

    if (!currentBookingCode) {

        return;
    }


    /*
     * Clipboard API may not be available
     * everywhere, so provide a fallback.
     */

    if (
        navigator.clipboard &&
        navigator.clipboard.writeText
    ) {

        navigator.clipboard.writeText(
            currentBookingCode
        );

    }


    const button =
        document.getElementById(
            "copyButton"
        );


    const old =
        button.textContent;


    button.textContent =
        "✅ COPIED";


    setTimeout(
        function() {

            button.textContent =
                old;

        },
        1500
    );
}


/* =====================================================
   RENDER PREDICTIONS
===================================================== */

function renderPredictions(
    predictions
) {

    const box =
        document.getElementById(
            "predictions"
        );


    if (!predictions.length) {

        box.innerHTML = `
            <div class="empty">
                No published predictions
                for this date yet.
            </div>
        `;

        return;
    }


    const groups =
        {};


    predictions.forEach(
        function(item) {

            const key =
                item.league ||
                "Other Leagues";


            if (!groups[key]) {

                groups[key] = {

                    name:
                        key,

                    country:
                        item.country ||
                        "",

                    items: []

                };

            }


            groups[key]
                .items
                .push(item);

        }
    );


    const leagues =
        Object.values(
            groups
        );


    leagues.sort(
        function(a, b) {

            return (
                getLeaguePriority(
                    a.name
                ) -
                getLeaguePriority(
                    b.name
                )
            );

        }
    );


    let html = "";


    leagues.forEach(
        function(league) {

            html += `

                <section class="league">

                    <div class="league-header">

                        <div>

                            <div class="league-name">
                                🏆
                                ${escapeHtml(
                                    league.name
                                )}
                            </div>

                            <div class="league-country">
                                ${escapeHtml(
                                    league.country
                                )}
                            </div>

                        </div>

                        <div class="league-count">
                            ${league.items.length}
                            PICKS
                        </div>

                    </div>

            `;


            league.items.forEach(
                function(item) {

                    html +=
                        buildPrediction(
                            item
                        );

                }
            );


            html += `
                </section>
            `;

        }
    );


    box.innerHTML =
        html;
}


/* =====================================================
   BUILD PREDICTION
===================================================== */

function buildPrediction(
    item
) {

    const kickoff =
        formatKickoff(
            item.kickoff
        );


    return `

        <article class="prediction">

            <div class="pred-top">

                <span>
                    #${escapeHtml(
                        String(
                            item.fixture_id ||
                            ""
                        )
                    )}
                </span>

                <span>
                    🕐 ${escapeHtml(
                        kickoff
                    )}
                </span>

            </div>


            <div class="pred-teams">

                <div class="team">
                    ${escapeHtml(
                        item.home_team
                    )}
                </div>

                <div class="vs">
                    VS
                </div>

                <div class="team away">
                    ${escapeHtml(
                        item.away_team
                    )}
                </div>

            </div>


            <div class="pick-box">

                <div class="pick-market">
                    ${escapeHtml(
                        item.market
                    )}
                </div>

                <div class="pick-selection">
                    ${escapeHtml(
                        item.selection
                    )}
                </div>

                <span class="confidence">
                    ⭐ Confidence
                    ${escapeHtml(
                        String(
                            item.confidence
                        )
                    )}/10
                </span>

            </div>


            ${
                item.analysis
                ?
                `
                <div class="analysis">

                    ${escapeHtml(
                        item.analysis
                    )}

                </div>
                `
                :
                ""
            }

        </article>

    `;
}


/* =====================================================
   TODAY
===================================================== */

function getToday() {

    const now =
        new Date();


    return (
        now.getFullYear() +
        "-" +
        String(
            now.getMonth() + 1
        ).padStart(2, "0") +
        "-" +
        String(
            now.getDate()
        ).padStart(2, "0")
    );
}


/* =====================================================
   DATE
===================================================== */

function formatDate(
    date
) {

    if (!date) {

        return "";
    }


    const d =
        new Date(
            date +
            "T00:00:00"
        );


    if (Number.isNaN(
        d.getTime()
    )) {

        return date;
    }


    return d.toLocaleDateString(
        "en-NG",
        {

            day:
                "2-digit",

            month:
                "short",

            year:
                "numeric"

        }
    );
}


/* =====================================================
   KICKOFF
===================================================== */

function formatKickoff(
    value
) {

    if (!value) {

        return "Time unavailable";
    }


    const d =
        new Date(
            value
        );


    if (
        Number.isNaN(
            d.getTime()
        )
    ) {

        return "Time unavailable";
    }


    return d.toLocaleString(
        "en-NG",
        {

            timeZone:
                "Africa/Lagos",

            day:
                "2-digit",

            month:
                "short",

            hour:
                "2-digit",

            minute:
                "2-digit",

            hour12:
                false

        }
    ) + " WAT";
}


/* =====================================================
   STATUS
===================================================== */

function normalizeStatus(
    status
) {

    return String(
        status ||
        ""
    ).toUpperCase();
}


/* =====================================================
   LEAGUE PRIORITY
===================================================== */

const TOP_LEAGUES = [

    "Premier League",
    "La Liga",
    "Bundesliga",
    "Serie A",
    "Ligue 1",

    "UEFA Champions League",
    "UEFA Europa League",
    "UEFA Conference League",

    "Eredivisie",
    "Primeira Liga",
    "Saudi Pro League",
    "Belgian Pro League",
    "Süper Lig",
    "Scottish Premiership",

    "Brasileirão Série A",
    "Liga Profesional Argentina",
    "Liga MX",
    "MLS",
    "J1 League",

    "Championship",
    "2. Bundesliga",
    "Serie B",
    "Ligue 2",
    "LaLiga 2",

    "Copa Libertadores",
    "Copa Sudamericana",

    "CAF Champions League",
    "CAF Confederation Cup"
];


function getLeaguePriority(
    name
) {

    const normalized =
        normalizeLeague(
            name
        );


    for (
        let i = 0;
        i < TOP_LEAGUES.length;
        i++
    ) {

        const target =
            normalizeLeague(
                TOP_LEAGUES[i]
            );


        if (
            normalized === target ||
            normalized.includes(target) ||
            target.includes(normalized)
        ) {

            return i;
        }

    }


    return 1000;
}


function normalizeLeague(
    name
) {

    return String(
        name || ""
    )
    .normalize("NFD")
    .replace(
        /[\u0300-\u036f]/g,
        ""
    )
    .toLowerCase()
    .replace(
        /[^a-z0-9]+/g,
        " "
    )
    .trim();
}


/* =====================================================
   JSON
===================================================== */

async function readJson(
    response
) {

    const raw =
        await response.text();


    try {

        return JSON.parse(
            raw
        );

    }

    catch {

        throw new Error(
            "Server returned invalid JSON."
        );

    }
}


/* =====================================================
   ESCAPE
===================================================== */

function escapeHtml(
    value
) {

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );
}

</script>

</body>
</html>
