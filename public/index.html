<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        TomsonStakes Global Football
    </title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #111827;

            color: #ffffff;

        }


        .container {

            width: 100%;

            max-width: 1000px;

            margin: 0 auto;

            padding: 20px;

        }


        /* =====================================================
           HEADER
        ===================================================== */

        .header {

            text-align: center;

            padding: 25px 10px 20px;

        }


        .header h1 {

            margin: 0;

            font-size: 32px;

            font-weight: 800;

        }


        .subtitle {

            color: #9ca3af;

            margin-top: 8px;

            font-size: 14px;

            letter-spacing: 1px;

        }


        /* =====================================================
           CONTROL BOX
        ===================================================== */

        .control-box {

            background: #1f2937;

            padding: 22px;

            border-radius: 14px;

            text-align: center;

            margin-bottom: 20px;

            box-shadow:
                0 8px 20px
                rgba(0, 0, 0, 0.18);

        }


        .control-box p {

            margin-top: 0;

            color: #d1d5db;

        }


        input[type="date"] {

            width: 100%;

            max-width: 400px;

            padding: 14px;

            border: none;

            border-radius: 8px;

            font-size: 16px;

            background: #ffffff;

            color: #111827;

        }


        button {

            border: none;

            border-radius: 8px;

            padding: 13px 18px;

            font-size: 15px;

            font-weight: bold;

            cursor: pointer;

        }


        button:disabled {

            opacity: 0.6;

            cursor: wait;

        }


        .main-button {

            background: #16a34a;

            color: white;

            width: 100%;

            max-width: 400px;

            margin-top: 12px;

        }


        .main-button:hover {

            background: #15803d;

        }


        .analyze-button {

            background: #2563eb;

            color: white;

            width: 100%;

            margin-top: 15px;

        }


        .analyze-button:hover {

            background: #1d4ed8;

        }


        /* =====================================================
           NOTICES
        ===================================================== */

        .notice {

            background: #1f2937;

            padding: 18px;

            border-radius: 12px;

            margin-top: 15px;

        }


        .notice h2 {

            margin-top: 0;

        }


        .status {

            padding: 12px;

            border-radius: 8px;

            margin-top: 12px;

            font-weight: bold;

        }


        .status-ready {

            background: #dcfce7;

            color: #166534;

        }


        .status-warning {

            background: #fef3c7;

            color: #92400e;

        }


        .status-error {

            background: #fee2e2;

            color: #991b1b;

        }


        /* =====================================================
           FIXTURE
        ===================================================== */

        .fixture {

            background: #ffffff;

            color: #111827;

            border-radius: 14px;

            padding: 18px;

            margin-top: 15px;

            box-shadow:
                0 5px 15px
                rgba(0, 0, 0, 0.12);

        }


        .fixture h3 {

            margin-top: 0;

            margin-bottom: 10px;

            font-size: 20px;

        }


        .fixture-meta {

            color: #6b7280;

            font-size: 14px;

            margin-top: 6px;

        }


        /* =====================================================
           ANALYSIS BOX
        ===================================================== */

        .analysis {

            margin-top: 15px;

            background: #f3f4f6;

            color: #111827;

            border-radius: 12px;

            padding: 15px;

        }


        .hidden {

            display: none;

        }


        /* =====================================================
           FINAL PREDICTION
        ===================================================== */

        .final-result {

            background: #111827;

            color: white;

            border-radius: 14px;

            padding: 25px 20px;

            margin-top: 5px;

            text-align: center;

            border: 2px solid #2563eb;

            box-shadow:
                0 8px 20px
                rgba(0, 0, 0, 0.20);

        }


        .final-title {

            font-size: 13px;

            font-weight: bold;

            color: #9ca3af;

            letter-spacing: 2px;

            text-transform: uppercase;

        }


        .final-prediction {

            font-size: 30px;

            font-weight: bold;

            margin: 10px 0 25px;

            color: #22c55e;

        }


        .final-probability {

            font-size: 34px;

            font-weight: bold;

            margin-top: 8px;

            color: #ffffff;

        }


        /* =====================================================
           RESPONSIVE
        ===================================================== */

        @media (max-width: 600px) {

            .container {

                padding: 12px;

            }


            .header h1 {

                font-size: 27px;

            }


            .fixture h3 {

                font-size: 18px;

            }


            .final-prediction {

                font-size: 27px;

            }


            .final-probability {

                font-size: 32px;

            }

        }

    </style>

</head>


<body>


<div class="container">


    <!-- =====================================================
         HEADER
    ===================================================== -->

    <div class="header">

        <h1>
            🔥 TOMSONSTAKES
        </h1>

        <div class="subtitle">
            GLOBAL FOOTBALL PREDICTION ENGINE
        </div>

    </div>


    <!-- =====================================================
         DATE SEARCH
    ===================================================== -->

    <div class="control-box">

        <p>
            Select a date to scan available football fixtures.
        </p>


        <input
            type="date"
            id="matchDate"
        >


        <br>


        <button
            class="main-button"
            id="scanButton"
            onclick="analyzeMatches()"
        >
            ANALYZE MATCHES
        </button>

    </div>


    <!-- =====================================================
         RESULTS
    ===================================================== -->

    <div id="results"></div>


</div>



<script>


/* =========================================================
   GLOBAL FIXTURE SEARCH
========================================================= */

async function analyzeMatches() {


    const date =
        document.getElementById(
            "matchDate"
        ).value;


    const results =
        document.getElementById(
            "results"
        );


    const scanButton =
        document.getElementById(
            "scanButton"
        );


    if (!date) {

        results.innerHTML = `

            <div class="notice status-warning">

                ⚠️ Please select a match date.

            </div>

        `;

        return;

    }


    scanButton.disabled = true;


    results.innerHTML = `

        <div class="notice">

            <h2>
                🔥 TOMSONSTAKES
            </h2>

            <p>
                🔎 Scanning global football fixtures for
                <strong>
                    ${escapeHtml(date)}
                </strong>
                ...
            </p>

            <p>
                ⏳ Connecting to live football data...
            </p>

        </div>

    `;


    try {


        const response =
            await fetch(
                `/api/fixtures?date=${encodeURIComponent(date)}`
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.error ||
                data.message ||
                "Unable to retrieve football fixtures."
            );

        }


        if (
            !data.response ||
            !Array.isArray(data.response) ||
            data.response.length === 0
        ) {

            results.innerHTML = `

                <div class="notice status-warning">

                    <h2>
                        🔥 TOMSONSTAKES
                    </h2>

                    <p>
                        📅 Date:
                        <strong>
                            ${escapeHtml(date)}
                        </strong>
                    </p>

                    <p>
                        ⚠️ No fixtures were returned
                        for this date.
                    </p>

                </div>

            `;

            scanButton.disabled = false;

            return;

        }


        let html = `

            <div class="notice">

                <h2>
                    🔥 TOMSONSTAKES GLOBAL FIXTURES
                </h2>

                <p>
                    📅 Date:
                    <strong>
                        ${escapeHtml(date)}
                    </strong>
                </p>

                <p>
                    🌍 Fixtures found:
                    <strong>
                        ${data.response.length}
                    </strong>
                </p>

            </div>

        `;


        data.response.forEach(
            (match, index) => {

                html +=
                    buildFixtureCard(
                        match,
                        index
                    );

            }
        );


        results.innerHTML = html;


    } catch (error) {


        console.error(
            "FIXTURE SEARCH ERROR:",
            error
        );


        results.innerHTML = `

            <div class="notice status-error">

                <h2>
                    🔥 TOMSONSTAKES
                </h2>

                <p>
                    ❌ Unable to load football fixtures.
                </p>

                <p>
                    <strong>
                        Error:
                    </strong>

                    ${escapeHtml(
                        error.message
                    )}

                </p>

            </div>

        `;


    } finally {

        scanButton.disabled = false;

    }

}



/* =========================================================
   FIXTURE CARD
========================================================= */

function buildFixtureCard(
    match,
    index
) {


    const league =
        match.league?.name ||
        "Unknown Competition";


    const country =
        match.league?.country ||
        "";


    const home =
        match.teams?.home?.name ||
        "Home Team";


    const away =
        match.teams?.away?.name ||
        "Away Team";


    const homeIdentity =
        createIdentity(home);


    const awayIdentity =
        createIdentity(away);


    const identitiesValid =
        Boolean(homeIdentity) &&
        Boolean(awayIdentity) &&
        homeIdentity !== awayIdentity;


    const kickoffUTC =
        match.fixture?.date;


    let kickoffWAT =
        "Time unavailable";


    if (kickoffUTC) {

        try {

            const dateObject =
                new Date(kickoffUTC);


            kickoffWAT =
                dateObject.toLocaleTimeString(
                    "en-NG",
                    {
                        timeZone: "Africa/Lagos",
                        hour: "2-digit",
                        minute: "2-digit",
                        hour12: false
                    }
                ) +
                " WAT";


        } catch (error) {

            kickoffWAT =
                "Time unavailable";

        }

    }


    const matchDate =
        kickoffUTC
            ? kickoffUTC.substring(0, 10)
            : document.getElementById(
                "matchDate"
              ).value;


    return `

        <div
            class="fixture"
            id="fixture-${index}"
        >


            <h3>

                ⚽

                ${escapeHtml(home)}

                vs

                ${escapeHtml(away)}

            </h3>


            <div class="fixture-meta">

                🏆

                ${escapeHtml(league)}

                ${
                    country
                    ? " — " +
                      escapeHtml(country)
                    : ""
                }

            </div>


            <div class="fixture-meta">

                🕐 Kickoff:

                <strong>
                    ${escapeHtml(kickoffWAT)}
                </strong>

            </div>


            <div class="fixture-meta">

                🆔

                ${escapeHtml(homeIdentity)}

                vs

                ${escapeHtml(awayIdentity)}

            </div>


            ${
                identitiesValid

                ? `

                    <button

                        class="analyze-button"

                        id="analyze-button-${index}"

                        onclick="runMatchAnalysis(
                            ${index},
                            '${escapeJs(home)}',
                            '${escapeJs(away)}',
                            '${escapeJs(homeIdentity)}',
                            '${escapeJs(awayIdentity)}',
                            '${escapeJs(matchDate)}'
                        )"

                    >

                        🔍 ANALYZE MATCH

                    </button>

                `

                : `

                    <div class="status status-error">

                        ❌ Unable to create valid
                        team identities.

                    </div>

                `
            }


            <div

                id="analysis-${index}"

                class="analysis hidden"

            ></div>


        </div>

    `;

}



/* =========================================================
   MATCH ANALYSIS
========================================================= */

async function runMatchAnalysis(
    index,
    home,
    away,
    homeIdentity,
    awayIdentity,
    date
) {


    const box =
        document.getElementById(
            `analysis-${index}`
        );


    const button =
        document.getElementById(
            `analyze-button-${index}`
        );


    box.classList.remove(
        "hidden"
    );


    button.disabled = true;


    box.innerHTML = `

        <div class="status status-warning">

            🔎 Analyzing

            <strong>
                ${escapeHtml(home)}
            </strong>

            vs

            <strong>
                ${escapeHtml(away)}
            </strong>

            ...

        </div>

    `;


    const MATCH = {

        home:
            home,

        homeIdentity:
            homeIdentity,

        away:
            away,

        awayIdentity:
            awayIdentity,

        date:
            date

    };


    try {


        /* =================================================
           STEP 1 — WEB DATA
        ================================================= */


        box.innerHTML = `

            <div class="status status-warning">

                🔎 Collecting match evidence...

            </div>

        `;


        const webUrl =

            `/api/web-data` +

            `?home=${encodeURIComponent(home)}` +

            `&homeIdentity=${encodeURIComponent(homeIdentity)}` +

            `&away=${encodeURIComponent(away)}` +

            `&awayIdentity=${encodeURIComponent(awayIdentity)}` +

            `&date=${encodeURIComponent(date)}`;


        const webResponse =
            await fetch(webUrl);


        const webData =
            await webResponse.json();


        if (!webResponse.ok) {

            throw new Error(
                webData.error ||
                webData.message ||
                "Web data request failed."
            );

        }



        /* =================================================
           STEP 2 — NORMALIZE
        ================================================= */


        box.innerHTML = `

            <div class="status status-warning">

                ⚙️ Processing match data...

            </div>

        `;


        const normalizeResponse =

            await fetch(
                "/api/normalize-web",
                {

                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:

                        JSON.stringify({

                            ...webData,

                            match:
                                MATCH

                        })

                }
            );


        const normalized =
            await normalizeResponse.json();


        if (!normalizeResponse.ok) {

            throw new Error(
                normalized.error ||
                normalized.message ||
                "Normalization failed."
            );

        }



        /* =================================================
           STEP 3 — PREDICTION ENGINE
        ================================================= */


        box.innerHTML = `

            <div class="status status-warning">

                🧠 Running prediction engine...

            </div>

        `;


        const predictionResponse =

            await fetch(
                "/api/predict",
                {

                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:

                        JSON.stringify({

                            match:
                                MATCH,

                            normalized:
                                normalized

                        })

                }
            );


        const prediction =
            await predictionResponse.json();


        if (!predictionResponse.ok) {

            throw new Error(
                prediction.error ||
                prediction.message ||
                "Prediction failed."
            );

        }



        /* =================================================
           FINAL DISPLAY
           
           IMPORTANT:
           ONLY prediction + probability
           are displayed to the user.
        ================================================= */


        box.innerHTML =
            buildFinalPrediction(
                prediction
            );


        button.textContent =
            "✓ ANALYSIS COMPLETE";


        button.disabled = false;


    } catch (error) {


        console.error(
            "MATCH ANALYSIS ERROR:",
            error
        );


        box.innerHTML = `

            <div class="status status-error">

                ❌ Analysis failed.

                <br><br>

                <strong>
                    ${escapeHtml(
                        error.message
                    )}
                </strong>

            </div>

        `;


        button.disabled = false;

    }

}



/* =========================================================
   FINAL PREDICTION DISPLAY
========================================================= */

function buildFinalPrediction(
    prediction
) {


    if (
        !prediction ||
        prediction.success !== true ||
        !prediction.prediction
    ) {

        return `

            <div class="status status-warning">

                ⚠️ No sufficiently supported prediction
                was produced for this fixture.

            </div>

        `;

    }


    const probability =
        Number(
            prediction.probability
        );


    const formattedProbability =

        Number.isFinite(probability)

            ? probability.toFixed(0) + "%"

            : "—";


    return `

        <div class="final-result">


            <div class="final-title">

                FINAL PREDICTION

            </div>


            <div class="final-prediction">

                ${escapeHtml(
                    prediction.prediction
                )}

            </div>


            <div class="final-title">

                PROBABILITY

            </div>


            <div class="final-probability">

                ${formattedProbability}

            </div>


        </div>

    `;

}



/* =========================================================
   TEAM IDENTITY
========================================================= */

function createIdentity(
    name
) {


    const value =

        String(name || "")

            .trim()

            .normalize("NFD")

            .replace(
                /[\u0300-\u036f]/g,
                ""
            )

            .replace(
                /[’']/g,
                ""
            )

            .replace(
                /&/g,
                " AND "
            )

            .toUpperCase()

            .replace(
                /[^A-Z0-9]+/g,
                "_"
            )

            .replace(
                /^_+|_+$/g,
                ""
            );


    return value || "";

}



/* =========================================================
   HTML SECURITY
========================================================= */

function escapeHtml(
    value
) {


    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}



/* =========================================================
   JAVASCRIPT STRING SECURITY
========================================================= */

function escapeJs(
    value
) {


    return String(value)

        .replace(
            /\\/g,
            "\\\\"
        )

        .replace(
            /'/g,
            "\\'"
        )

        .replace(
            /\r/g,
            "\\r"
        )

        .replace(
            /\n/g,
            "\\n"
        );

}


</script>


</body>

</html>
