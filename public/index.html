<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TomsonStakes Global Football</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0b0f14;
    color: #ffffff;
}

.container {
    width: 100%;
    max-width: 900px;
    margin: auto;
    padding: 20px;
}

.header {
    text-align: center;
    padding: 25px 10px;
}

.logo {
    font-size: 32px;
    font-weight: bold;
}

.subtitle {
    color: #aeb7c2;
    margin-top: 8px;
}

.card {
    background: #151b23;
    border-radius: 14px;
    padding: 20px;
    margin-top: 18px;
    border: 1px solid #252d38;
}

label {
    display: block;
    margin-bottom: 8px;
    color: #cbd5e1;
    font-weight: bold;
}

input {
    width: 100%;
    padding: 14px;
    border-radius: 9px;
    border: 1px solid #374151;
    background: #0f141b;
    color: white;
    font-size: 16px;
}

button {
    width: 100%;
    padding: 15px;
    margin-top: 15px;
    border: none;
    border-radius: 9px;
    background: #16a34a;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    opacity: 0.9;
}

button:disabled {
    opacity: 0.6;
    cursor: wait;
}

.status {
    margin-top: 18px;
    padding: 14px;
    border-radius: 9px;
    background: #18202a;
    color: #cbd5e1;
}

.success {
    border: 1px solid #166534;
}

.error {
    border: 1px solid #991b1b;
    color: #fecaca;
}

.fixture {
    background: #111820;
    border: 1px solid #293340;
    border-radius: 12px;
    padding: 18px;
    margin-top: 15px;
}

.fixture h3 {
    margin: 0 0 10px;
    font-size: 18px;
}

.league {
    color: #9ca3af;
    font-size: 14px;
    margin-bottom: 12px;
}

.time {
    color: #22c55e;
    font-weight: bold;
}

.analyze-btn {
    background: #2563eb;
    margin-top: 14px;
}

.empty {
    text-align: center;
    padding: 30px 10px;
    color: #9ca3af;
}

.count {
    color: #22c55e;
    font-weight: bold;
}

.hidden {
    display: none;
}

.footer {
    text-align: center;
    color: #6b7280;
    font-size: 12px;
    margin: 30px 0 10px;
}

@media (max-width: 600px) {

    .container {
        padding: 15px;
    }

    .logo {
        font-size: 27px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <div class="logo">🔥 TOMSONSTAKES</div>

        <div class="subtitle">
            GLOBAL FOOTBALL PREDICTION ENGINE
        </div>
    </div>


    <div class="card">

        <label for="matchDate">
            Select Match Date
        </label>

        <input
            type="date"
            id="matchDate"
        >

        <button
            id="analyzeButton"
            onclick="loadFixtures()"
        >
            ANALYZE MATCHES
        </button>

    </div>


    <div
        id="status"
        class="status hidden"
    ></div>


    <div
        id="results"
        class="card hidden"
    ></div>


    <div class="footer">
        TomsonStakes Football Analysis
    </div>

</div>


<script>

async function loadFixtures() {

    const dateInput =
        document.getElementById("matchDate");

    const button =
        document.getElementById("analyzeButton");

    const status =
        document.getElementById("status");

    const results =
        document.getElementById("results");


    const date =
        dateInput.value;


    if (!date) {

        showStatus(
            "Please select a match date.",
            true
        );

        return;
    }


    button.disabled = true;

    button.textContent =
        "LOADING FIXTURES...";


    results.classList.add("hidden");

    showStatus(
        "🔎 Connecting to football data...",
        false
    );


    try {

        const response =
            await fetch(
                "/api/fixtures?date=" +
                encodeURIComponent(date)
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.error ||
                data.message ||
                "Football API request failed."
            );

        }


        /*
         * API-Football normally returns
         * the fixtures inside "response".
         */

        const fixtures =
            Array.isArray(data.response)
                ? data.response
                : [];


        if (fixtures.length === 0) {

            results.innerHTML = `
                <div class="empty">

                    <h2>No Fixtures Found</h2>

                    <p>
                        No football fixtures were
                        returned for
                        <strong>${escapeHtml(date)}</strong>.
                    </p>

                </div>
            `;

            results.classList.remove("hidden");

            showStatus(
                "Search completed.",
                false
            );

            return;
        }


        let html = `

            <h2>
                ⚽ Football Fixtures
            </h2>

            <p>
                Date:
                <strong>${escapeHtml(date)}</strong>
            </p>

            <p>
                Fixtures found:
                <span class="count">
                    ${fixtures.length}
                </span>
            </p>
        `;


        fixtures.forEach(
            (match, index) => {

                const home =
                    match.teams &&
                    match.teams.home &&
                    match.teams.home.name
                        ? match.teams.home.name
                        : "Home Team";


                const away =
                    match.teams &&
                    match.teams.away &&
                    match.teams.away.name
                        ? match.teams.away.name
                        : "Away Team";


                const league =
                    match.league &&
                    match.league.name
                        ? match.league.name
                        : "Unknown Competition";


                const country =
                    match.league &&
                    match.league.country
                        ? match.league.country
                        : "";


                const kickoff =
                    match.fixture &&
                    match.fixture.date
                        ? formatNigeriaTime(
                            match.fixture.date
                        )
                        : "Time unavailable";


                html += `

                    <div class="fixture">

                        <h3>
                            ⚽
                            ${escapeHtml(home)}
                            vs
                            ${escapeHtml(away)}
                        </h3>

                        <div class="league">

                            🏆
                            ${escapeHtml(league)}

                            ${
                                country
                                    ? " — " +
                                      escapeHtml(country)
                                    : ""
                            }

                        </div>

                        <div class="time">

                            🕐
                            ${escapeHtml(kickoff)}

                        </div>


                        <button
                            class="analyze-btn"
                            onclick="openMatchAnalysis(
                                ${index}
                            )"
                        >

                            ANALYZE THIS MATCH

                        </button>

                    </div>
                `;
            }
        );


        results.innerHTML = html;

        results.classList.remove(
            "hidden"
        );


        /*
         * Store fixtures so that
         * the selected match can
         * be used later by the
         * prediction engine.
         */

        window.tomsonFixtures =
            fixtures;


        showStatus(
            "✅ Fixtures loaded successfully.",
            false
        );


    } catch (error) {

        console.error(error);


        showStatus(
            "❌ " + error.message,
            true
        );


        results.classList.add(
            "hidden"
        );

    } finally {

        button.disabled = false;

        button.textContent =
            "ANALYZE MATCHES";

    }

}


/* ============================
   MATCH ANALYSIS
============================ */
async function openMatchAnalysis(index) {

    const fixtures =
        window.tomsonFixtures || [];

    const match =
        fixtures[index];

    if (!match) {

        showStatus(
            "Unable to find selected match.",
            true
        );

        return;
    }

    const home =
        match.teams?.home?.name ||
        "Home Team";

    const away =
        match.teams?.away?.name ||
        "Away Team";

    const date =
        match.fixture?.date
            ? match.fixture.date.substring(0, 10)
            : "";

    const homeTeamId =
        match.teams?.home?.id || null;

    const awayTeamId =
        match.teams?.away?.id || null;

    const results =
        document.getElementById("results");

    const status =
        document.getElementById("status");


    /*
     * =====================================================
     * SHOW LOADING SCREEN
     * =====================================================
     */

    results.classList.remove("hidden");

    results.innerHTML = `

        <h2>🔥 Analyzing Match</h2>

        <div class="fixture">

            <h3>
                ⚽
                ${escapeHtml(home)}
                vs
                ${escapeHtml(away)}
            </h3>

            <div class="time">
                🕐
                ${escapeHtml(
                    formatNigeriaTime(
                        match.fixture?.date || ""
                    )
                )}
            </div>

            <div class="status success">

                🔎 Collecting football data...<br><br>

                Please wait while TomsonStakes
                processes the match.

            </div>

        </div>
    `;

    showStatus(
        "🔎 Collecting match analysis data...",
        false
    );


    try {

        /*
         * =====================================================
         * STEP 1 — WEB DATA
         * =====================================================
         */

        const webResponse =
            await fetch(
                "/api/web-data",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({

                        match: {

                            home,

                            away,

                            date,

                            homeTeamId,

                            awayTeamId

                        }

                    })
                }
            );


        const webData =
            await webResponse.json();


        if (!webResponse.ok) {

            throw new Error(
                webData.error ||
                "Unable to collect web data."
            );

        }


        showStatus(
            "✅ Web data collected. Normalizing evidence...",
            false
        );


        /*
         * =====================================================
         * STEP 2 — NORMALIZE WEB DATA
         * =====================================================
         */

        const normalizeResponse =
            await fetch(
                "/api/normalize-web",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({

                        match: {

                            home,

                            away,

                            date,

                            homeIdentity:
                                webData.match?.homeIdentity ||
                                match.homeIdentity ||
                                "",

                            awayIdentity:
                                webData.match?.awayIdentity ||
                                match.awayIdentity ||
                                ""

                        },

                        searches:
                            webData.searches || [],

                        allResults:
                            webData.allResults || []

                    })
                }
            );


        const normalized =
            await normalizeResponse.json();


        if (!normalizeResponse.ok) {

            throw new Error(
                normalized.error ||
                "Web normalization failed."
            );

        }


        showStatus(
            "✅ Data normalized. Running prediction engine...",
            false
        );


        /*
         * =====================================================
         * STEP 3 — PREDICTION ENGINE
         * =====================================================
         */

        const predictionResponse =
            await fetch(
                "/api/predict",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({

                        match: {

                            home:
                                normalized.match?.home ||
                                home,

                            away:
                                normalized.match?.away ||
                                away,

                            date

                        },

                        normalized: {

                            form:
                                normalized.form || {},

                            h2h:
                                normalized.h2h || {},

                            btts: {

                                probability:
                                    normalized.statistics?.btts?.[0]
                                        ?.percentage ??
                                    null,

                                odds:
                                    normalized.statistics?.btts ||
                                    [],

                                evidence:
                                    normalized.statistics?.btts ||
                                    []

                            },

                            overUnder: {

                                odds:
                                    normalized.statistics?.overUnder ||
                                    [],

                                evidence:
                                    normalized.statistics?.overUnder ||
                                    []

                            },

                            xg: {

                                home:
                                    normalized.statistics?.xg
                                        ?.map(item => ({
                                            value:
                                                item.home
                                        })) || [],

                                away:
                                    normalized.statistics?.xg
                                        ?.map(item => ({
                                            value:
                                                item.away
                                        })) || []

                            },

                            odds: {

                                home:
                                    normalized.odds?.oneXtwo?.home ??
                                    null,

                                draw:
                                    normalized.odds?.oneXtwo?.draw ??
                                    null,

                                away:
                                    normalized.odds?.oneXtwo?.away ??
                                    null,

                                evidence:
                                    normalized.odds?.oneXtwo
                                        ? [normalized.odds.oneXtwo]
                                        : []

                            },

                            injuries: {

                                evidence:
                                    normalized.injuries || []

                            },

                            lineups: {

                                evidence:
                                    normalized.lineups || []

                            }

                        },

                        readiness: {

                            identityReady:
                                normalized.availability
                                    ?.identityReady === true,

                            formReady:
                                normalized.availability
                                    ?.formReady === true,

                            statsReady:
                                normalized.availability
                                    ?.statsReady === true

                        },

                        availability:
                            normalized.availability || {}

                    })
                }
            );


        const prediction =
            await predictionResponse.json();


        if (!predictionResponse.ok) {

            throw new Error(
                prediction.error ||
                "Prediction engine failed."
            );

        }


        /*
         * =====================================================
         * STEP 4 — DISPLAY RESULTS
         * =====================================================
         */

        displayPredictionResults(
            prediction
        );


        showStatus(
            "✅ Match analysis completed.",
            false
        );


    } catch (error) {

        console.error(
            "MATCH ANALYSIS ERROR:",
            error
        );


        showStatus(
            "❌ " + error.message,
            true
        );


        results.innerHTML = `

            <div class="empty">

                <h2>⚠️ Analysis Failed</h2>

                <p>
                    ${escapeHtml(
                        error.message
                    )}
                </p>

                <button
                    class="analyze-btn"
                    onclick="openMatchAnalysis(${index})"
                >
                    🔄 TRY AGAIN
                </button>

            </div>

        `;

    }

}

    function displayPredictionResults(prediction) {

    const results =
        document.getElementById("results");

    const model =
        prediction.model || {};

    const oneXTwo =
        model.oneXTwo || {};

    const doubleChance =
        model.doubleChance || {};

    const drawNoBet =
        model.drawNoBet || {};

    const btts =
        model.btts || {};

    const overUnder =
        model.overUnder || {};

    const xg =
        model.xg || {};

    const market =
        prediction.market || {};

    const confidence =
        prediction.confidence ?? 0;

    const status =
        prediction.status ||
        "UNKNOWN";


    results.innerHTML = `

        <h2>
            🔥 TOMSONSTAKES ANALYSIS
        </h2>


        <div class="fixture">

            <h3>
                ⚽
                ${escapeHtml(
                    prediction.match?.home ||
                    "Home"
                )}
                vs
                ${escapeHtml(
                    prediction.match?.away ||
                    "Away"
                )}
            </h3>


            <div class="status success">

                Status:
                <strong>
                    ${escapeHtml(status)}
                </strong>

                <br><br>

                Confidence:
                <strong>
                    ${confidence}%
                </strong>

                <br><br>

                Model:
                <strong>
                    ${escapeHtml(
                        prediction.modelMethod ||
                        "N/A"
                    )}
                </strong>

            </div>


            <h3>
                📊 1X2 Probability
            </h3>

            <p>
                🏠 Home:
                <strong>
                    ${formatPercent(
                        oneXTwo.home
                    )}
                </strong>
            </p>

            <p>
                🤝 Draw:
                <strong>
                    ${formatPercent(
                        oneXTwo.draw
                    )}
                </strong>
            </p>

            <p>
                ✈️ Away:
                <strong>
                    ${formatPercent(
                        oneXTwo.away
                    )}
                </strong>
            </p>


            <h3>
                🔄 Double Chance
            </h3>

            <p>
                1X:
                <strong>
                    ${formatPercent(
                        doubleChance.homeOrDraw
                    )}
                </strong>
            </p>

            <p>
                X2:
                <strong>
                    ${formatPercent(
                        doubleChance.awayOrDraw
                    )}
                </strong>
            </p>

            <p>
                12:
                <strong>
                    ${formatPercent(
                        doubleChance.homeOrAway
                    )}
                </strong>
            </p>


            <h3>
                🛡️ Draw No Bet
            </h3>

            <p>
                Home:
                <strong>
                    ${formatPercent(
                        drawNoBet.home
                    )}
                </strong>
            </p>

            <p>
                Away:
                <strong>
                    ${formatPercent(
                        drawNoBet.away
                    )}
                </strong>
            </p>


            <h3>
                ⚽ BTTS
            </h3>

            <p>
                Probability:
                <strong>
                    ${formatPercent(
                        btts.probability
                    )}
                </strong>
            </p>


            <h3>
                📈 Over / Under
            </h3>

            ${
                Array.isArray(
                    overUnder.assessment
                ) &&
                overUnder.assessment.length
                    ? overUnder.assessment
                        .map(item => `

                            <p>
                                <strong>
                                    ${escapeHtml(
                                        item.selection ||
                                        ""
                                    )}
                                </strong>

                                ${
                                    item.line !== null &&
                                    item.line !== undefined
                                        ? escapeHtml(
                                            String(
                                                item.line
                                            )
                                        )
                                        : ""
                                }

                                —
                                Odds:
                                ${formatNumber(
                                    item.odds
                                )}

                                —
                                Edge:
                                ${formatPercent(
                                    item.edge
                                )}
                            </p>

                        `)
                        .join("")
                    : "<p>No reliable Over/Under data.</p>"
            }


            <h3>
                📐 Expected Goals
            </h3>

            <p>
                Home xG:
                <strong>
                    ${formatNumber(
                        xg.home
                    )}
                </strong>
            </p>

            <p>
                Away xG:
                <strong>
                    ${formatNumber(
                        xg.away
                    )}
                </strong>
            </p>


            <h3>
                💰 Market Odds
            </h3>

            <p>
                Home:
                <strong>
                    ${formatNumber(
                        market.odds?.home
                    )}
                </strong>
            </p>

            <p>
                Draw:
                <strong>
                    ${formatNumber(
                        market.odds?.draw
                    )}
                </strong>
            </p>

            <p>
                Away:
                <strong>
                    ${formatNumber(
                        market.odds?.away
                    )}
                </strong>
            </p>


            ${
                Array.isArray(
                    prediction.evidence
                )
                    ? ""
                    : ""
            }


            <h3>
                ⚠️ Data Warnings
            </h3>

            ${
                Array.isArray(
                    prediction.warnings
                ) &&
                prediction.warnings.length
                    ? `
                        <ul>
                            ${prediction.warnings
                                .map(
                                    warning => `
                                        <li>
                                            ${escapeHtml(
                                                warning
                                            )}
                                        </li>
                                    `
                                )
                                .join("")
                            }
                        </ul>
                    `
                    : "<p>No warnings.</p>"
            }


            <button
                class="analyze-btn"
                onclick="loadFixtures()"
            >

                ← BACK TO FIXTURES

            </button>

        </div>
    `;
    }      
function formatPercent(value) {

    if (
        value === null ||
        value === undefined ||
        !Number.isFinite(Number(value))
    ) {
        return "N/A";
    }

    return Number(value).toFixed(2) + "%";
}


function formatNumber(value) {

    if (
        value === null ||
        value === undefined ||
        !Number.isFinite(Number(value))
    ) {
        return "N/A";
    }

    return Number(value).toFixed(2);
}
/* ============================
   STATUS
============================ */

function showStatus(
    message,
    isError
) {

    const status =
        document.getElementById(
            "status"
        );


    status.textContent =
        message;


    status.classList.remove(
        "hidden",
        "error",
        "success"
    );


    if (isError) {

        status.classList.add(
            "error"
        );

    } else {

        status.classList.add(
            "success"
        );

    }

}


/* ============================
   NIGERIA TIME
============================ */

function formatNigeriaTime(
    utcDate
) {

    try {

        const date =
            new Date(utcDate);


        return date.toLocaleString(
            "en-NG",
            {
                timeZone: "Africa/Lagos",
                day: "2-digit",
                month: "short",
                year: "numeric",
                hour: "2-digit",
                minute: "2-digit",
                hour12: false
            }
        ) + " WAT";


    } catch (error) {

        return "Time unavailable";

    }

}


/* ============================
   SECURITY
============================ */

function escapeHtml(
    value
) {

    return String(value)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}

</script>

</body>
</html>
