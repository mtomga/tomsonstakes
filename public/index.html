<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>TomsonStakes</title>

<style>

* {
    box-sizing: border-box;
}

:root {
    --bg: #050b14;
    --panel: #0b1726;
    --panel2: #102238;
    --border: #203b56;
    --green: #22c55e;
    --green-dark: #15803d;
    --gold: #f59e0b;
    --text: #f8fafc;
    --muted: #94a3b8;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background:
        radial-gradient(circle at 20% 0%, #123b2a 0, transparent 28%),
        radial-gradient(circle at 100% 10%, #17395c 0, transparent 30%),
        #050b14;
    color: var(--text);
    min-height: 100vh;
}

.container {
    width: 100%;
    max-width: 1100px;
    margin: auto;
    padding: 16px;
}

/* =====================================================
   HERO
===================================================== */

.hero {
    position: relative;
    overflow: hidden;
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 30px 24px;
    margin-bottom: 16px;

    background:
        linear-gradient(
            135deg,
            #0d2c21,
            #0a1727 55%,
            #081321
        );

    box-shadow:
        0 20px 70px rgba(0,0,0,.3);
}

.hero:after {
    content: "";
    position: absolute;
    width: 180px;
    height: 180px;
    border-radius: 50%;
    background: rgba(34,197,94,.10);
    right: -50px;
    top: -70px;
}

.brand {
    display: flex;
    align-items: center;
    gap: 14px;
    position: relative;
    z-index: 2;
}

.logo {
    width: 60px;
    height: 60px;
    display: grid;
    place-items: center;
    border-radius: 18px;

    background:
        linear-gradient(
            135deg,
            #22c55e,
            #15803d
        );

    font-size: 28px;

    box-shadow:
        0 10px 30px rgba(34,197,94,.25);
}

.hero h1 {
    margin: 0;
    font-size: 32px;
    font-weight: 950;
    letter-spacing: -1px;
}

.hero p {
    margin: 7px 0 0;
    color: var(--muted);
    font-size: 13px;
}

/* =====================================================
   TODAY'S BOOKING
===================================================== */

.slip-card {

    position: relative;

    background:
        linear-gradient(
            135deg,
            #123d2a,
            #0b261b
        );

    border:
        1px solid
        rgba(34,197,94,.45);

    border-radius:
        20px;

    padding:
        22px;

    margin-bottom:
        20px;

    box-shadow:
        0 12px 35px
        rgba(0,0,0,.20);

}

.slip-card:before {

    content: "";

    position: absolute;

    width: 90px;
    height: 90px;

    border-radius: 50%;

    background:
        rgba(34,197,94,.08);

    right: -25px;
    top: -25px;

}

.slip-label {

    position: relative;

    color:
        #86efac;

    font-size:
        11px;

    font-weight:
        950;

    letter-spacing:
        1.5px;

    text-transform:
        uppercase;

}

.slip-code {

    position: relative;

    font-size:
        29px;

    font-weight:
        950;

    margin-top:
        8px;

    letter-spacing:
        1.5px;

    color:
        #ffffff;

}

.slip-details {

    position: relative;

    display:
        grid;

    grid-template-columns:
        repeat(2, minmax(0, 1fr));

    gap:
        10px;

    margin-top:
        16px;

}

.slip-detail {

    background:
        rgba(0,0,0,.20);

    border:
        1px solid
        rgba(255,255,255,.07);

    border-radius:
        10px;

    padding:
        10px;

}

.slip-detail-label {

    color:
        #86efac;

    font-size:
        9px;

    font-weight:
        900;

    text-transform:
        uppercase;

    letter-spacing:
        .8px;

}

.slip-detail-value {

    margin-top:
        4px;

    color:
        #ffffff;

    font-size:
        14px;

    font-weight:
        900;

}

.copy-button {

    position:
        relative;

    margin-top:
        15px;

    background:
        #22c55e;

    color:
        #ffffff;

    border:
        none;

    padding:
        11px 15px;

    border-radius:
        9px;

    font-weight:
        900;

    cursor:
        pointer;

}

.copy-button:hover {
    background: #16a34a;
}

/* =====================================================
   SECTION
===================================================== */

.section-title {

    display:
        flex;

    justify-content:
        space-between;

    align-items:
        center;

    margin:
        20px 0 10px;

}

.section-title h2 {

    margin:
        0;

    font-size:
        18px;

    font-weight:
        950;

}

.date-label {

    color:
        var(--muted);

    font-size:
        10px;

}

/* =====================================================
   LEAGUE
===================================================== */

.league {

    background:
        rgba(11,23,38,.92);

    border:
        1px solid
        var(--border);

    border-radius:
        16px;

    overflow:
        hidden;

    margin-bottom:
        15px;

}

.league-header {

    display:
        flex;

    justify-content:
        space-between;

    align-items:
        center;

    padding:
        14px 15px;

    background:
        linear-gradient(
            90deg,
            #102b44,
            #0b1827
        );

    border-left:
        5px solid
        var(--green);

}

.league-name {

    font-size:
        14px;

    font-weight:
        950;

}

.league-country {

    margin-top:
        3px;

    color:
        var(--muted);

    font-size:
        9px;

}

.league-count {

    background:
        rgba(34,197,94,.13);

    color:
        #86efac;

    border:
        1px solid
        rgba(34,197,94,.25);

    border-radius:
        20px;

    padding:
        5px 8px;

    font-size:
        8px;

    font-weight:
        900;

}

/* =====================================================
   PREDICTION
===================================================== */

.prediction {

    margin:
        9px;

    padding:
        15px;

    border-radius:
        13px;

    background:
        linear-gradient(
            135deg,
            #ffffff,
            #f8fafc
        );

    color:
        #111827;

    box-shadow:
        0 5px 18px
        rgba(0,0,0,.13);

}

.pred-top {

    display:
        flex;

    justify-content:
        space-between;

    gap:
        10px;

    color:
        #64748b;

    font-size:
        9px;

    font-weight:
        800;

}

.pred-teams {

    display:
        grid;

    grid-template-columns:
        1fr 40px 1fr;

    gap:
        8px;

    align-items:
        center;

    margin-top:
        12px;

}

.team {

    font-size:
        14px;

    font-weight:
        950;

}

.away {
    text-align: right;
}

.vs {

    text-align:
        center;

    color:
        #64748b;

    font-weight:
        950;

}

/* =====================================================
   PICK
===================================================== */

.pick-box {

    margin-top:
        13px;

    padding:
        12px;

    border-radius:
        10px;

    background:
        #ecfdf5;

    border:
        1px solid
        #bbf7d0;

}

.pick-market {

    color:
        #15803d;

    font-size:
        9px;

    font-weight:
        900;

    text-transform:
        uppercase;

}

.pick-selection {

    margin-top:
        3px;

    color:
        #14532d;

    font-size:
        18px;

    font-weight:
        950;

}

.confidence {

    display:
        inline-block;

    margin-top:
        7px;

    padding:
        5px 7px;

    border-radius:
        6px;

    background:
        #dcfce7;

    color:
        #166534;

    font-size:
        9px;

    font-weight:
        900;

}

/* =====================================================
   ANALYSIS
===================================================== */

.analysis {

    margin-top:
        11px;

    color:
        #475569;

    font-size:
        11px;

    line-height:
        1.6;

}

.empty {

    text-align:
        center;

    padding:
        45px 15px;

    color:
        var(--muted);

    font-size:
        12px;

}

/* =====================================================
   FOOTER
===================================================== */

.footer {

    text-align:
        center;

    padding:
        30px 10px;

    color:
        #64748b;

    font-size:
        10px;

}

@media(max-width:600px) {

    .hero h1 {
        font-size: 25px;
    }

    .pred-teams {
        grid-template-columns:
            1fr 32px 1fr;
    }

    .team {
        font-size: 12px;
    }

    .slip-code {
        font-size: 23px;
    }

    .slip-details {
        grid-template-columns: 1fr;
    }

}

</style>

</head>

<body>

<div class="container">

    <!-- HERO -->

    <div class="hero">

        <div class="brand">

            <div class="logo">
                ⚽
            </div>

            <div>

                <h1>
                    TOMSONSTAKES
                </h1>

                <p>
                    Football predictions •
                    analysis • daily selections
                </p>

            </div>

        </div>

    </div>


    <!-- =================================================
         TODAY'S BOOKING
    ================================================== -->

    <div
        id="dailySlip"
        class="slip-card"
        style="display:none"
    >

        <div class="slip-label">
            🎟️ TODAY'S BOOKING
        </div>

        <div
            id="bookingCode"
            class="slip-code"
        >
            —
        </div>

        <div class="slip-details">

            <div class="slip-detail">

                <div class="slip-detail-label">
                    Booking Code
                </div>

                <div
                    id="bookingCodeDetail"
                    class="slip-detail-value"
                >
                    —
                </div>

            </div>

            <div class="slip-detail">

                <div class="slip-detail-label">
                    Bookmaker
                </div>

                <div
                    id="bookmakerDetail"
                    class="slip-detail-value"
                >
                    —
                </div>

            </div>

        </div>

        <button
            id="copyButton"
            class="copy-button"
            type="button"
        >
            📋 COPY BOOKING CODE
        </button>

    </div>


    <!-- =================================================
         PREDICTIONS TITLE
    ================================================== -->

    <div class="section-title">

        <h2>
            🔥 TODAY'S PREDICTIONS
        </h2>

        <div
            id="predictionDate"
            class="date-label"
        >
            Loading...
        </div>

    </div>


    <div id="predictions">

        <div class="empty">
            Loading today's predictions...
        </div>

    </div>


    <div class="footer">

        TOMSONSTAKES • Football Prediction Center

    </div>

</div>


<script>

/* =====================================================
   STATE
===================================================== */

let currentBookingCode = "";


/* =====================================================
   START
===================================================== */

document.addEventListener(
    "DOMContentLoaded",
    loadPage
);


/* =====================================================
   LOAD PAGE
===================================================== */

async function loadPage() {

    const today =
        getToday();


    document.getElementById(
        "predictionDate"
    ).textContent =
        formatDate(today);


    /*
     * Load predictions and daily slip
     * independently.
     *
     * This is important because the
     * daily_slips record is a separate
     * table from predictions.
     */

    await Promise.allSettled([

        loadPredictions(today),

        loadDailySlip(today)

    ]);

}


/* =====================================================
   LOAD PREDICTIONS
===================================================== */

async function loadPredictions(
    date
) {

    const box =
        document.getElementById(
            "predictions"
        );


    try {

        const response =
            await fetch(
                "/api/predictions?date=" +
                encodeURIComponent(date)
            );


        const data =
            await readJson(response);


        if (!response.ok) {

            throw new Error(
                data.error ||
                data.message ||
                "Unable to load predictions."
            );

        }


        const predictions =
            Array.isArray(
                data.predictions
            )
            ?
            data.predictions
            :
            [];


        /*
         * Only published predictions
         * are visible on the public
         * frontend.
         */

        const published =
            predictions.filter(
                function(item) {

                    return normalizeStatus(
                        item.status
                    ) === "PUBLISHED";

                }
            );


        renderPredictions(
            published
        );

    }

    catch (error) {

        console.error(
            "Prediction loading error:",
            error
        );


        box.innerHTML = `

            <div class="empty">

                Unable to load today's
                predictions.

            </div>

        `;

    }

}


/* =====================================================
   LOAD DAILY SLIP
===================================================== */

async function loadDailySlip(
    date
) {

    const card =
        document.getElementById(
            "dailySlip"
        );


    try {

        /*
         * IMPORTANT:
         *
         * This endpoint must return
         * the exact daily_slips row
         * for the requested date.
         *
         * Example:
         *
         * {
         *   success: true,
         *   slip: {
         *      prediction_date: "2026-10-04",
         *      booking_code: "XXXXXXXX",
         *      bookmaker: "Bet9ja",
         *      status: "PUBLISHED"
         *   }
         * }
         */

        const response =
    await fetch(
        "/api/predictions?type=daily_slip&date=" +
        encodeURIComponent(date)
    );


        if (!response.ok) {

            /*
             * No published slip is not
             * a page-breaking error.
             */

            card.style.display =
                "none";

            return;

        }


        const data =
            await readJson(response);


        const slip =
            data.slip ||
            data.daily_slip ||
            data.data ||
            null;


        if (!slip) {

            card.style.display =
                "none";

            return;

        }


        /*
         * Never display a draft slip
         * publicly.
         */

        if (
            normalizeStatus(
                slip.status
            ) !==
            "PUBLISHED"
        ) {

            card.style.display =
                "none";

            return;

        }


        /*
         * Make sure the returned row
         * actually belongs to today.
         */

        if (
            slip.prediction_date &&
            String(
                slip.prediction_date
            ) !== String(date)
        ) {

            card.style.display =
                "none";

            return;

        }


        if (
            !slip.booking_code ||
            !String(
                slip.booking_code
            ).trim()
        ) {

            card.style.display =
                "none";

            return;

        }


        showDailySlip(
            slip
        );

    }

    catch (error) {

        console.error(
            "Daily slip loading error:",
            error
        );


        card.style.display =
            "none";

    }

}


/* =====================================================
   SHOW DAILY SLIP
===================================================== */

function showDailySlip(
    slip
) {

    const card =
        document.getElementById(
            "dailySlip"
        );


    const code =
        String(
            slip.booking_code ||
            ""
        ).trim();


    const bookmaker =
        String(
            slip.bookmaker ||
            ""
        ).trim();


    if (!code) {

        card.style.display =
            "none";

        return;

    }


    currentBookingCode =
        code;


    /*
     * Main prominent booking code.
     */

    document.getElementById(
        "bookingCode"
    ).textContent =
        code;


    /*
     * Booking code detail.
     */

    document.getElementById(
        "bookingCodeDetail"
    ).textContent =
        code;


    /*
     * Bookmaker.
     */

    document.getElementById(
        "bookmakerDetail"
    ).textContent =
        bookmaker ||
        "—";


    /*
     * Show the card.
     */

    card.style.display =
        "block";


    /*
     * Attach copy button.
     */

    document.getElementById(
        "copyButton"
    ).onclick =
        copyBookingCode;

}


/* =====================================================
   COPY BOOKING CODE
===================================================== */

async function copyBookingCode() {

    if (!currentBookingCode) {

        return;

    }


    const button =
        document.getElementById(
            "copyButton"
        );


    const oldText =
        button.textContent;


    try {

        if (
            navigator.clipboard &&
            navigator.clipboard.writeText
        ) {

            await navigator.clipboard.writeText(
                currentBookingCode
            );

        }

        else {

            /*
             * Fallback for older browsers.
             */

            const textarea =
                document.createElement(
                    "textarea"
                );

            textarea.value =
                currentBookingCode;

            textarea.style.position =
                "fixed";

            textarea.style.opacity =
                "0";

            document.body.appendChild(
                textarea
            );

            textarea.focus();

            textarea.select();

            document.execCommand(
                "copy"
            );

            textarea.remove();

        }


        button.textContent =
            "✅ COPIED";

    }

    catch (error) {

        console.error(
            "Copy error:",
            error
        );

        button.textContent =
            "⚠️ COPY FAILED";

    }


    setTimeout(
        function() {

            button.textContent =
                oldText;

        },
        1500
    );

}


/* =====================================================
   RENDER PREDICTIONS
===================================================== */

function renderPredictions(
    predictions
) {

    const box =
        document.getElementById(
            "predictions"
        );


    if (!predictions.length) {

        box.innerHTML = `

            <div class="empty">

                No published predictions
                for this date yet.

            </div>

        `;

        return;

    }


    const groups =
        {};


    predictions.forEach(
        function(item) {

            const key =
                item.league ||
                "Other Leagues";


            if (!groups[key]) {

                groups[key] = {

                    name:
                        key,

                    country:
                        item.country ||
                        "",

                    items: []

                };

            }


            groups[key]
                .items
                .push(item);

        }
    );


    const leagues =
        Object.values(
            groups
        );


    leagues.sort(
        function(a, b) {

            return (
                getLeaguePriority(
                    a.name
                ) -
                getLeaguePriority(
                    b.name
                )
            );

        }
    );


    let html = "";


    leagues.forEach(
        function(league) {

            html += `

                <section class="league">

                    <div class="league-header">

                        <div>

                            <div class="league-name">
                                🏆
                                ${escapeHtml(
                                    league.name
                                )}
                            </div>

                            <div class="league-country">
                                ${escapeHtml(
                                    league.country
                                )}
                            </div>

                        </div>

                        <div class="league-count">

                            ${league.items.length}
                            PICKS

                        </div>

                    </div>

            `;


            league.items.forEach(
                function(item) {

                    html +=
                        buildPrediction(
                            item
                        );

                }
            );


            html += `
                </section>
            `;

        }
    );


    box.innerHTML =
        html;

}


/* =====================================================
   BUILD PREDICTION
===================================================== */

function buildPrediction(
    item
) {

    const kickoff =
        formatKickoff(
            item.kickoff
        );


    return `

        <article class="prediction">

            <div class="pred-top">

                <span>

                    #${escapeHtml(
                        String(
                            item.fixture_id ||
                            ""
                        )
                    )}

                </span>

                <span>

                    🕐
                    ${escapeHtml(
                        kickoff
                    )}

                </span>

            </div>


            <div class="pred-teams">

                <div class="team">

                    ${escapeHtml(
                        item.home_team
                    )}

                </div>


                <div class="vs">

                    VS

                </div>


                <div class="team away">

                    ${escapeHtml(
                        item.away_team
                    )}

                </div>

            </div>


            <div class="pick-box">

                <div class="pick-market">

                    ${escapeHtml(
                        item.market
                    )}

                </div>


                <div class="pick-selection">

                    ${escapeHtml(
                        item.selection
                    )}

                </div>


                <span class="confidence">

                    ⭐ Confidence
                    ${escapeHtml(
                        String(
                            item.confidence
                        )
                    )}/10

                </span>

            </div>


            ${
                item.analysis
                ?
                `
                <div class="analysis">

                    ${escapeHtml(
                        item.analysis
                    )}

                </div>
                `
                :
                ""
            }

        </article>

    `;

}


/* =====================================================
   TODAY — NIGERIA DATE
===================================================== */

function getToday() {

    const now =
        new Date();


    const parts =
        new Intl.DateTimeFormat(
            "en-CA",
            {
                timeZone:
                    "Africa/Lagos",

                year:
                    "numeric",

                month:
                    "2-digit",

                day:
                    "2-digit"
            }
        ).formatToParts(now);


    const values = {};


    parts.forEach(
        function(part) {

            if (
                part.type !==
                "literal"
            ) {

                values[
                    part.type
                ] =
                    part.value;

            }

        }
    );


    return (
        values.year +
        "-" +
        values.month +
        "-" +
        values.day
    );

}


/* =====================================================
   DATE DISPLAY
===================================================== */

function formatDate(
    date
) {

    if (!date) {

        return "";

    }


    const d =
        new Date(
            date +
            "T00:00:00"
        );


    if (
        Number.isNaN(
            d.getTime()
        )
    ) {

        return date;

    }


    return d.toLocaleDateString(
        "en-NG",
        {

            day:
                "2-digit",

            month:
                "short",

            year:
                "numeric"

        }
    );

}


/* =====================================================
   KICKOFF
===================================================== */

function formatKickoff(
    value
) {

    if (!value) {

        return "Time unavailable";

    }


    const d =
        new Date(value);


    if (
        Number.isNaN(
            d.getTime()
        )
    ) {

        return "Time unavailable";

    }


    return d.toLocaleString(
        "en-NG",
        {

            timeZone:
                "Africa/Lagos",

            day:
                "2-digit",

            month:
                "short",

            hour:
                "2-digit",

            minute:
                "2-digit",

            hour12:
                false

        }
    ) + " WAT";

}


/* =====================================================
   STATUS
===================================================== */

function normalizeStatus(
    status
) {

    return String(
        status ||
        ""
    )
    .trim()
    .toUpperCase();

}


/* =====================================================
   LEAGUE PRIORITY
===================================================== */

const TOP_LEAGUES = [

    "Premier League",
    "La Liga",
    "Bundesliga",
    "Serie A",
    "Ligue 1",

    "UEFA Champions League",
    "UEFA Europa League",
    "UEFA Conference League",

    "Eredivisie",
    "Primeira Liga",
    "Saudi Pro League",
    "Belgian Pro League",
    "Süper Lig",
    "Scottish Premiership",

    "Brasileirão Série A",
    "Liga Profesional Argentina",
    "Liga MX",
    "MLS",

    "Championship",
    "2. Bundesliga",
    "Serie B",
    "Ligue 2",
    "LaLiga 2",

    "Copa Libertadores",
    "Copa Sudamericana",

    "CAF Champions League",
    "CAF Confederation Cup"

];


function getLeaguePriority(
    name
) {

    const normalized =
        normalizeLeague(
            name
        );


    for (
        let i = 0;
        i < TOP_LEAGUES.length;
        i++
    ) {

        const target =
            normalizeLeague(
                TOP_LEAGUES[i]
            );


        if (
            normalized === target ||
            normalized.includes(target) ||
            target.includes(normalized)
        ) {

            return i;

        }

    }


    return 1000;

}


function normalizeLeague(
    name
) {

    return String(
        name || ""
    )
    .normalize("NFD")
    .replace(
        /[\u0300-\u036f]/g,
        ""
    )
    .toLowerCase()
    .replace(
        /[^a-z0-9]+/g,
        " "
    )
    .trim();

}


/* =====================================================
   JSON
===================================================== */

async function readJson(
    response
) {

    const raw =
        await response.text();


    try {

        return JSON.parse(
            raw
        );

    }

    catch {

        throw new Error(
            "Server returned invalid JSON."
        );

    }

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(
    value
) {

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}
